---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Upgrade Filature

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: "Filature docker image sha"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout # zizmor: ignore[artipacked] credentials are required to push the pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Update HelmRelease File
        env:
          SHA256: ${{ inputs.image_sha }}
        run: |
          VERSION="jvm-development@sha256:${SHA256}" yq eval '.spec.values.controllers.filature.containers.main.image.tag = strenv(VERSION)' \
            -i kubernetes/apps/default/filature/app/helmrelease.yaml

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA256: ${{ inputs.image_sha }}
        run: |
          set -euo pipefail
          if git diff --quiet -- kubernetes/apps/default/filature/app/helmrelease.yaml; then
            echo "No image change; skipping pull request"
            exit 0
          fi
          git config user.name "Homelab Bot"
          git config user.email "homelab@bot.com"
          branch="ci/filature-${SHA256::7}"
          git checkout -b "${branch}"
          git commit -m "chore(filature): upgrade to latest" \
            kubernetes/apps/default/filature/app/helmrelease.yaml
          git push origin "${branch}"
          gh pr create --base main --head "${branch}" \
            --title "chore(filature): upgrade to latest" \
            --body "Automated Filature image upgrade to \`sha256:${SHA256}\`."
