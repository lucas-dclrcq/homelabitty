---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Upgrade Filature

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: "Filature docker image sha"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update HelmRelease File
        env:
          SHA256: ${{ inputs.image_sha }}
        run: |
          VERSION="jvm-development@sha256:${SHA256}" yq eval '.spec.values.controllers.filature.containers.main.image.tag = strenv(VERSION)' \
            -i kubernetes/apps/default/filature/app/helmrelease.yaml

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore(filature): upgrade to latest"
          branch: ci/filature
          delete-branch: true
          title: "chore(filature): upgrade to latest"
          body: "Automated Filature image upgrade."
          author: "Homelab Bot <homelab@bot.com>"
          committer: "Homelab Bot <homelab@bot.com>"
