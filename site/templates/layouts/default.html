{@io.quarkiverse.roq.frontmatter.runtime.model.Page page}
{@io.quarkiverse.roq.frontmatter.runtime.model.Site site}
<!DOCTYPE html>
<html lang="{page.data.getString('lang') ?: site.data.getString('lang') ?: 'en'}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {#seo page site/}
  {#favicon site/}
  <script type="module" src="{site.file('js/mermaid-init.js')}"></script>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      max-width: 52rem;
      margin: 0 auto;
      padding: 0 1.25rem 3rem;
      color: #1a1a1a;
      background: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      body { color: #e6e6e6; background: #111827; }
      a { color: #7cc4ff; }
      code { background: #1f2937; }
      table { border-color: #374151; }
      th, td { border-color: #374151; }
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      padding: 1.25rem 0;
      border-bottom: 1px solid #e5e7eb;
      margin-bottom: 1.5rem;
    }
    header .brand { font-weight: 700; font-size: 1.15rem; text-decoration: none; color: inherit; }
    header nav { display: flex; gap: 1rem; margin-left: auto; }
    a { text-decoration: none; }
    a:hover { text-decoration: underline; }
    main { max-width: 100%; }
    article h1 { font-size: 1.75rem; }
    code { background: #f3f4f6; padding: 0.15em 0.35em; border-radius: 4px; font-size: 0.9em; }
    pre { background: #f3f4f6; padding: 1rem; border-radius: 6px; overflow-x: auto; }
    pre code { background: none; padding: 0; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #e5e7eb; padding: 0.5rem 0.75rem; text-align: left; }
    img { max-width: 100%; }
    .mermaid {
      display: flex;
      justify-content: center;
      margin: 1.5rem 0;
      padding: 1rem;
      background: #f3f4f6;
      border-radius: 8px;
      overflow-x: auto;
    }
    .mermaid svg { max-width: 100%; height: auto; }
    footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid #e5e7eb; color: #6b7280; font-size: 0.85rem; }
    @media (prefers-color-scheme: dark) {
      header, footer { border-color: #374151; }
      code, pre, .mermaid { background: #1f2937; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="{site.url('/')}">{site.title}</a>
    <nav>
      <a href="{site.url('/apps/')}">Applications</a>
      <a href="{site.url('/namespaces/')}">Namespaces</a>
      <a href="{site.url('/docs/')}">Docs</a>
    </nav>
  </header>
  <main>
    {#insert /}
  </main>
  <footer>
    Generated with <a href="https://roq.quarkiverse.io/">Roq</a> — source in the
    <a href="https://github.com/lucas-dclrcq/homelabitty">homelabitty</a> repo.
  </footer>
</body>
</html>
