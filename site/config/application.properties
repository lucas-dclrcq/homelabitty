# Roq site configuration
site.url=https://docs.hoohoot.org
site.default-locale=en

# Collections (directories under content/)
site.collections.docs.layout=page
site.collections.docs.future=true
site.collections.namespaces.layout=page
site.collections.namespaces.future=true
site.collections.apps.layout=page
site.collections.apps.future=true

# Co-located markdown may contain literal { } (code samples), so do not parse
# Qute expressions in synced content pages.
site.escaped-pages=docs/**,namespaces/**,apps/**
