[env]
_.file = ".env"
FLATE_PATH = '{{config_root}}/kubernetes/flux/config'
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/talosconfig"
JUST_UNSTABLE = "1"

[hooks]
postinstall = "lefthook install"

[tools]
actionlint = "1.7.12"
"github:home-operations/flate" = "v0.7.3"
"github:mitsuhiko/minijinja" = "3.1.0"
jq = "1.8.2"
just = "1.59.0"
lefthook = "2.2.2"
node = "26.13.0"
oxfmt = "0.75.0"
shellcheck = "0.11.0"
talos = "1.14.5"
yq = "4.54.3"
zizmor = "1.32.0"
