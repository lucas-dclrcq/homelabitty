---
# VictoriaLogs ingests the journald export format natively, so
# systemd-journal-upload is the whole shipper - no vector/promtail needed.
#
# The target is victoria-logs-ingest, a LoadBalancer dedicated to LAN clients
# (kubernetes/apps/observability/victoria-logs/app/service-ingest.yaml), not
# the internal gateway: see the comment in that file for the history. Plain
# http, so no certificate handling here.
#
# Leave the URL without a trailing /upload and without query arguments:
# systemd-journal-upload appends /upload to whatever it is given unless it
# already ends with it, so a query string would end up with /upload glued
# behind it and VictoriaLogs would answer "unsupported path requested". That
# is also why journald stream fields are set on the server side, with
# -journald.streamFields in the HelmRelease.
journal_upload_url: "http://vlogs-ingest.hoohoot.xyz:9428/insert/journald"
