---
- name: Reboot node
  ansible.builtin.reboot:

- name: Reload udev rules
  ansible.builtin.command:
    cmd: udevadm control --reload-rules
  changed_when: true
  notify: Trigger udev

- name: Trigger udev
  ansible.builtin.command:
    cmd: udevadm trigger
  changed_when: true

- name: Apply CPU governor
  ansible.builtin.systemd_service:
    name: cpu-governor.service
    state: restarted
    daemon_reload: true

- name: Restart gpsd
  ansible.builtin.systemd_service:
    name: gpsd.service
    state: restarted

- name: Restart chronyd
  ansible.builtin.systemd_service:
    name: chronyd.service
    state: restarted

- name: Restart chrony_exporter
  ansible.builtin.systemd_service:
    name: chrony_exporter.service
    state: restarted
    daemon_reload: true
