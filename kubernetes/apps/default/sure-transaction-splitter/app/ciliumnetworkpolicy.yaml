---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sure-transaction-splitter
spec:
  description: "Receipt extraction and categorisation go through the LiteLLM proxy. Sure itself is reached by its internal hostname (egress.home.arpa/gateway-internal)."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: sure-transaction-splitter
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: litellm
            io.kubernetes.pod.namespace: ai
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
