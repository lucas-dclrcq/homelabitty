---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sure-transaction-splitter
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: crunchy-pgo-secrets
  target:
    name: sure-transaction-splitter-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://{{ .pg_host }}:{{ .pg_port }}/{{ .pg_dbname }}"
        QUARKUS_DATASOURCE_USERNAME: "{{ .pg_user }}"
        QUARKUS_DATASOURCE_PASSWORD: "{{ .pg_password }}"
  dataFrom:
    - extract:
        key: postgres-16-pguser-suretransactionsplitter
      rewrite:
        - regexp:
            source: "(.*)"
            target: "pg_$1"
