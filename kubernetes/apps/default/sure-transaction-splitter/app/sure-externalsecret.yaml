---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Kept apart from the database secret: the app starts without a Sure key (its
# Sure page then reports "not configured"), so a missing Vault entry must not
# keep the pod from starting. Vault key `default/sure-transaction-splitter`,
# field SURE_API_KEY: an API key created in Sure (Settings > API key).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sure-transaction-splitter-sure
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: hashicorp-vault
  target:
    name: sure-transaction-splitter-sure-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SURE_API_KEY: "{{ .SURE_API_KEY }}"
  dataFrom:
    - extract:
        key: default/sure-transaction-splitter
