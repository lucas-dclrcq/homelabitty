---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sure-transaction-splitter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    global:
      createDefaultServiceAccount: false

    controllers:
      sure-transaction-splitter:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        # The receipts volume is ReadWriteOnce.
        strategy: Recreate
        containers:
          app:
            image:
              repository: docker.hoohoot.org/homelab/sure-transaction-splitter
              tag: 0.1.0@sha256:284f05a3ff213b161e229b297d0eb376cb7c5042321f7af6e462601060774587

            env:
              TZ: Europe/Paris
              JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50
              SPLITTER_STORAGE_DIR: /deployments/data/receipts
              SURE_BASE_URL: https://finances.hoohoot.xyz
              LITELLM_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              LLM_MODEL: deepseek-flash
              SURE_WRITES_ENABLED: "true"
              LITELLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: sure-transaction-splitter-litellm
                    key: key

            envFrom:
              - secretRef:
                  name: sure-transaction-splitter-secret

            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /q/health/live
                    port: &port 8080
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /q/health/ready
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 5

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - "ALL"

            resources:
              requests:
                cpu: 25m
                memory: 512Mi
              limits:
                memory: 1536Mi # never set limits.cpu

    defaultPodOptions:
      labels:
        ingress.home.arpa/gateway-internal: allow
        egress.home.arpa/postgres: allow
        egress.home.arpa/gateway-internal: allow
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 185
        runAsGroup: 0
        fsGroup: 185
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    persistence:
      data:
        enabled: true
        existingClaim: *app
        globalMounts:
          - path: /deployments/data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - "receipts.hoohoot.xyz"
        parentRefs:
          - name: internal
            namespace: network
        rules:
          - backendRefs:
              - name: *app
                port: *port
