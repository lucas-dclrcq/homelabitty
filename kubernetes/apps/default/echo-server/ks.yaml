---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app echo-server
  namespace: &namespace default
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # No security-policy/forward-auth component: this app authenticates against
  # pocket-id instead of the authentik proxy outpost, through the SecurityPolicy
  # in ./app/securitypolicy.yaml. The dependency is on the pocket-id
  # Kustomization for the pocketid.internal CRDs and the instance behind them.
  dependsOn:
    - name: pocket-id
      namespace: auth
  path: ./kubernetes/apps/default/echo-server/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  wait: false
  interval: 1h
