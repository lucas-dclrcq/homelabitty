---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: echo-server-oidc
spec:
  oidc:
    provider:
      issuer: https://id.hoohoot.org
      authorizationEndpoint: https://id.hoohoot.org/authorize
      tokenEndpoint: http://pocket-id.auth.svc.cluster.local:1411/api/oidc/token
      endSessionEndpoint: https://id.hoohoot.org/api/oidc/end-session
      backendRefs:
        - group: ""
          kind: Service
          name: pocket-id
          namespace: auth
          port: 1411
    clientIDRef:
      name: echo-server-oidc
    clientSecret:
      name: echo-server-oidc
    redirectURL: https://echo-server.hoohoot.org/oauth2/callback
    logoutPath: /logout
    scopes:
      - profile
      - email
    forwardAccessToken: true
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: echo-server
