---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: echo-server-oidc
spec:
  oidc:
    provider:
      issuer: https://id.hoohoot.org
      # Both endpoints are spelled out so the control plane never fetches
      # /.well-known/openid-configuration through the very gateway it is
      # configuring. The authorization endpoint is browser-facing and stays
      # public; the token exchange is a server-side call, so it goes straight
      # to the pocket-id Service (backendRefs below, granted by
      # apps/auth/pocket-id/app/referencegrant.yaml) rather than hairpinning
      # back in through the external gateway.
      authorizationEndpoint: https://id.hoohoot.org/authorize
      tokenEndpoint: http://pocket-id.auth.svc.cluster.local:1411/api/oidc/token
      endSessionEndpoint: https://id.hoohoot.org/api/oidc/end-session
      backendRefs:
        - group: ""
          kind: Service
          name: pocket-id
          namespace: auth
          port: 1411
    # Both keys live in the Secret the operator writes from
    # ./pocketidoidcclient.yaml, so no client ID is duplicated in Git.
    clientIDRef:
      name: echo-server-oidc
    clientSecret:
      name: echo-server-oidc
    redirectURL: https://echo-server.hoohoot.org/oauth2/callback
    logoutPath: /logout
    scopes:
      - profile
      - email
    # echo-server exists to show what the gateway forwards upstream.
    forwardAccessToken: true
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: echo-server
