---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# The master key is shared with `bookman-api` (same Vault entry): the API writes
# to the index, the browser only ever gets the read-only search key that the
# operator mints and bakes into the SPA at build time.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookman-meilisearch
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: hashicorp-vault
  target:
    name: bookman-meilisearch-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        MEILI_MASTER_KEY: "{{ .MEILI_MASTER_KEY }}"
  dataFrom:
    - extract:
        key: default/bookman
