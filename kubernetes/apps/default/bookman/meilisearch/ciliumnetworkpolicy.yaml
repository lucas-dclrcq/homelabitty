---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
# The gateway may reach Meilisearch (the SPA queries it directly), and so may
# `bookman-api` and the one-shot `bookman-import` Job. Exposure is read-mostly:
# writes need the master key, which never leaves the cluster.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: bookman-meilisearch
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: bookman-meilisearch
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: bookman
            io.kubernetes.pod.namespace: default
      toPorts:
        - ports:
            - port: "7700"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: bookman-import
            io.kubernetes.pod.namespace: default
      toPorts:
        - ports:
            - port: "7700"
              protocol: TCP
