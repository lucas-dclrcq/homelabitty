---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
# The `egress.home.arpa/*` pod labels cover DNS and the world (BAN/Nominatim
# geocoding, the Mistral embedder); reaching Meilisearch in this namespace needs
# an explicit rule, exactly like the API.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: bookman-import
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: bookman-import
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: bookman-meilisearch
            io.kubernetes.pod.namespace: default
      toPorts:
        - ports:
            - port: "7700"
              protocol: TCP
