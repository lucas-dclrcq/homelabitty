---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/core/persistentvolumeclaim_v1.json
# Temporary home for the ingestion snapshots: the Prospectacles workbook and the
# ecotour export (~16 MB together). They used to ship inside the image
# (`COPY data ./data`), which grew every build and pinned the image to a data
# snapshot. Instead, the import Job's `fetch-snapshots` init container downloads
# them at pinned commits into this claim, which is mounted at `/app/data` —
# where `bookman-ingest` looks by default.
#
# One-shot, like the Job itself: once the import reports `Complete`, delete this
# claim together with the Job and the scratch claim, and remove the whole import
# directory from Git (see `../ks.yaml`). A plain claim rather than the `kopiur`
# component: the snapshots are reproducible from Git, so there is nothing worth
# snapshotting or backing up.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookman-import-data
spec:
  storageClassName: ceph-block
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi
