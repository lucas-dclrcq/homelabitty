---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/batch/job_v1.json
# One-shot first load of the directory index.
#
# The stages mirror the bulk chain in the bookman repository (`README.md` §5 and
# `docs/PRODUCTION.md` §12): stage both sources, geocode, deduplicate, push to
# Meilisearch and apply the index settings + embedder. Everything is idempotent —
# `run` rewrites its NDJSON, `index` upserts and `settings` re-applies — so the
# Job can simply be deleted to run it again:
#   kubectl -n default delete job bookman-import
#
# The source snapshots are **not** baked into the image. The `fetch-snapshots`
# init container downloads the Prospectacles workbook and the ecotour export, at
# pinned commits, from the public bookman repository into the temporary
# `bookman-import-data` claim (see `data-pvc.yaml`). The ingest container mounts
# that claim at `/app/data`, the path `bookman-ingest` resolves its defaults
# against (the CLI defaults moved from `docs/` to `data/` upstream).
#
# This is a one-shot bootstrap: once the Job reports `Complete`, delete it and
# both claims, then drop the `bookman-import` Kustomization and this directory
# from Git (see `../ks.yaml`). The directory index lives in Meilisearch, so
# nothing durable is lost.
#
# The staged working set and the geocoder cache live on a separate claim (see
# `pvc.yaml`) so a retry resumes the slow geocode stage instead of restarting it.
apiVersion: batch/v1
kind: Job
metadata:
  name: bookman-import
  annotations:
    # The init container is plain shell: `$base`, `$dest` and `$(…)` must reach
    # it verbatim instead of being read as Flux postBuild substitutions.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  # The chain is long (geocoding throttles to ~1 request/second upstream), so
  # allow it to fail once and retry rather than giving up on a transient error.
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookman-import
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        # The image's `bookman` user, and the owner of the claim mounts: the
        # init container writes the snapshots and the ingest container needs a
        # writable scratch directory (the first draft forgot `fsGroup`, so the
        # non-root process could not write either claim).
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fetch-snapshots
          # Same plain Alpine + busybox `wget` as the basemap Job.
          image: docker.io/library/alpine:3.22
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              # Pinned commits, not a branch: the import is reproducible, and a
              # later push to `main` cannot change what a retry reads. Bump both
              # when a new snapshot is committed upstream.
              base=https://git.hoohoot.org/oknozor/bookman/raw/commit
              fetch() {
                dest="/data/$1"
                if [ -s "$dest" ]; then
                  echo "present: $1"
                  return 0
                fi
                echo "fetching: $1"
                # Write beside the final name and move on success, so an
                # interrupted download never looks like a complete snapshot.
                wget -q -O "$dest.part" "$2"
                mv "$dest.part" "$dest"
              }
              fetch 'Prospectacles - INTÉGRAAL - 28.08.2025.xlsx' \
                "$base/a36d625b285bd4aebb06b3fc134e874a04698bbf/data/Prospectacles%20-%20INT%C3%89GRAAL%20-%2028.08.2025.xlsx"
              fetch 'ecotour-export.json' \
                "$base/afbc4dd42711d5a6edefc54ef20a2a47e3450925/data/ecotour-export.json"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: ingest
          image: docker.hoohoot.org/bookman/bookman:latest
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              # The pipeline's scratch directory is the `--build-dir` flag, not
              # `BUILD_DIR` (that variable only configures the API). The flag is
              # repeated rather than held in a shell variable, because Flux's
              # postBuild substitution rewrites dollar-prefixed names.
              bookman-ingest --build-dir /var/lib/bookman/build sources
              bookman-ingest --build-dir /var/lib/bookman/build run prospectacles
              bookman-ingest --build-dir /var/lib/bookman/build run ecotour
              bookman-ingest --build-dir /var/lib/bookman/build geocode
              bookman-ingest --build-dir /var/lib/bookman/build merge
              bookman-ingest --build-dir /var/lib/bookman/build index
              bookman-ingest --build-dir /var/lib/bookman/build settings
          env:
            - name: MEILI_URL
              value: http://bookman-meilisearch.default.svc.cluster.local:7700
            - name: BOOKMAN_PROVIDER_MODE
              value: live
            # `run ecotour` prefers the live Supabase API when
            # ECOTOUR_SUPABASE_ANON_KEY is set and otherwise reads the committed
            # snapshot. An explicit `env` entry beats `envFrom`, so an empty
            # value here pins the import to the snapshot even if the Vault entry
            # carries the key (the source logs the failed call and falls back).
            - name: ECOTOUR_SUPABASE_ANON_KEY
              value: ""
            - name: RUST_LOG
              value: info
          envFrom:
            - secretRef:
                name: bookman-secret # MEILI_MASTER_KEY, MISTRAL_API_KEY
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          volumeMounts:
            # The two pinned snapshots: `bookman-ingest` defaults to
            # `data/<file>` relative to its working directory (`/app`), so the
            # claim name must match. Read-only: the pipeline only reads it.
            - name: data
              mountPath: /app/data
              readOnly: true
            # Staged NDJSON and the geocoder cache. The claim outlives the Job
            # on purpose: geocoding takes hours and a retry should resume.
            - name: scratch
              mountPath: /var/lib/bookman
            - name: tmp
              mountPath: /tmp
      volumes:
        # Temporary: filled by the init container, deleted with the Job.
        - name: data
          persistentVolumeClaim:
            claimName: bookman-import-data
        - name: scratch
          persistentVolumeClaim:
            claimName: bookman-import-scratch
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
