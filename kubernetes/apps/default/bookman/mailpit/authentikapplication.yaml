---
# Forward-auth gate for the public Mailpit UI: only members of `Hoohoot Users`
# reach it. The Envoy SecurityPolicy that enforces this lives in the
# `security-policy/forward-auth` component referenced by `ks.yaml`.
apiVersion: authentik.starry.blue/v1alpha1
kind: AuthentikApplication
metadata:
  name: bookman-mailpit
spec:
  slug: bookman-mailpit
  name: BookMan Mailpit
  launchURL: https://bookman-mail.hoohoot.org
  group: Misc
  adopt: IfMatch
  provider:
    flows:
      authorization:
        slug: default-provider-authorization-implicit-consent
      invalidation:
        slug: default-provider-invalidation-flow
    proxy:
      forwardAuthSingle:
        externalHost: https://bookman-mail.hoohoot.org
      interceptHeaderAuth: true
      accessTokenValidity: hours=24
      refreshTokenValidity: days=30
      outpost:
        name: Oauth2 Proxy Outpost
  access:
    rules:
      - group:
          name: Hoohoot Developers
