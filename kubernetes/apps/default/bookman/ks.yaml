# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app bookman
  namespace: &namespace default
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur
  dependsOn:
    - name: external-secrets-stores
      namespace: external-secrets
    - name: crunchy-postgres-operator
      namespace: flux-system
    - name: envoy-gateway
      namespace: network
    - name: bookman-meilisearch
      namespace: default
  path: ./kubernetes/apps/default/bookman/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  wait: false
  interval: 1h
  postBuild:
    substitute:
      APP: *app
      # Raw provider payloads (for replay) and geocode cache, see BUILD_DIR.
      KOPIUR_CAPACITY: 5Gi
---
# Meilisearch serves the directory index. It waits for readiness so the API and
# the import Job do not race it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app bookman-meilisearch
  namespace: &namespace default
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur
  dependsOn:
    - name: external-secrets-stores
      namespace: external-secrets
    - name: envoy-gateway
      namespace: network
  path: ./kubernetes/apps/default/bookman/meilisearch
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  wait: true
  interval: 1h
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 10Gi
---
# Fetches the multi-gigabyte France extract with a one-shot Job and waits for it
# to finish so the ReadWriteOnce tiles claim is never mounted by two pods.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app bookman-basemap
  namespace: &namespace default
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur
  path: ./kubernetes/apps/default/bookman/basemap
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  wait: true
  interval: 1h
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 20Gi
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app bookman-martin
  namespace: &namespace default
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: envoy-gateway
      namespace: network
    - name: bookman-basemap
      namespace: default
  path: ./kubernetes/apps/default/bookman/martin
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  wait: false
  interval: 1h
  postBuild:
    substitute:
      APP: *app
---
# One-shot first-load of the directory index. The Job is idempotent and can be
# deleted to re-import. Its spec.template is immutable, so a template change
# (e.g. bumping the pinned snapshot commits) must recreate the Job rather than
# patch it in place.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app bookman-import
  namespace: &namespace default
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-stores
      namespace: external-secrets
    - name: bookman
      namespace: default
    - name: bookman-meilisearch
      namespace: default
  path: ./kubernetes/apps/default/bookman/import
  prune: true
  # The Job's spec.template is immutable: recreate it on template changes.
  force: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  wait: false
  interval: 1h
  postBuild:
    substitute:
      APP: *app
---
# Test mail sink (mailpit) for the API's SMTP settings.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app bookman-mailpit
  namespace: &namespace default
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: envoy-gateway
      namespace: network
  path: ./kubernetes/apps/default/bookman/mailpit
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  wait: false
  interval: 1h
  postBuild:
    substitute:
      APP: *app
