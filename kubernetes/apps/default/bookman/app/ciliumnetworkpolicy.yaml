---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
# Ingress from the gateway is handled by the `ingress.home.arpa/*` pod labels
# and DNS/Postgres/world egress by the `egress.home.arpa/*` ones. What those
# policies cannot express is same-namespace traffic, so the API's calls to
# Meilisearch and to the `bookman-mailpit` SMTP sink are allowed explicitly.
# Real mail is deliberately not possible through a cluster relay: this is a
# test deployment, and `smtp-relay` (maddy) is not allowed from here.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: bookman
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: bookman
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: bookman-meilisearch
            io.kubernetes.pod.namespace: default
      toPorts:
        - ports:
            - port: "7700"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: bookman-mailpit
            io.kubernetes.pod.namespace: default
      toPorts:
        - ports:
            - port: "1025"
              protocol: TCP
