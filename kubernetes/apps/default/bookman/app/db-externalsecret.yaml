---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# The transactional store: `bookman` user + database in the shared Postgres
# cluster (see kubernetes/apps/infrastructure/crunchy-postgres-operator/cluster).
# The API applies its embedded migrations on boot, so the role needs DDL rights
# on first start (pgcrypto is a trusted extension, so the owner may create it).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookman-db
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: crunchy-pgo-secrets
  target:
    name: bookman-db-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "{{ .uri }}"
  dataFrom:
    - extract:
        key: postgres-16-pguser-bookman
