---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Application secrets, injected verbatim through `envFrom`, so the Vault entry
# must use the environment variable names the API reads. The deployment needs at
# least:
#
#   MEILI_MASTER_KEY                 shared with `bookman-meilisearch`
#   BOOKMAN_BOOTSTRAP_ADMIN_EMAIL    first admin, seeded on the first boot
#   BOOKMAN_BOOTSTRAP_ADMIN_PASSWORD (registration is admin-only, so without
#                                     these there is no way into a fresh install)
#
# and optionally MISTRAL_API_KEY (hybrid search + artist-add embeddings),
# SMTP_URL (campaign mail; without it mail is only logged), HUNTER_API_KEY,
# DISCOGS_TOKEN, ECOTOUR_SUPABASE_ANON_KEY and MAPTILER_KEY. See
# docs/PRODUCTION.md in the bookman repository.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookman
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: hashicorp-vault
  target:
    name: bookman-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: default/bookman
