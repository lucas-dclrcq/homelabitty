---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Application secrets, injected verbatim through `envFrom`, so the Vault entry
# must use the environment variable names the API (or the import Job) reads.
# Only bootstrap values still come from the environment:
#
#   MEILI_MASTER_KEY                 shared with `bookman-meilisearch`
#   BOOKMAN_BOOTSTRAP_ADMIN_EMAIL    first admin, seeded on the first boot
#   BOOKMAN_BOOTSTRAP_ADMIN_PASSWORD (registration is admin-only, so without
#                                     these there is no way into a fresh install)
#   MISTRAL_API_KEY                  the import's `settings` stage configures the
#                                     `mistral` embedder with it; the API itself
#                                     re-embeds through Meilisearch
#
# Everything else is a runtime setting stored in Postgres (`app_settings`) and
# entered in the admin Settings tab: the browser-facing Meilisearch URL and
# search-only key, the basemap style URL, the MusicBrainz/Resident Advisor user
# agents, the Hunter and Discogs keys, contact enrichment and mail (SMTP URL,
# From, dry-run, public base URL). See docs/PRODUCTION.md §3 in the bookman
# repository.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookman
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: hashicorp-vault
  target:
    name: bookman-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: default/bookman
