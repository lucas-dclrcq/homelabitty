# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app rustical
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    defaultPodOptions:
      labels:
        ingress.home.arpa/gateway-external: allow
        egress.home.arpa/gateway-external: allow
        egress.home.arpa/tracing: allow
      securityContext:
        runAsUser: 1026
        runAsGroup: 1500
        runAsNonRoot: true
        fsGroup: 1500
        fsGroupChangePolicy: "OnRootMismatch"

    controllers:
      rustical:
        containers:
          app:
            image:
              repository: ghcr.io/lennart-k/rustical
              tag: 0.19.1@sha256:f79ad0c8c0958f27014021f99c8c40212289d660f17c9b4f782955b6277b53da

            env:
              RUSTICAL_TRACING__ENDPOINT: http://vtsingle-vmks.observability.svc.cluster.local:4317

            envFrom:
              - secretRef:
                  name: rustical-secret

            probes:
              liveness:
                enabled: true
                type: HTTP
              readiness:
                enabled: true
                type: HTTP
              startup:
                enabled: true
                type: HTTP

            securityContext:
              readOnlyRootFilesystem: true

            resources:
              requests:
                memory: 50Mi
                cpu: 50m
              limits:
                memory: 100Mi

    service:
      app:
        controller: *app
        ports:
          http:
            port: 4000
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.hoohoot.org"
        parentRefs:
          - name: external
            namespace: network

    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /var/lib/rustical
      tmp:
        type: emptyDir
