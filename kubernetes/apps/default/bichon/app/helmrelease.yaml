# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bichon
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 30m
  values:
    defaultPodOptions:
      labels:
        ingress.home.arpa/gateway-internal: allow
        egress.home.arpa/internet: allow

    controllers:
      bichon:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          securityContext:
            runAsUser: 1026
            runAsGroup: 1500
            fsGroup: 1500
            runAsNonRoot: true
            fsGroupChangePolicy: OnRootMismatch

        # Bichon ships one-shot storage/index migrations that the server never runs
        # itself: on a format bump it refuses to serve and listens on the normal
        # port as a "Bichon Maintenance" 503 page instead. Probes are disabled and
        # the HelmRelease still reports Ready, so nothing surfaces it but the 503.
        # Run the migration before the server starts, once per image tag.
        initContainers:
          storage-migrate:
            image: &image
              repository: docker.io/rustmailer/bichon
              tag: &tag 2.4.0

            command:
              - /bin/sh
              - -c
              - |
                set -eu
                stamp=/data/.migrated-version

                if [ "$(cat "$stamp" 2>/dev/null || true)" = "$BICHON_VERSION" ]; then
                  echo "storage already migrated for $BICHON_VERSION, nothing to do"
                  exit 0
                fi

                if [ ! -d /data/bichon-storage ]; then
                  # Fresh PVC (or a kopiur restore that has not landed): the server
                  # lays the store out itself, there is nothing to migrate yet.
                  echo "no bichon-storage yet, skipping migration"
                else
                  # The on-disk storage layout (fjall -> bichon-blob was 1 -> 2) is
                  # only migratable through bichon-admin's TTY-only menu, which
                  # cannot be scripted. Fail loudly here rather than let the server
                  # crash-loop on "Incompatible data format detected".
                  have=$(cat /data/STORAGE_VERSION 2>/dev/null || echo unknown)
                  if [ "$have" != "$BICHON_EXPECT_STORAGE_VERSION" ]; then
                    echo "STORAGE_VERSION is $have, expected $BICHON_EXPECT_STORAGE_VERSION"
                    echo "run the interactive 'bichon-admin' migration by hand, then bump BICHON_EXPECT_STORAGE_VERSION"
                    exit 1
                  fi

                  # Self-gating: without --force this exits early when the index is
                  # already at the current format, so a tag bump that carries no
                  # index change costs a few seconds.
                  bichon-admin reindex --yes

                  # A real rebuild keeps the previous index as a rollback copy;
                  # keep the newest one only so they do not pile up on the PVC.
                  ls -1d /data/bichon-indices.old-* 2>/dev/null | sort | head -n -1 | xargs -r rm -rf
                fi

                printf '%s' "$BICHON_VERSION" > "$stamp"

            env:
              BICHON_ROOT_DIR: &rootDir /data
              BICHON_VERSION: *tag
              BICHON_EXPECT_STORAGE_VERSION: "2"

            envFrom: &envFrom
              - secretRef:
                  name: bichon-secret

            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi

            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

        containers:
          app:
            image: *image

            env:
              BICHON_HTTP_PORT: &httpPort 15630
              BICHON_LOG_LEVEL: info
              BICHON_PUBLIC_URL: https://bichon.hoohoot.xyz
              BICHON_ROOT_DIR: *rootDir

            envFrom: *envFrom

            probes:
              liveness: &probes
                enabled: false
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *httpPort
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes

            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi

            securityContext: *securityContext
    service:
      app:
        ports:
          http:
            port: *httpPort
    persistence:
      # fjall (bichon's embedded KV store) takes an exclusive flock on a
      # read-only fd, which returns EBADF on NFS — must stay on block storage.
      data:
        existingClaim: *app
        globalMounts:
          - path: /data

    route:
      app:
        hostnames:
          - bichon.hoohoot.xyz
        parentRefs:
          - name: internal
            namespace: network
