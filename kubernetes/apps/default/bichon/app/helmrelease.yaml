---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bichon
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 30m
  values:
    defaultPodOptions:
      annotations:
        fluentbit.io/parser: level_tsword
      labels:
        ingress.home.arpa/gateway-internal: allow
        egress.home.arpa/internet: allow

    controllers:
      bichon:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          securityContext:
            runAsUser: 1026
            runAsGroup: 1500
            fsGroup: 1500
            runAsNonRoot: true
            fsGroupChangePolicy: OnRootMismatch

        containers:
          app:
            image:
              repository: docker.io/rustmailer/bichon
              tag: 2.2.0

            env:
              BICHON_HTTP_PORT: &httpPort 15630
              BICHON_LOG_LEVEL: info
              BICHON_PUBLIC_URL: https://bichon.hoohoot.xyz
              BICHON_ROOT_DIR: /data

            envFrom:
              - secretRef:
                  name: bichon-secret

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *httpPort
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes

            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      app:
        ports:
          http:
            port: *httpPort
    persistence:
      # fjall (bichon's embedded KV store) takes an exclusive flock on a
      # read-only fd, which returns EBADF on NFS — must stay on block storage.
      data:
        existingClaim: *app
        globalMounts:
          - path: /data

    route:
      app:
        hostnames:
          - bichon.hoohoot.xyz
        parentRefs:
          - name: internal
            namespace: network
