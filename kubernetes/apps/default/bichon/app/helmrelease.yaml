---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bichon
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 30m
  values:
    controllers:
      bichon:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          securityContext:
            runAsUser: ${APP_UID}
            runAsGroup: ${APP_GID}
            fsGroup: ${APP_GID}
            runAsNonRoot: true
            fsGroupChangePolicy: OnRootMismatch

        containers:
          app:
            # bichon 2.x rewrote the on-disk store (fjall -> bichon-blob) and
            # refuses to start on a v1.x data layout:
            #   ERROR bichon_server: Incompatible data format detected.
            #   Error: Generic { message: "Legacy data layout detected" }
            # The migration is the interactive `bichon-admin` TUI shipped in the
            # image, so it cannot run as an initContainer/Job. Pinned to the last
            # v1.x release until the migration is done by hand on the PVC; bump
            # to 2.x only afterwards.
            image:
              repository: docker.io/rustmailer/bichon
              tag: 1.4.3

            env:
              BICHON_HTTP_PORT: &httpPort 15630
              BICHON_LOG_LEVEL: info
              BICHON_PUBLIC_URL: https://bichon.bjw-s.dev
              BICHON_ROOT_DIR: /data

            envFrom:
              - secretRef:
                  name: bichon-secret

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *httpPort
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes

            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      app:
        ports:
          http:
            port: *httpPort
    persistence:
      # fjall (bichon's embedded KV store) takes an exclusive flock on a
      # read-only fd, which returns EBADF on NFS — must stay on block storage.
      data:
        existingClaim: *app
        globalMounts:
          - path: /data

    route:
      app:
        hostnames:
          - bichon.${LIMITED_DOMAIN}
        parentRefs:
          - name: internal
            namespace: network
