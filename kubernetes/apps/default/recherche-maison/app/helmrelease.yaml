---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app recherche-maison
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ghcr.io/lucas-dclrcq/recherche-maison
              tag: latest@sha256:c306a19f430dec1518e7bdeb95f8d643807b5c7a3ad4e5a13f322cd9d5c3f4ab

            env:
              TZ: ${TIMEZONE}

            envFrom:
              - secretRef:
                  name: recherche-maison-secret

            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /q/health/live
                    port: &port 8080
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /q/health/ready
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 5

            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]

            resources:
              requests:
                cpu: 15m
                memory: 256Mi
              limits:
                memory: 1Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true

    service:
      main:
        controller: main
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - "recherche-maison.${LIMITED_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
        rules:
          - backendRefs:
              - name: *app
                port: *port
