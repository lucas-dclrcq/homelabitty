---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homelab-manager
spec:
  description: "Aggregates the authentik API and ships OTLP traces; every target is addressed by its in-cluster Service (see ./externalsecret.yaml). Jellyfin, Matrix and the *arr apps are opened by the egress.home.arpa/{jellyfin,matrix-synapse,sonarr,radarr,lidarr} labels."
  endpointSelector:
    matchLabels:
      app: homelab-manager
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: homelab-manager
            app.kubernetes.io/component: operator
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # AUTHENTIK_BASE_URL uses the in-cluster Service, not the public hostname
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: authentik
            app.kubernetes.io/component: server
            io.kubernetes.pod.namespace: auth
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    # QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vtsingle
            io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homelab-manager-operator
spec:
  description: "The operator reconciles its CRs into the app through the app's HTTP API"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: homelab-manager
      app.kubernetes.io/component: operator
  egress:
    - toEndpoints:
        - matchLabels:
            app: homelab-manager
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
