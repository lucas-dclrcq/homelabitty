---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-manager
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: homelab-manager-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        APP_PUBLIC_URL: "https://hoohoot.org"
        # PG
        DB_REACTIVE_URL: '{{ index . "uri" }}'
        DB_JDBC_URL: '{{ index . "jdbc-uri" }}'
        DB_USERNAME: '{{ index . "user" }}'
        DB_PASSWORD: '{{ index . "password" }}'
        # Matrix client-server API
        MATRIX_BASE_URL: http://matrix-synapse.matrix.svc.cluster.local:8008
        MATRIX_APPSERVICE_ID: homelab-manager
        MATRIX_APPSERVICE_SENDER_LOCALPART: bot
        MATRIX_APPSERVICE_SERVER_NAME: hoohoot.org
        MATRIX_APPSERVICE_DISPLAY_NAME: Johnny
        MATRIX_APPSERVICE_AS_TOKEN: "{{ .JOHNNY_AS_TOKEN }}"
        MATRIX_APPSERVICE_HS_TOKEN: "{{ .JOHNNY_HS_TOKEN }}"
        MATRIX_ROOM_MEDIA: "{{ .MATRIX_ROOM_MEDIA }}"
        MATRIX_ROOM_MUSIC: "{{ .MATRIX_ROOM_MUSIC }}"
        MATRIX_ROOM_SUPPORT: "{{ .MATRIX_ROOM_SUPPORT }}"
        MATRIX_ROOM_BOOKS: "{{ .MATRIX_ROOM_BOOKS }}"
        # Internal APIs
        SONARR_BASE_URL: http://sonarr.downloads.svc.cluster.local
        SONARR_API_KEY: "{{ .SONARR__AUTH__APIKEY }}"
        RADARR_BASE_URL: http://radarr.downloads.svc.cluster.local
        RADARR_API_KEY: "{{ .RADARR__AUTH__APIKEY }}"
        LIDARR_BASE_URL: http://lidarr.downloads.svc.cluster.local:8686
        LIDARR_API_KEY: "{{ .LIDARR__AUTH__APIKEY }}"
        JELLYSTAT_API_TOKEN: "{{ .JELLYSTAT_API_TOKEN }}"
        JELLYFIN_API_KEY: "{{ .JELLYFIN_API_KEY }}"
        JELLYSTAT_BASE_URL: http://jellystat.media.svc.cluster.local:3000
        JELLYFIN_BASE_URL: http://jellyfin.media.svc.cluster.local:8096
        # Matrix Bot
        MATRIX_BOT_ENABLED: "true"
        MATRIX_BOT_ADMINS: "@lucasd:hoohoot.org"
        MATRIX_BOT_PREFIX: johnny
        MATRIX_BOT_USERS: "hoohoot.org"
        # GIPHY
        GIPHY_API_KEY: "{{ .GIPHY_API_KEY }}"
        # OTEL
        QUARKUS_OTEL_ENABLED: "true"
        QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://vtsingle-vmks.observability.svc.cluster.local:4317
        QUARKUS_OTEL_SERVICE_NAME: homelab-manager
        # AUTH
        OIDC_AUTH_SERVER_URL: "https://sso.hoohoot.org/application/o/homelab-manager/"
        OIDC_CLIENT_ID: "{{ .OIDC_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
        QUARKUS_OIDC_AUTHENTICATION_FORCE_REDIRECT_HTTPS_SCHEME: "true"
        QUARKUS_OIDC_AUTHENTICATION_PKCE_REQUIRED: "true"
        QUARKUS_OIDC_AUTHENTICATION_SCOPES: roles
        QUARKUS_OIDC_ROLES_ROLE_CLAIM_PATH: roles
        OPERATOR_API_KEY: "{{ .OPERATOR_API_KEY }}"
        # Authentik
        AUTHENTIK_BASE_URL: "http://authentik-server.auth.svc.cluster.local"
        AUTHENTIK_TOKEN: "{{ .AUTHENTIK_TOKEN }}"
        # cleanup
        CLEANUP_GRACE_DAYS: "7"
        CLEANUP_TARGET_FREE_GB: "10000"
  dataFrom:
    - extract:
        key: common/matrix
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: hashicorp-vault
    - extract:
        key: default/homelab-manager/config
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: hashicorp-vault
    - extract:
        key: media/sonarr/config
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: hashicorp-vault
    - extract:
        key: downloads/radarr
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: hashicorp-vault
    - extract:
        key: downloads/lidarr
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: hashicorp-vault
    - extract:
        key: postgres-16-pguser-homelabmanager
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: crunchy-pgo-secrets
