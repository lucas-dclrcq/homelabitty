---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app immich
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    rawResources:
      netpol-server:
        manifest:
          apiVersion: cilium.io/v2
          kind: CiliumNetworkPolicy
          spec:
            description: "immich-server runs inference requests against the machine-learning controller (IMMICH_MACHINE_LEARNING_URL)"
            endpointSelector:
              matchLabels:
                app.kubernetes.io/name: immich
                app.kubernetes.io/controller: server
            egress:
              - toEndpoints:
                  - matchLabels:
                      app.kubernetes.io/name: immich
                      app.kubernetes.io/controller: machine-learning
                toPorts:
                  - ports:
                      - port: "3003"
                        protocol: TCP
      netpol-machine-learning:
        manifest:
          apiVersion: cilium.io/v2
          kind: CiliumNetworkPolicy
          spec:
            description: "The ML service is only ever called by immich-server"
            endpointSelector:
              matchLabels:
                app.kubernetes.io/name: immich
                app.kubernetes.io/controller: machine-learning
            ingress:
              - fromEndpoints:
                  - matchLabels:
                      app.kubernetes.io/name: immich
                      app.kubernetes.io/controller: server
                toPorts:
                  - ports:
                      - port: "3003"
                        protocol: TCP

    defaultPodOptions:
      labels:
        ingress.home.arpa/gateway-external: allow
        egress.home.arpa/postgres: allow
        egress.home.arpa/internet: allow
        egress.home.arpa/gateway-external: allow

    controllers:
      server:
        strategy: RollingUpdate
        annotations:
          secret.reloader.stakater.com/reload: immich-secret
        pod: &podSecurity
          enableServiceLinks: false
          securityContext:
            runAsUser: 1026
            runAsGroup: 1500
            runAsNonRoot: true
            fsGroup: 1500
            fsGroupChangePolicy: OnRootMismatch
        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.3.5@sha256:485d546a2e31d6a8b4db8423fcba5c109de8c218d93410af115fd1ccfc4352a6
            envFrom:
              - secretRef:
                  name: immich-secret
      machine-learning:
        strategy: RollingUpdate
        annotations:
          secret.reloader.stakater.com/reload: immich-secret
        pod: *podSecurity
        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v3.3.4@sha256:1ab8674e7cec41009abb3812de62a16cc1917e73d486233a5471b048d26fc14d
            envFrom:
              - secretRef:
                  name: immich-secret
            env:
              MPLCONFIGDIR: "/cache/matplotlib"

    service:
      server:
        controller: server
        ports:
          http:
            port: &port 2283
      machine-learning:
        controller: machine-learning
        ports:
          http:
            port: 3003

    route:
      internal:
        annotations:
          homelab-manager.hoohoot.org/enabled: "true"
          homelab-manager.hoohoot.org/category: "Misc"
          homelab-manager.hoohoot.org/description: "Gestionnaire de photos"
          homelab-manager.hoohoot.org/logo-url: "https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/immich.png"
        hostnames:
          - "photos.hoohoot.org"
        parentRefs:
          - name: external
            namespace: network

        rules:
          - backendRefs:
              - identifier: server
                port: *port

    persistence:
      matplotlib:
        type: emptyDir
        advancedMounts:
          server:
            main:
              - path: /config/matplotlib
      library:
        type: nfs
        server: "truenas.lulice.lan"
        path: /mnt/tank/Photos
        advancedMounts:
          server:
            main:
              - path: /usr/src/app/upload
      machine-learning-cache:
        existingClaim: immich-machine-learning-cache
        advancedMounts:
          machine-learning:
            main:
              - path: /cache
                subPath: cache
              - path: /.cache
                subPath: dotCache
      tmpfs:
        type: emptyDir
        advancedMounts:
          server:
            main:
              - path: /usr/src/app/.reverse-geocoding-dump
                subPath: geocoding
              - path: /usr/src/app/.transformers_cache
                subPath: transformers
