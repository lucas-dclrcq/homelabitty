---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kalimba
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: hashicorp-vault
  target:
    name: kalimba-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        QUARKUS_DATASOURCE_JDBC_URL: 'jdbc:postgresql://{{ .pg_host }}:{{ .pg_port }}/{{ .pg_dbname }}'
        QUARKUS_DATASOURCE_USERNAME: '{{ .pg_user }}'
        QUARKUS_DATASOURCE_PASSWORD: '{{ .pg_password }}'
        # base64, 32 bytes - AES-256-GCM key for connector secrets at rest.
        KALIMBA_CONFIG_ENC_KEY: '{{ .KALIMBA_CONFIG_ENC_KEY }}'
  dataFrom:
    - extract:
        key: default/kalimba
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: hashicorp-vault
    - extract:
        key: postgres-16-pguser-kalimba
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: crunchy-pgo-secrets
      rewrite:
        - regexp:
            source: "(.*)"
            target: "pg_$1"
