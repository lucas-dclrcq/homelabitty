---
apiVersion: authentik.starry.blue/v1alpha1
kind: AuthentikApplication
metadata:
  name: kalimba
spec:
  slug: kalimba
  name: Kalimba
  adopt: IfMatch
  provider:
    flows:
      authorization:
        slug: default-provider-authorization-implicit-consent
      invalidation:
        slug: default-provider-invalidation-flow
    oauth2:
      # The SPA is a browser-side Authorization Code + PKCE client
      # (oidc-client-ts, src/main/webui/src/lib/auth.ts): no secret to keep.
      clientType: Public
      redirectURIs:
        - url: "https://kalimba.${LIMITED_DOMAIN}/auth/callback"
          matchingMode: Strict
          type: Authorization
        - url: "https://kalimba.${LIMITED_DOMAIN}/login"
          matchingMode: Strict
          type: Authorization
      scopes:
        - scopeName: openid
        - scopeName: email
        - scopeName: profile
      grantTypes:
        - AuthorizationCode
        - RefreshToken
      # AppUserService keys AppUser on the `sub` claim, so the subject must be
      # stable for the lifetime of the provider.
      subjectMode: HashedUserID
      issuerMode: PerProvider
      includeClaimsInIDToken: true
      # Without this the provider gets a random client id, but the SPA sends
      # the fixed `kalimba-frontend` it reads from GET /api/v1/config. The
      # operator creates and owns the referenced Secret (client-secret only,
      # unused by a public client).
      credentials:
        clientID: kalimba-frontend
        secretRef:
          name: kalimba-oidc
  access:
    rules:
      - group:
          name: Hoohoot Users
