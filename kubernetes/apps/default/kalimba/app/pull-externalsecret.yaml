---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kalimba-pull
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: hashicorp-vault
  target:
    name: kalimba-pull-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        # The registry key must be the host containerd dials. Node container
        # runtimes cannot resolve cluster DNS, so the pull goes out through the
        # external gateway to Harbor's public name and back in (spegel then
        # mirrors the layers cluster-wide).
        .dockerconfigjson: >-
          {"auths":{"docker.${SECRET_DOMAIN}":{"username":"{{ .HARBOR_USERNAME }}","password":"{{ .HARBOR_PASSWORD }}","auth":"{{ printf "%s:%s" .HARBOR_USERNAME .HARBOR_PASSWORD | b64enc }}"}}}
  dataFrom:
    - extract:
        key: default/kalimba
