---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: atuin
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: atuin
  ingress:
    - fromEndpoints:
        - matchLabels:
            gateway.envoyproxy.io/owning-gateway-name: external
            io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
  egress:
    # kube-dns comes from the cluster-wide baseline (see
    # ../../../kube-system/cilium/netpols/README.md) — a local L4 port-53 rule
    # here would shadow the L7 DNS half for any pod labelled dns.home.arpa/l7.
    - toEndpoints:
        - matchLabels:
            postgres-operator.crunchydata.com/cluster: postgres-16
            postgres-operator.crunchydata.com/role: pgbouncer
            io.kubernetes.pod.namespace: infrastructure
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
