---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bambuddy
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    controllers:
      bambuddy:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/maziggy/bambuddy
              tag: 1.2.5.7@sha256:ec3e1fbc84218838d832931d1d5c506d7d81146103a16dfe055684be3a79fa57
            env:
              TZ: Europe/Paris
              LOG_LEVEL: INFO
              PORT: &port 8000
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
            resources:
              requests:
                cpu: 10m
                memory: 100Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      annotations:
        fluentbit.io/parser: level_python
      labels:
        ingress.home.arpa/gateway-internal: allow
        ingress.home.arpa/prometheus: allow
        egress.home.arpa/gateway-external: allow
        egress.home.arpa/mqtt: allow
        # the Bambu printer is on the IoT VLAN (MQTT 8883)
        egress.home.arpa/iot: allow
      securityContext:
        runAsNonRoot: true
        runAsUser: 1026
        runAsGroup: 1500
        fsGroup: 1500
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.hoohoot.xyz"
        parentRefs:
          - name: internal
            namespace: network
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/data
      tmpfs:
        type: emptyDir
        advancedMounts:
          bambuddy:
            app:
              - path: /app/logs
                subPath: logs
              - path: /tmp
                subPath: tmp
              - path: /.cache
                subPath: cache
              - path: /.local
                subPath: local
