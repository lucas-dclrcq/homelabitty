---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app opencloud
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    controllers:
      opencloud:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          enableServiceLinks: false
          securityContext:
            runAsUser: ${APP_UID}
            runAsGroup: ${APP_GID}
            runAsNonRoot: true
            fsGroup: ${APP_GID}
            fsGroupChangePolicy: OnRootMismatch
        strategy: Recreate
        containers:
          # rewrites the webfinger issuer href for the desktop client, which
          # cannot use platform-based client discovery and authenticates with
          # its baked-in OpenCloudDesktop client id against its own issuer
          webfinger-proxy:
            image:
              repository: ghcr.io/2bros-group/opencloud-oidc-webfinger-proxy
              tag: v1.0.0
            env:
              PORT: "9201"
              UPSTREAM_URL: http://localhost:9200
              HREF_PATTERN: &issuerBase "https://sso.${SECRET_DOMAIN}/application/o/"
              HREF_REPLACEMENT: *issuerBase
              DEFAULT_SUFFIX: opencloud
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
          app:
            image:
              repository: opencloudeu/opencloud-rolling
              tag: "7.4.0"
            command: ["/bin/sh", "-c", "opencloud init || true; opencloud server"]
            env:
              OC_URL: "https://drive.${SECRET_DOMAIN}"
              OC_INSECURE: "false"
              OC_LOG_LEVEL: info
              OC_LOG_COLOR: "false"
              OC_LOG_PRETTY: "false"
              # the built-in IdP is replaced by Authentik
              OC_EXCLUDE_RUN_SERVICES: idp
              IDM_CREATE_DEMO_USERS: "false"
              PROXY_TLS: "false"
              PROXY_ENABLE_BASIC_AUTH: "false"
              PROXY_CSP_CONFIG_FILE_LOCATION: /etc/opencloud/csp.yaml
              FRONTEND_ARCHIVER_MAX_SIZE: "10000000000"
              FRONTEND_CHECK_FOR_UPDATES: "false"
              # OIDC via Authentik (single public client shared by web + native apps)
              OC_OIDC_ISSUER: "https://sso.${SECRET_DOMAIN}/application/o/opencloud/"
              OC_OIDC_CLIENT_ID: opencloud
              PROXY_OIDC_REWRITE_WELLKNOWN: "true"
              PROXY_OIDC_ACCESS_TOKEN_VERIFY_METHOD: none
              PROXY_AUTOPROVISION_ACCOUNTS: "true"
              PROXY_USER_OIDC_CLAIM: preferred_username
              PROXY_USER_CS3_CLAIM: username
              # role mapping lives in proxy.yaml
              PROXY_ROLE_ASSIGNMENT_DRIVER: oidc
              WEB_OIDC_SCOPE: "openid profile email groups"
              WEBFINGER_WEB_OIDC_CLIENT_ID: opencloud
              WEBFINGER_WEB_OIDC_CLIENT_SCOPES: "openid profile email groups"
              WEBFINGER_DESKTOP_OIDC_CLIENT_ID: opencloud
              WEBFINGER_DESKTOP_OIDC_CLIENT_SCOPES: "openid profile email groups offline_access"
              WEBFINGER_IOS_OIDC_CLIENT_ID: opencloud
              WEBFINGER_IOS_OIDC_CLIENT_SCOPES: "openid profile email groups offline_access"
              WEBFINGER_ANDROID_OIDC_CLIENT_ID: opencloud
              WEBFINGER_ANDROID_OIDC_CLIENT_SCOPES: "openid profile email groups offline_access"
            envFrom:
              - secretRef:
                  name: opencloud-secret
            probes:
              liveness: &ocProbes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 9200
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *ocProbes
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi

    service:
      opencloud:
        controller: opencloud
        ports:
          http:
            port: 9200
          webfinger:
            port: 9201

    persistence:
      config:
        type: configMap
        name: opencloud-config
        globalMounts:
          - path: /etc/opencloud/csp.yaml
            subPath: csp.yaml
            readOnly: true
          - path: /etc/opencloud/proxy.yaml
            subPath: proxy.yaml
            readOnly: true
      etc:
        existingClaim: *app
        globalMounts:
          - path: /etc/opencloud
      data:
        type: nfs
        server: "truenas.${INTERNAL_DOMAIN}"
        path: /mnt/tank/Apps/opencloud/data
        globalMounts:
          - path: /var/lib/opencloud

    route:
      opencloud:
        hostnames:
          - "drive.${SECRET_DOMAIN}"
        parentRefs:
          - name: external
            namespace: network
        rules:
          - backendRefs:
              - name: opencloud
                port: 9200
          # desktop app: steer its webfinger lookup through the rewrite proxy
          # so it discovers the OpenCloudDesktop issuer instead of opencloud
          - matches:
              - path:
                  type: Exact
                  value: /.well-known/webfinger
                headers:
                  - type: RegularExpression
                    name: User-Agent
                    value: ".*mirall.*OpenCloud.*"
            filters:
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  add:
                    - name: X-Issuer-Suffix
                      value: openclouddesktop
            backendRefs:
              - name: opencloud
                port: 9201
