---
# yaml-language-server: $schema=https://schemas.iac.gg/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: policy-reporter
  namespace: security
spec:
  chartRef:
    kind: OCIRepository
    name: policy-reporter
  interval: 1h
  values:
    # The cluster is default-deny both ways, so every pod here
    # is default-deny both ways. The core watches (Cluster)PolicyReports on the
    # API server and is scraped by vmagent; its peers inside the namespace are
    # named in ./ciliumnetworkpolicy.yaml.
    podLabels:
      ingress.home.arpa/prometheus: allow
      egress.home.arpa/apiserver: allow

    # No persistence: the core keeps its SQLite cache in an emptyDir and
    # rebuilds it from the PolicyReports on every start.
    metrics:
      enabled: true

    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi

    monitoring:
      enabled: true
      grafana:
        dashboards:
          enabled: true
        grafanaDashboard:
          # The chart ships the dashboards as ConfigMaps; this wraps them in
          # GrafanaDashboard CRs for the grafana-operator instance.
          enabled: true
          folder: Security
          allowCrossNamespaceImport: true
          matchLabels:
            dashboards: null # chart default, no such Grafana instance here
            grafana.internal/instance: grafana

    ui:
      enabled: true
      podLabels:
        ingress.home.arpa/gateway-internal: allow
        egress.home.arpa/apiserver: allow
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi

    plugin:
      # Enriches the "Trivy Vulnerability" results with CVE details (CVSS,
      # affected versions, fixes) pulled from the local Trivy DB and CVEAWG.
      trivy:
        enabled: true
        github:
          disable: true # unauthenticated GitHub API is rate limited to 60/h
        podLabels:
          egress.home.arpa/apiserver: allow
          # The plugin keeps its own copy of the Trivy vulnerability DB under
          # /db, pulled from the registry on start and refreshed from there.
          egress.home.arpa/internet-https: allow
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 1Gi
