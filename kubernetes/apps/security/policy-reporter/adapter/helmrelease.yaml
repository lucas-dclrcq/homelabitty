---
# yaml-language-server: $schema=https://schemas.iac.gg/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator-polr-adapter
  namespace: security
spec:
  chartRef:
    kind: OCIRepository
    name: trivy-operator-polr-adapter
  interval: 1h
  values:
    # Every namespace is default-deny both ways (netpols/platform/baseline.yaml). The
    # adapter only ever talks to the API server: it watches the trivy CRs and
    # writes the wgpolicyk8s ones back.
    podLabels:
      egress.home.arpa/apiserver: allow

    # Trivy Operator only emits its own aquasecurity.github.io CRs. Policy
    # Reporter reads wgpolicyk8s.io (Cluster)PolicyReports, so this adapter
    # translates one into the other — and ships the CRDs nothing else owns.
    crds:
      install: true

    adapters:
      # Mirrors the scanners enabled on the trivy-operator HelmRelease; the
      # others produce no reports, so mapping them would only add watches.
      #
      # timeout is the per-controller CacheSyncTimeout, in minutes. Since
      # controller-runtime 0.23 a cache only counts as synced once the event
      # handler has drained every initial event, and this adapter does its
      # GET+CREATE/UPDATE of each PolicyReport inside that handler, against a
      # client left at client-go's default 5 QPS. So startup has to write out
      # every report before any controller starts, and the four controllers
      # share one token bucket: ~1000 source reports needs ~8min, not the 2min
      # default, or the process exits 1 and crashloops forever.
      vulnerabilityReports:
        enabled: true
        timeout: 15
      configAuditReports:
        enabled: true
        timeout: 15
      # Also governs clusterRbacAssessmentReports, which has no key of its own.
      rbacAssessmentReports:
        enabled: true
        timeout: 15
      clusterVulnerabilityReports:
        enabled: false
      complianceReports:
        enabled: false
      exposedSecretReports:
        enabled: false
      infraAssessmentReports:
        enabled: false
      clusterInfraAssessmentReports:
        enabled: false
      cisKubeBenchReports:
        enabled: false

    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi
