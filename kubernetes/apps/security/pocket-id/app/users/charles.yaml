---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDUser
metadata:
  name: charles
spec:
  locale: fr
  userInfoSecretRef:
    name: pocket-id-user-charles
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-user-charles
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: hashicorp-vault
  target:
    name: pocket-id-user-charles
    creationPolicy: Owner
    deletionPolicy: "Delete"
    template:
      engineVersion: v2
      data:
        username: '{{ index . "username" }}'
        firstName: '{{ index . "firstname" }}'
        lastName: '{{ index . "lastname" }}'
        email: '{{ index . "email" }}'
  dataFrom:
    - extract:
        key: security/pocket-id/users/charles
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: hashicorp-vault
