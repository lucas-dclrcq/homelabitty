---
# yaml-language-server: $schema=https://schemas.iac.gg/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: security
spec:
  chartRef:
    kind: OCIRepository
    name: trivy-operator
  interval: 1h
  values:
    serviceMonitor:
      enabled: true

    operator:
      annotations:
        reloader.stakater.com/auto: "true"
      # `security` is enrolled in netpol-baseline (default-deny both ways).
      podLabels:
        ingress.home.arpa/prometheus: allow
        egress.home.arpa/apiserver: allow
      vulnerabilityScannerScanOnlyCurrentRevisions: true
      configAuditScannerScanOnlyCurrentRevisions: true
      scanJobTTL: 300s
      scanJobTimeout: 20m
      scanJobsConcurrentLimit: 3
      builtInTrivyServer: true
      vulnerabilityScannerEnabled: true
      sbomGenerationEnabled: true
      configAuditScannerEnabled: true
      rbacAssessmentScannerEnabled: true
      infraAssessmentScannerEnabled: false
      clusterComplianceEnabled: true
      exposedSecretScannerEnabled: false
      metricsFindingsEnabled: true
      metricsVulnIdEnabled: false

    trivy:
      # The server downloads the vulnerability DB from the registry and keeps it
      # on its PVC; the scan jobs never fetch it themselves in client/server mode.
      podLabels:
        egress.home.arpa/internet-https: allow
      additionalVulnerabilityReportFields: Links,CVSS,Target,Class,PackagePath,PackageType
      slow: true
      ignoreUnfixed: true
      severity: HIGH,CRITICAL
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 512Mi
      server:
        replicas: 1
        resources:
          requests:
            cpu: 50m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 768Mi

    trivyOperator:
      scanJobCompressLogs: false
      # scanJobsInSameNamespace is left at its default (false), so every scan job
      # runs here in `security` and is caught by the baseline. The jobs pull image
      # manifests and layers straight from the registry, then hand the package
      # list to trivy-service:4954 (./ciliumnetworkpolicy.yaml names that hop).
      scanJobPodTemplateLabels: "egress.home.arpa/internet-https=allow,app.kubernetes.io/component=trivy-scan-job"

    compliance:
      specs: []

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1536Mi
