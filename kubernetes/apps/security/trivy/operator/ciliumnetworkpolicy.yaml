---
# With builtInTrivyServer the scan jobs are thin clients: they read the image
# from the registry themselves and POST the package list to the server, which
# owns the vulnerability DB. `trivy.serverURL` in the operator ConfigMap is
# http://trivy-service.security:4954, so both ends sit in this namespace and the
# baseline grants nothing same-namespace — each direction needs naming.
#
# The scan job pods are created by the operator, not by us; they carry the
# labels from `trivyOperator.scanJobPodTemplateLabels` in ./helmrelease.yaml.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: trivy-server
spec:
  description: "trivy-server accepts scan results from the operator's scan jobs"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: trivy-server
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/component: trivy-scan-job
        # the operator probes the server itself before dispatching a scan
        - matchLabels:
            app.kubernetes.io/name: trivy-operator
      toPorts:
        - ports:
            - port: "4954"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: trivy-scan-job
spec:
  description: "The matching egress half: scan jobs hand their package list to trivy-server"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: trivy-scan-job
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: trivy-server
      toPorts:
        - ports:
            - port: "4954"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: trivy-operator
spec:
  description: "The operator talks to trivy-server directly too, not only through the scan jobs"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: trivy-operator
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: trivy-server
      toPorts:
        - ports:
            - port: "4954"
              protocol: TCP
