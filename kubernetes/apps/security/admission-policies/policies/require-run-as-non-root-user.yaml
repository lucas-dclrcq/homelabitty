---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/admissionregistration.k8s.io/validatingadmissionpolicy_v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: require-run-as-non-root-user
  annotations:
    policy.home.arpa/description: >-
      runAsUser must be unset or greater than zero, at the pod level and on
      every container. An unset runAsUser is allowed on purpose: the UID then
      comes from the image's USER line, which this policy cannot see.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: rootContainers
      expression: >-
        (object.spec.containers +
         object.spec.?initContainers.orValue([]) +
         object.spec.?ephemeralContainers.orValue([])
        ).filter(c, c.?securityContext.?runAsUser.orValue(1) == 0).map(c, c.name)
  validations:
    - expression: object.spec.?securityContext.?runAsUser.orValue(1) != 0
      message: >-
        Running as root is not allowed: spec.securityContext.runAsUser must be
        unset or greater than zero. Label the pod template with
        policy.home.arpa/run-as-root: allow to opt out.
      reason: Forbidden
    - expression: variables.rootContainers.size() == 0
      message: >-
        Running as root is not allowed: securityContext.runAsUser must be unset
        or greater than zero on every container. Label the pod template with
        policy.home.arpa/run-as-root: allow to opt out.
      messageExpression: >-
        'Running as root is not allowed, these containers set runAsUser: 0 -> ' +
        variables.rootContainers.join(', ') +
        '. Label the pod template with policy.home.arpa/run-as-root: allow to opt out.'
      reason: Forbidden
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/admissionregistration.k8s.io/validatingadmissionpolicybinding_v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: require-run-as-non-root-user
spec:
  policyName: require-run-as-non-root-user
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        policy.home.arpa/admission: enforce
    objectSelector:
      matchExpressions:
        - key: policy.home.arpa/run-as-root
          operator: NotIn
          values: ["allow"]
        - key: app.kubernetes.io/managed-by
          operator: NotIn
          values: ["kopiur"]
