---
# Paired vocabulary, same shape as the other service pairs: the first policy opens the
# consumer's egress, the second opens the service's ingress from pods carrying
# that same label. Labelling the consumer is enough, from any namespace.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-egress-smtp
spec:
  description: "Pods labeled egress.home.arpa/smtp=allow may reach the smtp-relay"
  endpointSelector:
    matchLabels:
      egress.home.arpa/smtp: allow
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: smtp-relay
            io.kubernetes.pod.namespace: infrastructure
      toPorts:
        - ports:
            - port: "2525"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-ingress-smtp
spec:
  description: "Service side of egress.home.arpa/smtp: smtp-relay accepts 2525 from consumers carrying the label"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: smtp-relay
      io.kubernetes.pod.namespace: infrastructure
  ingress:
    - fromEndpoints:
        - matchLabels:
            egress.home.arpa/smtp: allow
      toPorts:
        - ports:
            - port: "2525"
              protocol: TCP
