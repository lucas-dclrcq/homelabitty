---
# Paired vocabulary for egress.home.arpa/mqtt, owned by mosquitto: the first
# policy opens the consumer's egress, the second opens mosquitto's ingress
# from pods carrying that label. Labelling the consumer is enough, from any
# namespace.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-egress-mqtt
spec:
  description: "Pods labeled egress.home.arpa/mqtt=allow may reach mosquitto"
  endpointSelector:
    matchLabels:
      egress.home.arpa/mqtt: allow
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: mosquitto
            io.kubernetes.pod.namespace: infrastructure
      toPorts:
        - ports:
            - port: "1883"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-ingress-mqtt
spec:
  description: "Service side of egress.home.arpa/mqtt: mosquitto accepts 1883 from consumers carrying the label"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mosquitto
      io.kubernetes.pod.namespace: infrastructure
  ingress:
    - fromEndpoints:
        - matchLabels:
            egress.home.arpa/mqtt: allow
      toPorts:
        - ports:
            - port: "1883"
              protocol: TCP
