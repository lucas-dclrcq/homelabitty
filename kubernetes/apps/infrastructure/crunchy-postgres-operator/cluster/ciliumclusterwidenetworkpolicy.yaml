---
# Paired vocabulary for egress.home.arpa/postgres, owned by the crunchy
# cluster: the first policy opens the consumer's egress, the second opens the
# ingress of every crunchy pod (instances AND pgbouncer) from pods carrying
# that label. Labelling the consumer is enough, from any namespace.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-egress-postgres
spec:
  description: "Pods labeled egress.home.arpa/postgres=allow may reach any crunchy postgres pod (instances AND pgbouncer) on 5432"
  endpointSelector:
    matchLabels:
      egress.home.arpa/postgres: allow
  egress:
    - toEndpoints:
        - matchExpressions:
            - key: postgres-operator.crunchydata.com/cluster
              operator: Exists
          matchLabels:
            io.kubernetes.pod.namespace: infrastructure
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-ingress-postgres
spec:
  description: "Service side of egress.home.arpa/postgres: crunchy pods (instances + pgbouncer) accept 5432 from consumers carrying the label"
  endpointSelector:
    matchExpressions:
      - key: postgres-operator.crunchydata.com/cluster
        operator: Exists
    matchLabels:
      io.kubernetes.pod.namespace: infrastructure
  ingress:
    - fromEndpoints:
        - matchLabels:
            egress.home.arpa/postgres: allow
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
