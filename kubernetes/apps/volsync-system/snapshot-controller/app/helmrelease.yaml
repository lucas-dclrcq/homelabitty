---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app snapshot-controller
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  values:
    # The chart TEMPLATES the VolumeSnapshot CRDs: without this, a helm
    # uninstall (e.g. moving this release between namespaces) deletes the CRDs
    # and with them every VolumeSnapshot in the cluster
    keepCRDs: true
    controller:
      serviceMonitor:
        create: true
