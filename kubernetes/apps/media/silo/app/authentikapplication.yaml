---
apiVersion: authentik.starry.blue/v1alpha1
kind: AuthentikApplication
metadata:
  name: silo
spec:
  slug: silo
  name: Silo
  group: Media
  adopt: IfMatch
  provider:
    flows:
      authorization:
        slug: default-provider-authorization-implicit-consent
      invalidation:
        slug: default-provider-invalidation-flow
    oauth2:
      clientType: Confidential
      redirectURIs:
        - url: "https://silo\\.hoohoot\\.org/api/v[12]/auth/oauth/[0-9]+/callback"
          matchingMode: Regex
          type: Authorization
        - url: "https://silo.hoohoot.org/login"
          matchingMode: Strict
          type: PostLogout
      scopes:
        - scopeName: openid
        - scopeName: email
        - scopeName: profile
        - scopeName: offline_access
      grantTypes:
        - AuthorizationCode
        - RefreshToken
      subjectMode: HashedUserID
      issuerMode: PerProvider
      includeClaimsInIDToken: true
      credentials:
        secretRef:
          name: silo-oidc
  access:
    rules:
      - group:
          name: Hoohoot Users
