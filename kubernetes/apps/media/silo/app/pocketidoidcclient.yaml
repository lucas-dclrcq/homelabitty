---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: silo
spec:
  name: Silo
  description: Media server
  clientID: silo
  instanceSelector:
    matchLabels:
      app.kubernetes.io/name: pocket-id
  launchUrl: https://silo.hoohoot.org
  callbackUrls:
    - https://silo.hoohoot.org/api/v1/auth/oauth/5/callback
    - https://silo.hoohoot.org/api/v2/auth/oauth/5/callback
  logoutCallbackUrls:
    - https://silo.hoohoot.org/login
  allowedUserGroups:
    - name: media
      namespace: security
  secret:
    name: silo-pocket-id-oidc
    keys:
      clientID: client-id
      clientSecret: client-secret
