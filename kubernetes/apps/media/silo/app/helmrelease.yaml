---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app silo
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      silo:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/silo-server/silo-server
              tag: build-1302@sha256:f84ff66c707f70f3a6ba006743161bc468095b66829d60613fe4aa000a7a813c

            env:
              TZ: Europe/Paris
              PORT: &port 8080
              JF_PORT: &jfPort 8096
              HOME: /tmp
              SILO_METRICS_LISTEN: :9091
              SILO_PLUGIN_CACHE_DIR: /tmp/silo-plugins
              SILO_TRUSTED_PROXIES: 10.69.0.0/16

            envFrom:
              - secretRef:
                  name: silo-secret

            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/ready
                    port: *port
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 60

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

            resources:
              requests:
                gpu.intel.com/i915: 1
                cpu: 100m
                memory: 1Gi
              limits:
                gpu.intel.com/i915: 1
                memory: 6Gi

    defaultPodOptions:
      annotations:
        fluentbit.io/parser: level_logfmt
      labels:
        ingress.home.arpa/gateway-external: allow
        ingress.home.arpa/prometheus: allow
        egress.home.arpa/postgres: allow
        egress.home.arpa/gateway-external: allow
        egress.home.arpa/internet: allow
      securityContext:
        runAsNonRoot: true
        runAsUser: 1026
        runAsGroup: 1500
        fsGroup: 1500
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
          jellyfin:
            port: *jfPort
          metrics:
            port: 9091

    route:
      app:
        annotations:
          homelab-manager.hoohoot.org/enabled: "true"
          homelab-manager.hoohoot.org/category: "Film & Séries"
          homelab-manager.hoohoot.org/description: "Serveur multimédia — films, séries, livres audio"
        hostnames:
          - "{{ .Release.Name }}.hoohoot.org"
        parentRefs:
          - name: external
            namespace: network
        rules:
          - backendRefs:
              - name: *app
                port: *port
            timeouts:
              backendRequest: 3600s
      jellyfin:
        hostnames:
          - "{{ .Release.Name }}-jf.hoohoot.org"
        parentRefs:
          - name: external
            namespace: network
        rules:
          - backendRefs:
              - name: *app
                port: *jfPort
            timeouts:
              backendRequest: 3600s

    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /var/lib/silo
      media:
        type: nfs
        server: "truenas.lulice.lan"
        path: /mnt/tank/Media
        globalMounts:
          - path: /mnt/media
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
