---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: silo
spec:
  description: "Silo's in-namespace backing service: Meilisearch (SILO_MEILISEARCH_URL)"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: silo
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: silo-meilisearch
      toPorts:
        - ports:
            - port: "7700"
              protocol: TCP
