---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: silo-meilisearch
spec:
  description: "Search index is only queried by Silo"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: silo-meilisearch
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: silo
      toPorts:
        - ports:
            - port: "7700"
              protocol: TCP
