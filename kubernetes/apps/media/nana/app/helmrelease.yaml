---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app nana
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    rawResources:
      netpol-app:
        manifest:
          apiVersion: cilium.io/v2
          kind: CiliumNetworkPolicy
          spec:
            description: "nana solves Cloudflare challenges through its FlareSolverr sidecar controller and posts notifications to homelab-manager"
            endpointSelector:
              matchLabels:
                app.kubernetes.io/name: nana
                app.kubernetes.io/controller: nana
            egress:
              - toEndpoints:
                  - matchLabels:
                      app.kubernetes.io/name: nana
                      app.kubernetes.io/controller: flaresolverr
                toPorts:
                  - ports:
                      - port: "8191"
                        protocol: TCP
              - toEndpoints:
                  - matchLabels:
                      app: homelab-manager
                      io.kubernetes.pod.namespace: default
                toPorts:
                  - ports:
                      - port: "8080"
                        protocol: TCP
      netpol-flaresolverr:
        manifest:
          apiVersion: cilium.io/v2
          kind: CiliumNetworkPolicy
          spec:
            description: "FlareSolverr is only called by nana itself"
            endpointSelector:
              matchLabels:
                app.kubernetes.io/name: nana
                app.kubernetes.io/controller: flaresolverr
            ingress:
              - fromEndpoints:
                  - matchLabels:
                      app.kubernetes.io/name: nana
                      app.kubernetes.io/controller: nana
                toPorts:
                  - ports:
                      - port: "8191"
                        protocol: TCP

    controllers:
      nana:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/lucas-dclrcq/nana
              tag: 0.11.0

            env:
              TZ: Europe/Paris
              NANA_DOWNLOAD_DIR: /downloads
              NANA_ALLOWED_FORMATS: "epub,pdf,cbz"
              NANA_FLARESOLVERR_ENABLED: "true"
              NANA_FLARESOLVERR_URL: http://nana-flaresolverr:8191

            envFrom:
              - secretRef:
                  name: nana-secret

            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /q/health/live
                    port: &port 8080
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /q/health/ready
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi

      flaresolverr:
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: docker.io/rorqualx/flaresolverr-go
              tag: 0.11.1

            env:
              TZ: Europe/Paris
              LOG_LEVEL: info
              BROWSER_POOL_SIZE: "1"
              # Overriding the image user leaves HOME=/ (unwritable), which makes
              # Chromium's crashpad handler fail to launch.
              HOME: /tmp

            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &flaresolverrPort 8191
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *flaresolverrPort
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3

            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }

            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 8Gi

    defaultPodOptions:
      annotations:
        fluentbit.io/parser: level_tsword
      labels:
        ingress.home.arpa/gateway-external: allow
        ingress.home.arpa/prometheus: allow
        egress.home.arpa/postgres: allow
        egress.home.arpa/gateway-external: allow
        egress.home.arpa/internet: allow
      securityContext:
        runAsNonRoot: true
        runAsUser: 1026
        runAsGroup: 1500
        fsGroup: 1500
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
      flaresolverr:
        controller: flaresolverr
        ports:
          http:
            port: *flaresolverrPort

    route:
      app:
        annotations:
          homelab-manager.hoohoot.org/enabled: "true"
          homelab-manager.hoohoot.org/category: "Livres"
          homelab-manager.hoohoot.org/description: "Télécharger des ebooks"
        hostnames:
          - "{{ .Release.Name }}.hoohoot.org"
        parentRefs:
          - name: external
            namespace: network
        rules:
          - backendRefs:
              - name: nana-app
                port: *port

    persistence:
      downloads:
        type: nfs
        server: "truenas.lulice.lan"
        path: /mnt/tank/Apps/nana/uploads
        advancedMounts:
          nana:
            app:
              - path: /downloads

      # Not mounted into flaresolverr: an emptyDir survives container restarts and
      # a stale /tmp/.X99-lock would then make every Xvfb restart fail.
      tmp:
        type: emptyDir
        advancedMounts:
          nana:
            app:
              - path: /tmp
