---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app jellyfin
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    rawResources:
      netpol:
        manifest:
          apiVersion: cilium.io/v2
          kind: CiliumNetworkPolicy
          spec:
            description: "Library API consumers: Seerr (same namespace) and the homelab-manager dashboard"
            endpointSelector:
              matchLabels:
                app.kubernetes.io/name: jellyfin
            ingress:
              - fromEndpoints:
                  - matchLabels:
                      app.kubernetes.io/name: seerr
                  - matchLabels:
                      app: homelab-manager
                      io.kubernetes.pod.namespace: default
                toPorts:
                  - ports:
                      - port: "8096"
                        protocol: TCP

    controllers:
      jellyfin:
        annotations:
          reloader.stakater.com/auto: "true"

        initContainers:
          # Jellyfin only serves /metrics when EnableMetrics is true in system.xml, and there
          # is no environment variable for it (jellyfin/jellyfin#14052 is still unmerged), so
          # flip the flag on the config volume before the server reads it.
          enable-metrics:
            image: &image
              repository: ghcr.io/jellyfin/jellyfin
              tag: 12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                if [ ! -f /config/config/system.xml ]; then
                  echo "no system.xml yet, Jellyfin writes one on first boot: metrics turn on at the next restart"
                  exit 0
                fi
                sed -i 's|<EnableMetrics>false</EnableMetrics>|<EnableMetrics>true</EnableMetrics>|' /config/config/system.xml
                grep -q '<EnableMetrics>true</EnableMetrics>' /config/config/system.xml

        containers:
          jellyfin:
            image: *image

            env:
              DOTNET_SYSTEM_IO_DISABLEFILELOCKING: "true"
              JELLYFIN_FFmpeg__probesize: 50000000
              JELLYFIN_FFmpeg__analyzeduration: 50000000
              TZ: Europe/Paris

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8096
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 180
                  periodSeconds: 10

            resources:
              claims:
                - name: gpu
              requests:
                cpu: 100m
                memory: 4Gi
              limits:
                memory: 16Gi

    defaultPodOptions:
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: jellyfin-gpu
      labels:
        ingress.home.arpa/gateway-external: allow
        ingress.home.arpa/prometheus: allow
        egress.home.arpa/internet: allow
        # LDAP-Auth plugin: ak-outpost-ldap.auth.svc:389 -> container port 3389
        egress.home.arpa/ldap: allow
      securityContext:
        runAsUser: 1026
        runAsGroup: 1500
        fsGroup: 1500
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 15
              preference:
                matchExpressions:
                  - key: "kubernetes.io/hostname"
                    operator: "In"
                    values:
                      - "bee"
                      - "burrich"
                      - "fool"

    service:
      jellyfin:
        controller: *app
        ports:
          http:
            port: *port

    route:
      app:
        annotations:
          homelab-manager.hoohoot.org/enabled: "true"
          homelab-manager.hoohoot.org/category: "Film & Séries"
          homelab-manager.hoohoot.org/description: "Regarder Séries & Films"
          homelab-manager.hoohoot.org/logo-url: "https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/jellyfin.png"
        hostnames:
          - "{{ .Release.Name }}.hoohoot.org"
        parentRefs:
          - name: external
            namespace: network

        rules:
          # /metrics is unauthenticated, and this route is on the external gateway:
          # only the in-cluster ServiceMonitor is allowed to reach it. The match has to be
          # a case-insensitive regex, not a PathPrefix: Gateway API matches paths
          # case-sensitively while ASP.NET Core routes them case-insensitively, so a
          # PathPrefix on /metrics still serves /Metrics.
          - matches:
              - path:
                  type: RegularExpression
                  value: (?i)^/metrics(/.*)?$
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: gateway.envoyproxy.io
                  kind: HTTPRouteFilter
                  name: jellyfin-not-found-page
          - backendRefs:
              - name: *app
                port: *port
            matches:
              - path:
                  type: PathPrefix
                  value: /
    persistence:
      config:
        enabled: true
        existingClaim: *app
        advancedMounts:
          jellyfin:
            enable-metrics:
              - path: /config
            jellyfin:
              - path: /config
      media:
        type: nfs
        server: "truenas.lulice.lan"
        path: /mnt/tank/Media
        advancedMounts:
          jellyfin:
            jellyfin:
              - path: /media
      transcode:
        enabled: true
        type: emptyDir
        advancedMounts:
          jellyfin:
            jellyfin:
              - path: /transcode
      cache:
        enabled: true
        type: emptyDir
        advancedMounts:
          jellyfin:
            jellyfin:
              - path: /cache
