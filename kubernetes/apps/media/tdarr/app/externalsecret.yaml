---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tdarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: hashicorp-vault
  target:
    name: tdarr-secret
    template:
      engineVersion: v2
      data:
        # Tdarr seeds this key at startup (seededApiKey) and its internal node
        # authenticates with it (apiKey). Must match ^tapi_[A-Za-z0-9_]{9,}$.
        TDARR_API_KEY: "{{ .TDARR_API_KEY }}"
        SONARR_API_KEY: "{{ .SONARR__AUTH__APIKEY }}"
        SONARR_ANIME_API_KEY: "{{ .SONARR_ANIME_APIKEY }}"
        RADARR_API_KEY: "{{ .RADARR__AUTH__APIKEY }}"
  data:
    - secretKey: SONARR_ANIME_APIKEY
      remoteRef:
        key: downloads/sonarr-anime
        property: SONARR__AUTH__APIKEY
  dataFrom:
    - extract:
        key: media/tdarr
    - extract:
        key: downloads/radarr
    - extract:
        key: media/sonarr/config
