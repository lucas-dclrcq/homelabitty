---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-drivers
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: ceph-csi-drivers
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  dependsOn:
    - name: rook-ceph-operator
      namespace: rook-ceph
  # Rook v1.20 no longer deploys the CSI drivers; the admin owns them through this chart.
  # The release name must stay "ceph-csi-drivers" so Helm adopts the OperatorConfig and
  # Driver CRs that the Rook v1.19 operator pre-stamped for this release.
  #
  # Shared settings live in driverSpecDefaults: the operator merges them field by field
  # into each Driver, so a Driver only needs to carry what differs. The chart defaults
  # that would silently regress what Rook was running are set per driver instead:
  # grpcTimeout (chart 30s, live 150s), snapshotPolicy (chart "none" for rbd, which drops
  # the csi-snapshotter sidecar entirely) and controllerPlugin.replicas (chart 1, live 2).
  values:
    operatorConfig:
      name: ceph-csi-operator-config
      namespace: rook-ceph
      driverSpecDefaults:
        clusterName: rook-ceph
        imageSet:
          name: rook-csi-operator-image-set-configmap
        log:
          rotation:
            enabled: false
        nodePlugin:
          priorityClassName: system-node-critical
          kubeletDirPath: /var/lib/kubelet
          updateStrategy:
            type: RollingUpdate
          resources:
            plugin:
              limits:
                memory: 1Gi
              requests:
                cpu: 250m
                memory: 512Mi
            registrar:
              limits:
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 128Mi
        controllerPlugin:
          priorityClassName: system-cluster-critical
          deploymentStrategy:
            type: Recreate
          hostNetwork: true
          replicas: 2
          resources:
            attacher:
              limits:
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
            omapGenerator:
              limits:
                memory: 1Gi
              requests:
                cpu: 250m
                memory: 512Mi
            plugin:
              limits:
                memory: 1Gi
              requests:
                memory: 512Mi
            provisioner:
              limits:
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
            resizer:
              limits:
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
            snapshotter:
              limits:
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
    drivers:
      rbd:
        name: rook-ceph.rbd.csi.ceph.com
        enabled: true
        grpcTimeout: 150
        snapshotPolicy: volumeGroupSnapshot
        log:
          rotation:
            enabled: false
        controllerPlugin:
          replicas: 2
      cephfs:
        name: rook-ceph.cephfs.csi.ceph.com
        enabled: true
        grpcTimeout: 150
        snapshotPolicy: volumeGroupSnapshot
        log:
          rotation:
            enabled: false
        controllerPlugin:
          replicas: 2
          # cephfs asks for cpu on the plugin container, the shared rbd shape does not
          resources:
            attacher:
              limits:
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
            plugin:
              limits:
                memory: 1Gi
              requests:
                cpu: 250m
                memory: 512Mi
            provisioner:
              limits:
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
            resizer:
              limits:
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
            snapshotter:
              limits:
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
      nfs:
        name: rook-ceph.nfs.csi.ceph.com
        enabled: false
      nvmeof:
        name: rook-ceph.nvmeof.csi.ceph.com
        enabled: false
