---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-drivers
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: ceph-csi-drivers
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  dependsOn:
    - name: rook-ceph-operator
      namespace: rook-ceph
  # Rook v1.20 no longer deploys the CSI drivers; the admin owns them through this chart.
  # The release name must stay "ceph-csi-drivers" so Helm adopts the OperatorConfig and
  # Driver CRs that the Rook v1.19 operator pre-stamped for this release.
  # Values reproduce the CR specs Rook generated, so the drivers keep their current shape.
  values:
    # CephConnection and ClientProfile CRs stay owned by the Rook operator
    cephConnections: []
    clientProfiles: []
    operatorConfig:
      name: ceph-csi-operator-config
      namespace: rook-ceph
      driverSpecDefaults:
        clusterName: rook-ceph
        cephFsClientType: kernel
        fsGroupPolicy: File
        snapshotPolicy: volumeSnapshot
        grpcTimeout: 150
        deployCsiAddons: false
        enableMetadata: false
        generateOMapInfo: false
        imageSet:
          name: rook-csi-operator-image-set-configmap
        log:
          rotation:
            enabled: false
        nodePlugin:
          enableSeLinuxHostMount: false
          imagePullPolicy: IfNotPresent
          kubeletDirPath: /var/lib/kubelet
          priorityClassName: system-node-critical
        controllerPlugin:
          deploymentStrategy:
            type: Recreate
          hostNetwork: true
          imagePullPolicy: IfNotPresent
          priorityClassName: system-cluster-critical
          replicas: 2
    drivers:
      rbd:
        name: rook-ceph.rbd.csi.ceph.com
        enabled: true
        clusterName: rook-ceph
        cephFsClientType: kernel
        fsGroupPolicy: File
        snapshotPolicy: volumeSnapshot
        grpcTimeout: 150
        deployCsiAddons: false
        enableMetadata: false
        generateOMapInfo: false
        imageSet:
          name: rook-csi-operator-image-set-configmap
        log:
          rotation:
            enabled: false
        nodePlugin:
          enableSeLinuxHostMount: false
          kubeletDirPath: /var/lib/kubelet
          priorityClassName: system-node-critical
          resources:
            plugin:
              limits:
                memory: 1Gi
              requests:
                cpu: 250m
                memory: 512Mi
            registrar:
              limits:
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 128Mi
          updateStrategy:
            type: RollingUpdate
        controllerPlugin:
          priorityClassName: system-cluster-critical
          replicas: 2
          resources:
            attacher:
              limits:
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
            omapGenerator:
              limits:
                memory: 1Gi
              requests:
                cpu: 250m
                memory: 512Mi
            plugin:
              limits:
                memory: 1Gi
              requests:
                memory: 512Mi
            provisioner:
              limits:
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
            resizer:
              limits:
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
            snapshotter:
              limits:
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
      cephfs:
        name: rook-ceph.cephfs.csi.ceph.com
        enabled: true
        clusterName: rook-ceph
        cephFsClientType: kernel
        fsGroupPolicy: File
        snapshotPolicy: volumeGroupSnapshot
        grpcTimeout: 150
        deployCsiAddons: false
        enableMetadata: false
        generateOMapInfo: false
        imageSet:
          name: rook-csi-operator-image-set-configmap
        log:
          rotation:
            enabled: false
        nodePlugin:
          enableSeLinuxHostMount: false
          kubeletDirPath: /var/lib/kubelet
          priorityClassName: system-node-critical
          resources:
            plugin:
              limits:
                memory: 1Gi
              requests:
                cpu: 250m
                memory: 512Mi
            registrar:
              limits:
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 128Mi
          updateStrategy:
            type: RollingUpdate
        controllerPlugin:
          priorityClassName: system-cluster-critical
          replicas: 2
          resources:
            attacher:
              limits:
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
            plugin:
              limits:
                memory: 1Gi
              requests:
                cpu: 250m
                memory: 512Mi
            provisioner:
              limits:
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
            resizer:
              limits:
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
            snapshotter:
              limits:
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
      nfs:
        name: rook-ceph.nfs.csi.ceph.com
        enabled: false
      nvmeof:
        name: rook-ceph.nvmeof.csi.ceph.com
        enabled: false
