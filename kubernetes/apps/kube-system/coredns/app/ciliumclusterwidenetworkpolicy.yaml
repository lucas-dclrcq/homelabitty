---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: baseline-egress-kubedns
spec:
  description: "Cluster-wide egress default-deny. Every endpoint reaches kube-dns:53 and nothing else unless another policy says so. Pods that opted into the DNS proxy are handled by baseline-egress-kubedns-l7 instead."
  # Together with `baseline-egress-kubedns-l7` this partitions the cluster:
  # `NotIn` also matches pods carrying no such label, so every endpoint is
  # selected by exactly one of the two, which is what arms egress default-deny
  # everywhere (see platform/baseline.yaml for why a section is required).
  #
  # The two selectors MUST stay mutually exclusive. A plain L4 allow on port 53
  # selecting a pod shadows the L7 rules of the other half — "if a layer 4 rule
  # is specified in the policy, and a similar layer 4 rule with layer 7 rules
  # is also specified, then the layer 7 portions of the latter rule will have
  # no effect" — the DNS proxy never engages, and every `toFQDNs` rule on that
  # pod silently resolves to nothing.
  endpointSelector:
    matchExpressions:
      - key: dns.home.arpa/l7
        operator: NotIn
        values: ["true"]
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: baseline-egress-kubedns-l7
spec:
  description: "Same rule for pods labelled dns.home.arpa/l7=true: their DNS goes through Cilium's in-agent DNS proxy, which is the only thing that populates the FQDN cache that toFQDNs rules are programmed from."
  # Opt-in rather than cluster-wide so only the pods that need FQDN policies
  # pay the proxy's userspace hop — and so only their DNS resolution depends on
  # the local Cilium agent being up.
  #
  # `matchPattern: "*"` allows every query and only observes the answers: this
  # is the IP-learning half. Narrowing the pattern turns it into a second,
  # DNS-level allowlist (unmatched queries are refused outright) — mind the
  # Alpine/musl `Refused` + resolv.conf `search` trap before doing that.
  endpointSelector:
    matchExpressions:
      - key: dns.home.arpa/l7
        operator: In
        values: ["true"]
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
