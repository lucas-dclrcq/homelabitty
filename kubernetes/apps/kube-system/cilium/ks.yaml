---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app cilium
  namespace: &namespace kube-system
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/kube-system/cilium/app
  prune: false # never should be deleted
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  wait: true
  interval: 1h
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app cilium-netpols
  namespace: kube-system
  labels:
    # The catalog's CIDRs/IPs are hardcoded on purpose (AGENTS.md reserves
    # substitution for secrets); without this label an accidental ${VAR} in a
    # policy would be silently replaced by an empty string.
    substitution.flux.home.arpa/disabled: "true"
spec:
  # no targetNamespace: everything in netpols/ is cluster-scoped, the
  # default-deny baseline included (netpols/platform/baseline.yaml plus the
  # kube-dns pair shipped with coredns)
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/kube-system/cilium/netpols
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  wait: true
  interval: 1h
