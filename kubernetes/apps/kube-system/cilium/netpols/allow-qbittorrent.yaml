---
# Paired vocabulary for the downloads stack, same shape as postgres/mqtt/smtp:
# the first policy opens the consumer's egress, the second opens the service's
# ingress from pods carrying that same label. Labelling the consumer is enough,
# and it works from any namespace (seerr in media, homelab-manager in default).
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-egress-qbittorrent
spec:
  description: "Pods labeled egress.home.arpa/qbittorrent=allow may reach the qBittorrent WebUI API on 8080"
  endpointSelector:
    matchLabels:
      egress.home.arpa/qbittorrent: allow
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: qbittorrent
            io.kubernetes.pod.namespace: downloads
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-ingress-qbittorrent
spec:
  description: "Service side of egress.home.arpa/qbittorrent: the qBittorrent WebUI API accepts 8080 from consumers carrying the label"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
      io.kubernetes.pod.namespace: downloads
  ingress:
    - fromEndpoints:
        - matchLabels:
            egress.home.arpa/qbittorrent: allow
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
