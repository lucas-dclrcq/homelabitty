---
# Paired vocabulary for the downloads stack, same shape as postgres/mqtt/smtp:
# the first policy opens the consumer's egress, the second opens the service's
# ingress from pods carrying that same label. Labelling the consumer is enough,
# and it works from any namespace (seerr in media, homelab-manager in default).
# One label covers both Sonarr instances on purpose: every consumer
# (Prowlarr, Bazarr, Recyclarr, Seerr) drives the two of them together.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-egress-sonarr
spec:
  description: "Pods labeled egress.home.arpa/sonarr=allow may reach the Sonarr instances (sonarr and sonarr-anime) on 80"
  endpointSelector:
    matchLabels:
      egress.home.arpa/sonarr: allow
  egress:
    - toEndpoints:
        - matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values: ["sonarr", "sonarr-anime"]
          matchLabels:
            io.kubernetes.pod.namespace: downloads
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-ingress-sonarr
spec:
  description: "Service side of egress.home.arpa/sonarr: the Sonarr instances (sonarr and sonarr-anime) accept 80 from consumers carrying the label"
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["sonarr", "sonarr-anime"]
    matchLabels:
      io.kubernetes.pod.namespace: downloads
  ingress:
    - fromEndpoints:
        - matchLabels:
            egress.home.arpa/sonarr: allow
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
