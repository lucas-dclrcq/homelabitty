---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-egress-world
spec:
  description: "Pods labeled egress.home.arpa/world=allow may reach anything outside the cluster: internet, LAN and every VLAN. Prefer the narrower egress.home.arpa/{internet,internet-https,lan,nas,router,iot} labels."
  endpointSelector:
    matchLabels:
      egress.home.arpa/world: allow
  egress:
    - toEntities:
        - world
