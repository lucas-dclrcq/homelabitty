---
# TrueNAS alone (truenas.lulice.lan = 192.168.1.70), the narrow alternative to
# ./allow-egress-lan.yaml.
#
# Left unscoped by port on purpose: a single /32 is already the constraint, and
# the host answers on too many of them to enumerate usefully (80/443 web+API,
# 2049 NFS, 111 rpcbind, 9100/9633 exporters, ICMP for the blackbox probe).
#
# NFS volumes do NOT need this label: the kubelet mounts them from the host
# netns, so the traffic never crosses the pod's Cilium endpoint.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-egress-nas
spec:
  description: "Pods labeled egress.home.arpa/nas=allow may reach TrueNAS (192.168.1.70) on any port"
  endpointSelector:
    matchLabels:
      egress.home.arpa/nas: allow
  egress:
    - toCIDR:
        - "192.168.1.70/32"
