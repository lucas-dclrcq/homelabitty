---
# kopiur mover Jobs (`<app>-<timestamp>`, one per scheduled snapshot) are
# created by the kopiur operator in the app's namespace and report back through
# the API server. They carry no label of ours, so they are selected on the one
# kopiur stamps on them.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-egress-kopiur-mover
spec:
  description: "kopiur mover pods may reach the Kubernetes API server"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/managed-by: kopiur
  egress:
    - toEntities:
        - kube-apiserver
