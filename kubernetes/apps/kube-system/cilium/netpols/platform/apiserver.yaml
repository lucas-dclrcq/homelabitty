---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-egress-apiserver
spec:
  description: "Pods labeled egress.home.arpa/apiserver=allow may reach the Kubernetes API server (operators, patroni, controllers)"
  endpointSelector:
    matchLabels:
      egress.home.arpa/apiserver: allow
  egress:
    - toEntities:
        - kube-apiserver
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-ingress-apiserver
spec:
  description: "Pods labeled ingress.home.arpa/apiserver=allow accept traffic from the API server (admission/conversion webhooks)"
  endpointSelector:
    matchLabels:
      ingress.home.arpa/apiserver: allow
  ingress:
    - fromEntities:
        - kube-apiserver
