---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: baseline-ingress
spec:
  description: "Cluster-wide ingress default-deny. Selects every Cilium-managed endpoint; the only thing it opens is the host and remote-node entities, which Cilium allows anyway."
  # The host rule is not a grant, it is the switch. Cilium enters default-deny
  # for a direction only when a rule that selects the endpoint HAS A SECTION
  # for that direction; `enableDefaultDeny` can turn that off but never on. So
  # this policy exists to arm ingress deny, and the egress half is armed by the
  # kube-dns policies shipped with coredns, which select every endpoint too.
  #
  # `reserved:host` is the harmless choice of section content: Cilium allows it
  # unconditionally, which is also why kubelet health probes are unaffected.
  # `remote-node` sits next to it because with `enable-remote-node-identity` a
  # packet from ANOTHER node is not `host`, it is `remote-node`, and the two
  # are not interchangeable.
  endpointSelector: {}
  ingress:
    - fromEntities:
        - host
        - remote-node
