---
# The IoT VLAN, 192.168.30.0/24: the appliances home-assistant and hcpy drive,
# the Bambu printer bambuddy talks to, the robot vacuum the internal gateway
# proxies.
#
# Pods reach it through their node's default route, so it is ordinary Cilium
# egress — unlike the `iot` NetworkAttachmentDefinition (macvlan on iot0),
# which puts an interface directly on the VLAN and bypasses policy entirely.
# Nothing uses that attachment today.
#
# Phase 4 of TASKS.md turns this around: an egressDeny towards 192.168.30.0/24
# for everything that is not one of the four carriers below.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-egress-iot
spec:
  description: "Pods labeled egress.home.arpa/iot=allow may reach the IoT VLAN 192.168.30.0/24, any port"
  endpointSelector:
    matchLabels:
      egress.home.arpa/iot: allow
  egress:
    - toCIDR:
        - "192.168.30.0/24"
