---
# The UniFi gateway alone (192.168.1.1), on its HTTPS API only. Carried by the
# two things that drive it: external-dns-unifi and the unifi MCP server.
#
# CoreDNS forwards to .1:53 as well, but kube-system is not enrolled in the
# baseline, so it needs no label.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-egress-router
spec:
  description: "Pods labeled egress.home.arpa/router=allow may reach the UniFi gateway (192.168.1.1) on 443"
  endpointSelector:
    matchLabels:
      egress.home.arpa/router: allow
  egress:
    - toCIDR:
        - "192.168.1.1/32"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
