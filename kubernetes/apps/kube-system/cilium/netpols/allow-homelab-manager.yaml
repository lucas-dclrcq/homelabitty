---
# Paired vocabulary, same shape as allow-radarr.yaml: the first policy opens the
# consumer's egress, the second opens the service's ingress from pods carrying
# that same label. Consumers: the *arr apps' webhook notifications.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-egress-homelab-manager
spec:
  description: "Pods labeled egress.home.arpa/homelab-manager=allow may reach homelab-manager on 8080"
  endpointSelector:
    matchLabels:
      egress.home.arpa/homelab-manager: allow
  egress:
    - toEndpoints:
        - matchLabels:
            app: homelab-manager
            io.kubernetes.pod.namespace: default
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-ingress-homelab-manager
spec:
  description: "Service side of egress.home.arpa/homelab-manager: homelab-manager accepts 8080 from consumers carrying the label"
  endpointSelector:
    matchLabels:
      app: homelab-manager
      io.kubernetes.pod.namespace: default
  ingress:
    - fromEndpoints:
        - matchLabels:
            egress.home.arpa/homelab-manager: allow
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
