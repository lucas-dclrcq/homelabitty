---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-egress-prowlarr
spec:
  description: "Pods labeled egress.home.arpa/prowlarr=allow may reach Prowlarr on 80"
  endpointSelector:
    matchLabels:
      egress.home.arpa/prowlarr: allow
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prowlarr
            io.kubernetes.pod.namespace: downloads
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-ingress-prowlarr
spec:
  description: "Service side of egress.home.arpa/prowlarr: Prowlarr accepts 80 from consumers carrying the label"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prowlarr
      io.kubernetes.pod.namespace: downloads
  ingress:
    - fromEndpoints:
        - matchLabels:
            egress.home.arpa/prowlarr: allow
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
