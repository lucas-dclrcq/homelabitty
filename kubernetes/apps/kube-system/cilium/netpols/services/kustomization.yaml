---
# In-cluster services with several consumers. Filename = the
# egress.home.arpa/<name> label; each file holds BOTH halves of the contract:
# the consumer's egress and the service's ingress from pods carrying the label.
# Labelling the consumer is enough, from any namespace.
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./postgres.yaml
  - ./mqtt.yaml
  - ./smtp.yaml
  - ./vault.yaml
  - ./ldap.yaml
  - ./sonarr.yaml
  - ./radarr.yaml
  - ./lidarr.yaml
  - ./prowlarr.yaml
  - ./qbittorrent.yaml
  - ./sabnzbd.yaml
  - ./slskd.yaml
  - ./jellyfin.yaml
  - ./homelab-manager.yaml
