---
# Paired vocabulary, same shape as ./radarr.yaml: the first policy opens the
# consumer's egress, the second opens the service's ingress from pods carrying
# that same label. Labelling the consumer is enough, from any namespace.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-egress-vault
spec:
  description: "Pods labeled egress.home.arpa/vault=allow may reach Vault (external-secrets operator, MCP servers)"
  endpointSelector:
    matchLabels:
      egress.home.arpa/vault: allow
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vault
            io.kubernetes.pod.namespace: vault
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-ingress-vault
spec:
  description: "Service side of egress.home.arpa/vault: vault accepts 8200 from consumers carrying the label"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vault
      io.kubernetes.pod.namespace: vault
  ingress:
    - fromEndpoints:
        - matchLabels:
            egress.home.arpa/vault: allow
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
