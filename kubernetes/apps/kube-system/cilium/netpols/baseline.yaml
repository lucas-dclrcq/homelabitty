---
# Baseline policy stamped into every enrolled app namespace.
#
# endpointSelector: {} selects every pod in the namespace and enableDefaultDeny
# flips it into default-deny for BOTH directions. The only flow this policy
# re-opens is DNS to kube-dns.
#
# Everything else is denied until it is explicitly whitelisted, *including
# traffic between two pods of the same namespace*. Whitelists come from either:
#   - a pod label matched by one of the CiliumClusterwideNetworkPolicies in this
#     directory (the shared vocabulary: gateways, postgres, mqtt, vault, ...), or
#   - a CiliumNetworkPolicy shipped with the app itself, for flows that are
#     specific to that app (same-namespace peers, one-off cross-namespace calls).
# See README.md.
#
# NOTE: kubelet health probes come from the host entity which Cilium always
# allows, so they are unaffected.
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: baseline
  namespace: ai
spec:
  description: "Default-deny both directions; only kube-dns is open. Every other flow, same-namespace included, must be whitelisted."
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
