---
# Baseline policy stamped into every enrolled app namespace.
#
# Selecting every pod (endpointSelector: {}) flips the whole namespace into
# default-deny for BOTH directions. The rules below then re-open the flows
# every workload needs with zero labels:
#   - intra-namespace traffic (app <-> dragonfly/sidecars/co-located services)
#   - DNS to kube-dns
# Everything else must be opened by pod labels matched by the
# CiliumClusterwideNetworkPolicies in this directory (see README.md).
#
# NOTE: kubelet health probes come from the host entity which Cilium always
# allows, so they are unaffected.
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: baseline
  namespace: ai
spec:
  description: "Default-deny; allow same-namespace + DNS. Open other flows via pod labels."
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
  egress:
    - toEndpoints:
        - {}
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
