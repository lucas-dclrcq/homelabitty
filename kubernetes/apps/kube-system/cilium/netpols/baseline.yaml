---
# Baseline policy stamped into every enrolled app namespace.
#
# endpointSelector: {} selects every pod in the namespace and the two rule
# sections below flip it into default-deny for BOTH directions. The only flows
# this policy re-opens are DNS to kube-dns and ingress from the host entity,
# which Cilium allows unconditionally anyway.
#
# Both sections must exist. Cilium enters default-deny for a direction only
# when a rule that selects the endpoint *has a section for that direction*;
# `enableDefaultDeny` can disable that, never enable it. An egress-only
# baseline therefore leaves ingress wide open on every pod that no other policy
# happens to select -- and because nothing is denied, audit mode reports
# nothing. See the ingress rule's own comment.
#
# Everything else is denied until it is explicitly whitelisted, *including
# traffic between two pods of the same namespace*. Whitelists come from either:
#   - a pod label matched by one of the CiliumClusterwideNetworkPolicies in this
#     directory (the shared vocabulary: gateways, postgres, mqtt, vault, ...), or
#   - a CiliumNetworkPolicy shipped with the app itself, for flows that are
#     specific to that app (same-namespace peers, one-off cross-namespace calls).
# See README.md.
#
# NOTE: kubelet health probes come from the host entity which Cilium always
# allows, so they are unaffected.
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: baseline
  namespace: ai
spec:
  description: "Default-deny both directions; only kube-dns is open. Every other flow, same-namespace included, must be whitelisted."
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    # Load-bearing: Cilium only puts an endpoint into ingress default-deny when
    # a rule that selects it *has an ingress section* -- `enableDefaultDeny`
    # can only switch that off, never on. Without these two lines a pod that no
    # other policy selects for ingress keeps an `Allow Ingress ANY` entry and
    # stays wide open. reserved:host is allowed unconditionally anyway (kubelet
    # probes), so the rule grants nothing; its presence is the whole point.
    - fromEntities:
        - host
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
