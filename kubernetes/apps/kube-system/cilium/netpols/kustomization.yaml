---
# The cluster-wide network policy catalog (see README.md).
# One file = one vocabulary label (or one platform concern); the per-namespace
# default-deny baseline is NOT here — it is a Kustomize component
# (kubernetes/components/netpol-baseline) included by each enrolled namespace.
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./destinations
  - ./services
  - ./platform
