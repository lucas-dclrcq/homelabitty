---
# The cluster-wide network policy catalog (see README.md).
# One file = one vocabulary label (or one platform concern). What is NOT here:
#   - the egress half of the default-deny baseline, which is the kube-dns pair
#     shipped with its owner (kubernetes/apps/kube-system/coredns/app)
#   - the per-service label pairs, which live next to the app that owns them
#     (kubernetes/apps/<ns>/<app>/app/ciliumclusterwidenetworkpolicy.yaml)
# Only the vocabulary with no single owning app remains here.
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./destinations
  - ./platform
