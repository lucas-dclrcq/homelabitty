---
# Paired vocabulary, same shape as allow-radarr.yaml: the first policy opens the
# consumer's egress, the second opens the service's ingress from pods carrying
# that same label. Consumers: the *arr apps' Jellyfin connection (library refresh on import).
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-egress-jellyfin
spec:
  description: "Pods labeled egress.home.arpa/jellyfin=allow may reach Jellyfin on 8096"
  endpointSelector:
    matchLabels:
      egress.home.arpa/jellyfin: allow
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: jellyfin
            io.kubernetes.pod.namespace: media
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-ingress-jellyfin
spec:
  description: "Service side of egress.home.arpa/jellyfin: Jellyfin accepts 8096 from consumers carrying the label"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
      io.kubernetes.pod.namespace: media
  ingress:
    - fromEndpoints:
        - matchLabels:
            egress.home.arpa/jellyfin: allow
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
