---
# The trusted LAN segment, 192.168.1.0/24: TrueNAS, the UPS, the NTP/GPS Pi,
# the UniFi gateway, the cluster's own LoadBalancer IPs.
#
# Prefer a narrower label when one fits: ./allow-egress-nas.yaml for TrueNAS
# alone, ./allow-egress-router.yaml for the UniFi gateway alone.
#
# Caveat: the six node IPs (192.168.1.11-16) live in this range but are the
# `remote-node` entity, and CIDR selectors do not match node IPs
# (`policy-cidr-match-mode` is unset). A pod probing a node by address needs
# the `host`/`remote-node` entities, not this label — see TASKS.md phase 5.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-egress-lan
spec:
  description: "Pods labeled egress.home.arpa/lan=allow may reach the trusted LAN segment 192.168.1.0/24 (TrueNAS, UPS, NTP Pi, router), any port"
  endpointSelector:
    matchLabels:
      egress.home.arpa/lan: allow
  egress:
    - toCIDR:
        - "192.168.1.0/24"
