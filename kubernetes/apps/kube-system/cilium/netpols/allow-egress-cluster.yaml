---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-egress-cluster
spec:
  description: "Escape hatch: pods labeled egress.home.arpa/cluster=allow may reach anything inside the cluster (vmagent, envoy gateways, cross-namespace API consumers)"
  endpointSelector:
    matchLabels:
      egress.home.arpa/cluster: allow
  egress:
    - toEntities:
        - cluster
