---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cilium-policy-audit
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  json: >-
    {
      "annotations": { "list": [] },
      "editable": false,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "title": "Audit Overview (policyAuditMode: traffic below is FORWARDED but would be DENIED once enforcement is enabled)",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "description": "Rate of flows that matched no allow rule. These flows still pass while policyAuditMode=true.",
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 10 }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "$datasource" },
              "expr": "sum(rate(hubble_policy_verdicts_total{action=\"audit\"}[$__rate_interval]))",
              "legendFormat": "Audit/s",
              "refId": "A"
            }
          ],
          "title": "Would-be-denied Rate",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "$datasource" },
              "expr": "sum(increase(hubble_policy_verdicts_total{action=\"audit\"}[$__range]))",
              "legendFormat": "Total",
              "refId": "A"
            }
          ],
          "title": "Would-be-denied (Range)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "description": "Distinct source workloads with at least one audited flow in the selected range. Target: 0 before flipping policyAuditMode off.",
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "text", "value": null }]
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "$datasource" },
              "expr": "count(count by (source_namespace, source) (increase(hubble_policy_verdicts_total{action=\"audit\", source_namespace=~\"$src_namespace\"}[$__range]) > 0))",
              "legendFormat": "Workloads",
              "refId": "A"
            }
          ],
          "title": "Source Workloads to Fix",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "description": "Actual policy drops. Must stay at 0 while policyAuditMode=true; becomes the metric to watch after enforcement is enabled.",
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "id": 5,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "$datasource" },
              "expr": "sum(rate(hubble_drop_total{reason=\"POLICY_DENIED\"}[$__rate_interval])) or vector(0)",
              "legendFormat": "Drops/s",
              "refId": "A"
            }
          ],
          "title": "Real Drops (enforce mode)",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "id": 6,
          "title": "Ingress audited - add an ingress.home.arpa/* label to the DESTINATION pod",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "description": "The DESTINATION pod's policies do not allow this source. Fix by labeling the destination (ingress.home.arpa/gateway-internal, gateway-external, prometheus, cluster, world, apiserver) or with a dedicated CiliumNetworkPolicy.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "custom": { "align": "auto", "cellOptions": { "type": "auto" }, "inspect": false },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }] }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Count" },
                "properties": [
                  { "id": "custom.cellOptions", "value": { "mode": "gradient", "type": "gauge" } },
                  { "id": "color", "value": { "mode": "continuous-RdYlGr" } },
                  { "id": "custom.width", "value": 150 }
                ]
              }
            ]
          },
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 6 },
          "id": 7,
          "options": {
            "cellHeight": "sm",
            "footer": { "countRows": false, "fields": "", "reducer": ["sum"], "show": false },
            "showHeader": true,
            "sortBy": [{ "desc": true, "displayName": "Count" }]
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "$datasource" },
              "expr": "topk(50, sum by (source_namespace, source, destination_namespace, destination) (increase(hubble_policy_verdicts_total{action=\"audit\", direction=\"ingress\", source_namespace=~\"$src_namespace\", destination_namespace=~\"$dst_namespace\"}[$__range])))",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Ingress audited flows (would be denied)",
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true },
                "indexByName": {
                  "source_namespace": 0,
                  "source": 1,
                  "destination_namespace": 2,
                  "destination": 3,
                  "Value": 4
                },
                "renameByName": {
                  "source_namespace": "Source NS",
                  "source": "Source",
                  "destination_namespace": "Dest NS",
                  "destination": "Destination",
                  "Value": "Count"
                }
              }
            }
          ],
          "type": "table"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 16 },
          "id": 8,
          "title": "Egress audited - add an egress.home.arpa/* label to the SOURCE pod",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "description": "The SOURCE pod's policies do not allow this destination. Fix by labeling the source (egress.home.arpa/world, postgres, mqtt, smtp, vault, apiserver, gateway-external, cluster) or with a dedicated CiliumNetworkPolicy. destination=world means outside the cluster.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "custom": { "align": "auto", "cellOptions": { "type": "auto" }, "inspect": false },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "orange", "value": null }] }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Count" },
                "properties": [
                  { "id": "custom.cellOptions", "value": { "mode": "gradient", "type": "gauge" } },
                  { "id": "color", "value": { "mode": "continuous-RdYlGr" } },
                  { "id": "custom.width", "value": 150 }
                ]
              }
            ]
          },
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 17 },
          "id": 9,
          "options": {
            "cellHeight": "sm",
            "footer": { "countRows": false, "fields": "", "reducer": ["sum"], "show": false },
            "showHeader": true,
            "sortBy": [{ "desc": true, "displayName": "Count" }]
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "$datasource" },
              "expr": "topk(50, sum by (source_namespace, source, destination_namespace, destination) (increase(hubble_policy_verdicts_total{action=\"audit\", direction=\"egress\", source_namespace=~\"$src_namespace\", destination_namespace=~\"$dst_namespace\"}[$__range])))",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Egress audited flows (would be denied)",
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true },
                "indexByName": {
                  "source_namespace": 0,
                  "source": 1,
                  "destination_namespace": 2,
                  "destination": 3,
                  "Value": 4
                },
                "renameByName": {
                  "source_namespace": "Source NS",
                  "source": "Source",
                  "destination_namespace": "Dest NS",
                  "destination": "Destination",
                  "Value": "Count"
                }
              }
            }
          ],
          "type": "table"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 27 },
          "id": 10,
          "title": "Audited Flows Over Time",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 20,
                "gradientMode": "none",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "insertNulls": false,
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": { "type": "linear" },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "normal" },
                "thresholdsStyle": { "mode": "off" }
              },
              "unit": "short",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 28 },
          "id": 11,
          "options": {
            "legend": { "calcs": ["sum"], "displayMode": "table", "placement": "right", "showLegend": true, "sortBy": "Total", "sortDesc": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "$datasource" },
              "expr": "sum by (source_namespace) (rate(hubble_policy_verdicts_total{action=\"audit\", source_namespace=~\"$src_namespace\", source_namespace!=\"\"}[$__rate_interval]))",
              "legendFormat": "{{ source_namespace }}",
              "refId": "A"
            }
          ],
          "title": "Audited by Source Namespace",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 20,
                "gradientMode": "none",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "insertNulls": false,
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": { "type": "linear" },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "normal" },
                "thresholdsStyle": { "mode": "off" }
              },
              "unit": "short",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 28 },
          "id": 12,
          "options": {
            "legend": { "calcs": ["sum"], "displayMode": "table", "placement": "right", "showLegend": true, "sortBy": "Total", "sortDesc": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "$datasource" },
              "expr": "sum by (destination_namespace) (rate(hubble_policy_verdicts_total{action=\"audit\", destination_namespace=~\"$dst_namespace\", destination_namespace!=\"\"}[$__rate_interval]))",
              "legendFormat": "{{ destination_namespace }}",
              "refId": "A"
            }
          ],
          "title": "Audited by Destination Namespace",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 36 },
          "id": 13,
          "title": "Breakdown",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "description": "Ingress vs egress audited flows",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "hideFrom": { "legend": false, "tooltip": false, "viz": false } },
              "mappings": []
            }
          },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 37 },
          "id": 14,
          "options": {
            "legend": { "displayMode": "table", "placement": "right", "showLegend": true, "values": ["value", "percent"] },
            "pieType": "pie",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "$datasource" },
              "expr": "sum by (direction) (increase(hubble_policy_verdicts_total{action=\"audit\"}[$__range]))",
              "legendFormat": "{{ direction }}",
              "refId": "A"
            }
          ],
          "title": "Audited by Direction",
          "type": "piechart"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "description": "Where audited traffic was going. 'world' = outside the cluster (missing egress.home.arpa/world), workload names = missing in-cluster allow.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "hideFrom": { "legend": false, "tooltip": false, "viz": false } },
              "mappings": []
            }
          },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 37 },
          "id": 15,
          "options": {
            "legend": { "displayMode": "table", "placement": "right", "showLegend": true, "values": ["value", "percent"] },
            "pieType": "pie",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "$datasource" },
              "expr": "topk(10, sum by (destination) (increase(hubble_policy_verdicts_total{action=\"audit\"}[$__range])))",
              "legendFormat": "{{ destination }}",
              "refId": "A"
            }
          ],
          "title": "Top Audited Destinations",
          "type": "piechart"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "description": "Coverage progress: the audit share should shrink to zero as labels are added. forwarded = explicitly allowed by a policy.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "showPoints": "never",
                "stacking": { "group": "A", "mode": "normal" }
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 37 },
          "id": 16,
          "options": {
            "legend": { "calcs": ["sum"], "displayMode": "table", "placement": "right", "showLegend": true, "sortBy": "Total", "sortDesc": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "$datasource" },
              "expr": "sum by (action) (rate(hubble_policy_verdicts_total[$__rate_interval]))",
              "legendFormat": "{{ action }}",
              "refId": "A"
            }
          ],
          "title": "All Policy Verdicts by Action",
          "type": "timeseries"
        }
      ],
      "schemaVersion": 39,
      "tags": ["cilium", "network", "security", "policy", "audit"],
      "templating": {
        "list": [
          {
            "current": { "selected": false, "text": "Prometheus", "value": "prometheus" },
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource"
          },
          {
            "allValue": ".*",
            "current": { "selected": true, "text": "All", "value": "$__all" },
            "datasource": { "type": "prometheus", "uid": "$datasource" },
            "definition": "label_values(hubble_policy_verdicts_total{action=\"audit\"}, source_namespace)",
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "name": "src_namespace",
            "options": [],
            "query": "label_values(hubble_policy_verdicts_total{action=\"audit\"}, source_namespace)",
            "refresh": 2,
            "sort": 1,
            "type": "query"
          },
          {
            "allValue": ".*",
            "current": { "selected": true, "text": "All", "value": "$__all" },
            "datasource": { "type": "prometheus", "uid": "$datasource" },
            "definition": "label_values(hubble_policy_verdicts_total{action=\"audit\"}, destination_namespace)",
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "name": "dst_namespace",
            "options": [],
            "query": "label_values(hubble_policy_verdicts_total{action=\"audit\"}, destination_namespace)",
            "refresh": 2,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": { "from": "now-6h", "to": "now" },
      "timepicker": {},
      "timezone": "",
      "title": "Cilium Policy Audit",
      "uid": "cilium-policy-audit",
      "version": 1
    }
