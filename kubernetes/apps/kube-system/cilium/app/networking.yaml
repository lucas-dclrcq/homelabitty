---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumloadbalancerippool_v2.json
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool
spec:
  allowFirstLastIPs: "No"
  blocks:
    # "Kubernetes Services" VLAN. Its addresses are not on any node interface:
    # each LoadBalancer IP is advertised to the router as a /32 over BGP (see
    # l3-bgp below), so L2 announcements are not needed.
    - cidr: 192.168.42.0/24
---
# BGP control plane v2 (BGPv1 CiliumBGPPeeringPolicy is removed in Cilium 1.19)
# https://docs.cilium.io/en/stable/network/bgp-control-plane/bgp-control-plane-v2/
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumbgpclusterconfig_v2.json
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: l3-bgp
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  bgpInstances:
    - name: instance-64514
      localASN: 64514
      peers:
        - name: router
          peerASN: 64513
          peerAddress: 192.168.1.1
          peerConfigRef:
            name: l3-bgp-peer
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumbgppeerconfig_v2.json
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: l3-bgp-peer
spec:
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: bgp
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumbgpadvertisement_v2.json
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: l3-bgp-services
  labels:
    advertise: bgp
spec:
  advertisements:
    # Pod CIDRs are not exported (same as exportPodCIDR: false in BGPv1)
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchExpressions:
          - key: thisFakeSelector
            operator: NotIn
            values:
              - will-match-and-announce-all-services
---
# Kubernetes API VIP: fronts the apiserver static pods (hostNetwork, so the
# endpoints are the control plane node IPs). externalTrafficPolicy: Local
# means Cilium only announces the /32 from nodes with a healthy apiserver,
# and client IPs are preserved in the audit logs. k8s.lulice.lan is a static
# A record on the UDM (NOT external-dns managed: it must resolve at rebuild
# time, before external-dns exists).
apiVersion: v1
kind: Service
metadata:
  name: kube-api
  namespace: kube-system
  annotations:
    lbipam.cilium.io/ips: 192.168.42.42
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    k8s-app: kube-apiserver
    tier: control-plane
  ports:
    - name: https
      port: 6443
      targetPort: 6443
