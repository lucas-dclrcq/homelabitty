---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cilium
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    autoDirectNodeRoutes: true
    # https://docs.cilium.io/en/stable/network/kubernetes/bandwidth-manager/
    #    bandwidthManager:
    #      enabled: true
    #      bbr: true
    bpf:
      #      datapathMode: netkit
      masquerade: true
    #      preallocateMaps: true
    #      tproxy: true
    # https://docs.cilium.io/en/stable/operations/performance/tuning/#ebpf-clock-probe
    #    bpfClockProbe: true
    bgpControlPlane:
      enabled: true
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    cni:
      exclusive: false
    dashboards:
      enabled: true
    # NOTE: devices might need to be set if you have more than one active NIC on your hosts
    # devices: eno+ eth+
    #    enableIPv4BIGTCP: true
    cluster:
      id: 1
      name: "hoohoot"
    endpointRoutes:
      enabled: true
    envoy:
      enabled: false
    gatewayAPI:
      enabled: false
    hubble:
      enabled: true
      metrics:
        enabled:
          - dns:query
          - drop:sourceContext=workload-name|pod|reserved-identity;destinationContext=workload-name|pod|reserved-identity;labelsContext=source_namespace,source_workload,destination_namespace,destination_workload,traffic_direction
          - tcp
          - flow:sourceContext=namespace|workload-name;destinationContext=namespace|workload-name;labelsContext=source_namespace,destination_namespace
          - port-distribution
          - icmp
          - http
          # policy verdict events: action="audit" = flows that WOULD be denied
          # while policyAuditMode is on (see cilium-policy-audit dashboard)
          - policy:sourceContext=workload-name|pod|reserved-identity;destinationContext=workload-name|pod|reserved-identity;labelsContext=source_namespace,source_workload,destination_namespace,destination_workload,traffic_direction
        serviceMonitor:
          enabled: true
        dashboards:
          enabled: true
      relay:
        enabled: true
        rollOutPods: true
        prometheus:
          serviceMonitor:
            enabled: true
      ui:
        enabled: true
        rollOutPods: true
      tls:
        auto:
          # Rotate hubble certs via certgen CronJob (helm-generated certs expired)
          method: cronJob
          # Must stay below the remaining lifetime of the reused cilium-ca
          # (3 years): since 1.20 certgen refuses leaves outliving the CA.
          certValidityDuration: 365
          schedule: "0 0 1 */4 *"
    ipam:
      mode: kubernetes
    ipv4NativeRoutingCIDR: "10.69.0.0/16"
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 7445
    kubeProxyReplacement: true
    kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
    loadBalancer:
      algorithm: maglev
      mode: snat # dsr ?
    localRedirectPolicies:
      enabled: true
    # SAFETY NET while rolling out network policies: verdicts are computed and
    # exported (hubble_policy_verdicts_total{action="audit"}) but traffic that
    # would be denied is still FORWARDED. Flip to false once the
    # cilium-policy-audit Grafana dashboard stays clean.
    policyAuditMode: true
    operator:
      dashboards:
        enabled: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
      replicas: 2
      rollOutPods: true
    #    pmtuDiscovery:
    #      enabled: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true
    rollOutCiliumPods: true
    routingMode: native
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - PERFMON
          - BPF
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
