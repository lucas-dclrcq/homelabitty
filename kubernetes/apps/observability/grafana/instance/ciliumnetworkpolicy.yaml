---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana
spec:
  description: "Grafana reads the four in-namespace datasources declared in ./grafanadatasource.yaml"
  endpointSelector:
    matchLabels:
      app: grafana
  ingress:
    # grafana-operator reconciles dashboards/datasources through the HTTP API
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: grafana-operator
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # grafana-mcp (ai namespace) queries the same API
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: grafana-mcp
            io.kubernetes.pod.namespace: ai
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmsingle
      toPorts:
        - ports:
            - port: "8428"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vtsingle
      toPorts:
        - ports:
            - port: "10428"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: victoria-logs-single
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmalertmanager
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
