---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-operator
spec:
  chartRef:
    kind: OCIRepository
    name: grafana-operator
  interval: 1h
  values:
    podLabels:
      ingress.home.arpa/prometheus: allow
      egress.home.arpa/apiserver: allow
      # The operator -- not Grafana -- fetches every GrafanaDashboard that has
      # a `url:` and caches the JSON in the CR status. 45 of ours do, over
      # raw.githubusercontent.com and grafana.com, both 443 only.
      egress.home.arpa/internet-https: allow
    dashboard:
      enabled: true
    serviceMonitor:
      enabled: true
