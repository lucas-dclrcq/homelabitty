---
# LAN-facing ingestion endpoint, used by hosts that are not in the cluster and
# therefore cannot reach the ClusterIP: today the NTP Pi, which ships its
# journal with systemd-journal-upload (ansible/roles/journal_upload).
#
# It predates the move of LoadBalancer IPs to the routed "Kubernetes Services"
# VLAN (192.168.42.0/24). Back then the internal gateway VIP sat in
# 192.168.1.0/24 and was announced over L2 as well as BGP; with
# externalTrafficPolicy: Local, a LAN host ARPed for it on-link and landed on
# whichever node held the L2 lease, usually one without an envoy pod. Every LB
# IP is now reached through the router (BGP only), so that trap is gone, but
# this plain-http endpoint is kept: Cluster policy lets every node forward to
# the single victoria-logs pod, and the client needs no certificate handling.
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes-definitions.json
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs-ingest
  annotations:
    external-dns.kubernetes.io/hostname: "vlogs-ingest.hoohoot.xyz"
    io.cilium/lb-ipam-ips: "192.168.42.49"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app: server
    app.kubernetes.io/instance: victoria-logs
    app.kubernetes.io/name: victoria-logs-single
  ports:
    - name: http
      port: 9428
      targetPort: http
      protocol: TCP
