---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: victoria-logs
spec:
  description: "Log ingestion comes from the node collector and from LAN hosts on victoria-logs-ingest; queries arrive through the internal gateway and Grafana"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: victoria-logs-single
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: fluent-bit
        - matchLabels:
            app: grafana
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
    # victoria-logs-ingest is a LoadBalancer reached straight from the LAN
    # (remote-node covers the externalTrafficPolicy=Cluster hop). Today that
    # is the NTP Pi pushing its journal, see ./service-ingest.yaml
    - fromEntities:
        - world
        - remote-node
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
