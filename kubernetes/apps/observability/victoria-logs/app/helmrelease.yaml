---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: victoria-logs-single
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    global:
      image:
        registry: quay.io
    dashboards:
      enabled: true
    server:
      fullnameOverride: victoria-logs
      extraArgs:
        # journald ingestion (the NTP Pi, see ./service-ingest.yaml) takes no
        # query arguments: systemd-journal-upload appends /upload to whatever
        # URL it is given unless it already ends with it, which would land
        # inside the query string. Stream fields are therefore set here.
        journald.streamFields: _HOSTNAME,_SYSTEMD_UNIT
      podLabels:
        ingress.home.arpa/gateway-internal: allow
        ingress.home.arpa/prometheus: allow
        # log shippers and Grafana: ./ciliumnetworkpolicy.yaml
      retentionPeriod: 7d
      persistentVolume:
        enabled: true
        storageClassName: openebs-hostpath
        size: 50Gi
      serviceMonitor:
        enabled: true
      route:
        enabled: true
        parentRefs:
          - name: internal
            namespace: network
        hostnames:
          - "vlogs.hoohoot.xyz"
        extraRules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /select/vmui/
                  statusCode: 302
            matches:
              - path:
                  type: Exact
                  value: /
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
