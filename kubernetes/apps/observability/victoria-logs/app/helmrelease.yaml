---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: victoria-logs-single
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    global:
      image:
        registry: quay.io
    server:
      fullnameOverride: victoria-logs
      retentionPeriod: 7d
      persistentVolume:
        enabled: true
        storageClassName: openebs-hostpath
        size: 50Gi
      serviceMonitor:
        enabled: true
      route:
        enabled: true
        parentRefs:
          - name: internal
            namespace: network
        hostnames:
          - "vlogs.${LIMITED_DOMAIN}"
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
