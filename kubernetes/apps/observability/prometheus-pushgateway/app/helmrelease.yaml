---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app prometheus-pushgateway
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    rawResources:
      netpol:
        manifest:
          apiVersion: cilium.io/v2
          kind: CiliumNetworkPolicy
          spec:
            description: "Batch jobs push their run metrics here; today that is the pacman-sync CronJob in the development namespace"
            endpointSelector:
              matchLabels:
                app.kubernetes.io/name: prometheus-pushgateway
            ingress:
              - fromEndpoints:
                  - matchLabels:
                      app.kubernetes.io/name: pacman
                      io.kubernetes.pod.namespace: development
                toPorts:
                  - ports:
                      - port: "9091"
                        protocol: TCP

    controllers:
      pushgateway:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: quay.io/prometheus/pushgateway
              tag: v1.11.4
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /-/healthy
                    port: &port 9091
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /-/ready
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - "ALL"
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
    defaultPodOptions:
      labels:
        ingress.home.arpa/prometheus: allow
        # pushers are whitelisted in rawResources.netpol above
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
    service:
      app:
        controller: pushgateway
        ports:
          metrics:
            port: *port
