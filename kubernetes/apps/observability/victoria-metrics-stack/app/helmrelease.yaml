---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
spec:
  interval: 30m
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: vmks

    defaultRules:
      groups:
        # Only contains count:up0/count:up1. count:up0 has no data when all
        # targets are up, which trips RecordingRulesNoData.
        kube-prometheus-general.rules:
          enabled: false

    extraRules:
      dockerhub-rules:
        groups:
          - name: dockerhub
            rules:
              - alert: DockerhubRateLimitRisk
                annotations:
                  summary: Kubernetes cluster Dockerhub rate limit risk
                expr: count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
                labels:
                  severity: critical
      oom-rules:
        groups:
          - name: oom
            rules:
              - alert: OomKilled
                annotations:
                  summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
                expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
                labels:
                  severity: critical

    victoria-metrics-operator:
      enabled: true
      # Watches CRs via the API; its validating webhook is called by kube-apiserver
      podLabels:
        ingress.home.arpa/apiserver: allow
        ingress.home.arpa/prometheus: allow
        egress.home.arpa/apiserver: allow

    vmsingle:
      enabled: true
      spec:
        podMetadata:
          labels:
            # route on the internal gateway (victoriametrics.hoohoot.xyz)
            ingress.home.arpa/gateway-internal: allow
            ingress.home.arpa/prometheus: allow
        retentionPeriod: 30d
        useStrictSecurity: true
        extraArgs:
          maxLabelsPerTimeseries: "40"
          search.maxUniqueTimeseries: "600000"
          search.minStalenessInterval: 5m
        storage:
          accessModes:
            - ReadWriteOnce
          storageClassName: openebs-hostpath
          resources:
            requests:
              storage: 75Gi
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 4Gi
      route:
        enabled: true
        parentRefs:
          - name: internal
            namespace: network
        hostnames:
          - "victoriametrics.hoohoot.xyz"

    vmagent:
      enabled: true
      spec:
        podMetadata:
          labels:
            ingress.home.arpa/prometheus: allow
            # scrape targets are whitelisted in
            # ./ciliumclusterwidenetworkpolicy.yaml
        extraArgs:
          promscrape.streamParse: "true"
          # apiserver /metrics exceeds the 16MiB default
          promscrape.maxScrapeSize: 64MiB
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
          limits:
            cpu: 500m
            memory: 500Mi

    vmalert:
      enabled: true
      spec:
        podMetadata:
          labels:
            ingress.home.arpa/prometheus: allow

    alertmanager:
      enabled: true
      spec:
        podMetadata:
          labels:
            # route on the internal gateway (alertmanager.hoohoot.xyz)
            ingress.home.arpa/gateway-internal: allow
            ingress.home.arpa/prometheus: allow
            # pushover/heartbeat receivers -> internet; the Robusta webhook and
            # the gossip mesh are in ./ciliumnetworkpolicy.yaml
            egress.home.arpa/internet-https: allow
        externalURL: https://alertmanager.hoohoot.xyz
        disableNamespaceMatcher: true
      config:
        global:
          resolve_timeout: 5m
        route:
          receiver: blackhole
      route:
        enabled: true
        parentRefs:
          - name: internal
            namespace: network
        hostnames:
          - "alertmanager.hoohoot.xyz"

    vtsingle:
      enabled: true
      spec:
        podMetadata:
          labels:
            ingress.home.arpa/prometheus: allow
        retentionPeriod: "24h"
        grpcSpec:
          listenPort: 4317
        storage:
          accessModes:
            - ReadWriteOnce
          storageClassName: openebs-hostpath
          resources:
            requests:
              storage: 10Gi

    grafana:
      enabled: false

    defaultDashboards:
      enabled: false

    syncJob:
      enabled: true

    prometheus-node-exporter:
      fullnameOverride: node-exporter
      vmScrape:
        spec:
          endpoints:
            - port: metrics
              relabelConfigs:
                - action: replace
                  regex: (.*)
                  replacement: $1
                  sourceLabels:
                    - "__meta_kubernetes_pod_node_name"
                  targetLabel: kubernetes_node
              metricRelabelConfigs:
                - action: drop
                  sourceLabels:
                    - mountpoint
                  regex: "/var/lib/kubelet/pods.+"

    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      # Watches every object kind via the Kubernetes API
      podLabels:
        ingress.home.arpa/prometheus: allow
        egress.home.arpa/apiserver: allow
      metricLabelsAllowlist:
        - pods=[*]
        - deployments=[*]
        - persistentvolumeclaims=[*]
      vmScrape:
        spec:
          endpoints:
            - port: http
              honorLabels: true
              relabelConfigs:
                - action: replace
                  regex: (.*)
                  replacement: $1
                  sourceLabels:
                    - "__meta_kubernetes_pod_node_name"
                  targetLabel: kubernetes_node
              metricRelabelConfigs:
                - action: labeldrop
                  regex: (uid|container_id|image_id)

    kubelet:
      vmScrape:
        spec:
          metricRelabelConfigs:
            - action: labeldrop
              regex: (uid)
            - action: labeldrop
              regex: (id|name)
            - action: drop
              source_labels:
                - __name__
              regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
            # Drop cgroup-hierarchy series: image="" AND name="" AND namespace="" AND pod=""
            # cAdvisor emits metrics for every cgroup in /sys/fs/cgroup. These carry
            # empty image/name/namespace/pod and account for the bulk of series count.
            - action: drop
              source_labels:
                - image
                - name
                - namespace
                - pod
              regex: ";+;+;+"
              separator: ";"
          relabelConfigs:
            - action: labelmap
              regex: __meta_kubernetes_node_label_(.+)
            # Drop NFD/Talos-extension and other low-value node labels that explode cardinality.
            - action: labeldrop
              regex: (feature_node|extensions_talos_dev|beta_kubernetes|plan_upgrade_cattle_io|openebs_io|katacontainers_io|topology_rook_io_).*
            - action: labeldrop
              regex: .*kubevirt_io.*
            - action: labeldrop
              regex: .*home_arpa.*
            - sourceLabels:
                - __metrics_path__
              targetLabel: metrics_path
            - targetLabel: job
              replacement: kubelet

    kubeEtcd:
      service:
        # Talos exposes etcd metrics over plain HTTP (listen-metrics-urls)
        port: 2381
        targetPort: 2381
        selector:
          component: kube-apiserver
      vmScrape:
        spec:
          endpoints:
            - port: http-metrics
              scheme: http

    # Talos serving certs are only valid for localhost
    kubeControllerManager:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                insecureSkipVerify: true

    kubeScheduler:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                insecureSkipVerify: true

    kubeProxy:
      enabled: false
