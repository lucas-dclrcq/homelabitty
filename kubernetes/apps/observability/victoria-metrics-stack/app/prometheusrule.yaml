---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: miscellaneous-rules
spec:
  groups:
    - name: dockerhub
      rules:
        - alert: BootstrapRateLimitRisk
          annotations:
            summary: Kubernetes cluster at risk of being rate limited by dockerhub on bootstrap
          expr: count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
          for: 15m
          labels:
            severity: critical
    - name: oom
      rules:
        - alert: OOMKilled
          annotations:
            summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
          expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
          labels:
            severity: critical
    - name: pod-failures
      rules:
        # KubePodNotReady only matches phase Pending|Unknown|Running-not-ready, and
        # KubeJobFailed only covers Job-owned pods, so a pod stuck in phase Failed
        # that no Job owns (bare pods, evicted pods) is otherwise never alerted on.
        - alert: KubePodFailed
          annotations:
            summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in the Failed phase for more than 1 hour.
          expr: (max by (namespace, pod) (kube_pod_status_phase{job="kube-state-metrics",phase="Failed"}) == 1) unless on (namespace, pod) (max by (namespace, pod) (kube_pod_owner{job="kube-state-metrics",owner_kind="Job"}))
          for: 1h
          labels:
            severity: warning
