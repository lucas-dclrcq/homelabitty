---
# vmagent is the one workload whose peer set really is "most of the cluster":
# it scrapes every ServiceMonitor/PodMonitor target, in every namespace, which
# is why this is clusterwide rather than a CiliumNetworkPolicy (a namespaced
# policy would have io.kubernetes.pod.namespace=observability injected into
# every selector below and match almost nothing).
#
# It is still a whitelist, not an escape hatch. vmagent may reach:
#   - pods that opted in with ingress.home.arpa/prometheus
#   - Dragonfly instances, whose exporter is the Redis port itself
#   - the system namespaces deliberately left out of the baseline
#     (kube-system, flux-system, rook-ceph, cert-manager, external-secrets,
#     kopiur-system, openebs-system, system-upgrade), whose pods therefore
#     carry no ingress labels
#   - host/remote-node for the host-network exporters (node-exporter, smartctl,
#     kubelet) and the API server
#   - the two LAN hosts that are not cluster nodes and run the same exporters,
#     on those ports only (see ./scrapeconfig.yaml)
# An unlabelled application pod stays unreachable.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-egress-vmagent
spec:
  description: "vmagent scrapes opted-in pods, the exempt system namespaces and the host-network exporters, and remote-writes to vmsingle"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmagent
      io.kubernetes.pod.namespace: observability
  egress:
    - toEndpoints:
        - matchLabels:
            ingress.home.arpa/prometheus: allow
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/part-of: dragonfly
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    # the authentik outposts are created by authentik, not by us: no chart value
    # labels them, so they are named here like the dragonfly instances. The
    # matching ingress ships with authentik
    # (apps/auth/authentik/app/ciliumclusterwidenetworkpolicy.yaml).
    - toEndpoints:
        - matchLabels:
            app: authentik-outpost
            io.kubernetes.pod.namespace: auth
      toPorts:
        - ports:
            - port: "9300"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cert-manager
        - matchLabels:
            io.kubernetes.pod.namespace: external-secrets
        - matchLabels:
            io.kubernetes.pod.namespace: flux-system
        - matchLabels:
            io.kubernetes.pod.namespace: kopiur-system
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
        - matchLabels:
            io.kubernetes.pod.namespace: openebs-system
        - matchLabels:
            io.kubernetes.pod.namespace: rook-ceph
        - matchLabels:
            io.kubernetes.pod.namespace: system-upgrade
    - toEntities:
        - host
        - remote-node
        - kube-apiserver
    # LAN hosts that are not cluster nodes, from ./scrapeconfig.yaml:
    # truenas.lulice.lan (node-exporter 9100, smartctl 9633) and
    # ntp.lulice.lan (the same two, plus chrony 9123 and gpsd 9015).
    # Hardcoded because a CIDR rule cannot follow a hostname.
    - toCIDR:
        - "192.168.1.70/32"
        - "192.168.1.118/32"
      toPorts:
        - ports:
            - port: "9015"
              protocol: TCP
            - port: "9100"
              protocol: TCP
            - port: "9123"
              protocol: TCP
            - port: "9633"
              protocol: TCP
    # remote write
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmsingle
            io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "8428"
              protocol: TCP
---
# Service side of ingress.home.arpa/prometheus: the mirror of the first egress
# rule above. A pod that opted in accepts vmagent, and vmagent alone.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-ingress-prometheus
spec:
  endpointSelector:
    matchLabels:
      ingress.home.arpa/prometheus: allow
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmagent
            k8s:io.kubernetes.pod.namespace: observability
---
# Paired vocabulary for egress.home.arpa/alertmanager, owned by the stack that
# runs Alertmanager: the first policy opens the consumer's egress, the second
# opens vmalertmanager's ingress from pods carrying the label. The Alertmanager
# API has several readers (karma today; grafana and silence-operator still name
# it in their own CiliumNetworkPolicy and can migrate onto the label), which is
# why this is a pair and not one more entry in the `vmalertmanager` whitelist.
# The gossip port 9094 stays out: that is replica-to-replica traffic, not an
# API call, and it is covered by `./ciliumnetworkpolicy.yaml`.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-egress-alertmanager
spec:
  description: "Pods labeled egress.home.arpa/alertmanager=allow may reach the Alertmanager API on 9093"
  endpointSelector:
    matchLabels:
      egress.home.arpa/alertmanager: allow
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmalertmanager
            io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-ingress-alertmanager
spec:
  description: "Service side of egress.home.arpa/alertmanager: vmalertmanager accepts 9093 from consumers carrying the label"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmalertmanager
      io.kubernetes.pod.namespace: observability
  ingress:
    - fromEndpoints:
        - matchLabels:
            egress.home.arpa/alertmanager: allow
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
