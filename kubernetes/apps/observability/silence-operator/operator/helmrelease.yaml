---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: silence-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: silence-operator
  values:
    alertmanagerAddress: http://vmalertmanager-vmks:9093
    networkPolicy:
      enabled: false
  # The chart exposes no podLabels value; patch the pod template instead.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: silence-operator
            patch: |-
              - op: add
                path: /spec/template/metadata/labels/egress.home.arpa~1apiserver
                value: allow
              - op: add
                path: /spec/template/metadata/labels/ingress.home.arpa~1prometheus
                value: allow
