---
# ./probes.yaml pings the six cluster nodes by name (bee.lulice.lan … →
# 192.168.1.11-16). Those addresses are the `host`/`remote-node` entities, and
# CIDR selectors never match node IPs (`policy-cidr-match-mode` is unset), so
# neither the old egress.home.arpa/world nor the new /lan label covers them —
# only the entities do. Same reasoning as `allow-egress-vmagent` in
# apps/observability/victoria-metrics-stack/app/.
#
# The rest of the probe set is vocabulary: /lan for truenas and the UPS, /iot
# for robovac, /internet for 1.1.1.1 & co, /gateway-* for the cluster's own
# hostnames. See ./helmrelease.yaml.
#
# The selector is on `instance`, not `name`: the chart sets
# app.kubernetes.io/name=prometheus-blackbox-exporter on both this deployment
# and blackbox-exporter-vpn, which probes only through its multus interface and
# must not inherit this.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: blackbox-exporter-lan
spec:
  description: "blackbox-exporter-lan pings the cluster nodes, which are the host/remote-node entities rather than CIDRs"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: blackbox-exporter-lan
  egress:
    - toEntities:
        - host
        - remote-node
      icmps:
        - fields:
            - type: 8
              family: IPv4
