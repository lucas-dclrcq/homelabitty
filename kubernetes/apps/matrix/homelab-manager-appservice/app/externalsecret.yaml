---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-manager-appservice
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: homelab-manager-appservice-secret
    template:
      engineVersion: v2
      templateFrom:
        - target: Data
          configMap:
            name: homelab-manager-appservice-base-config
            items:
              - key: registration.yaml
                templateAs: Values
  dataFrom:
    - extract:
        key: common/matrix
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: hashicorp-vault
