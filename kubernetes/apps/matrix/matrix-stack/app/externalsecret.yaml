---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synapse
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: synapse-secret
    template:
      engineVersion: v2
      data:
        signing.key: "{{ .SIGNING_KEY }}"
        POSTGRES_PASSWORD: '{{ .pg_password }}'
  dataFrom:
    - extract:
        key: matrix/synapse
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: hashicorp-vault
    - extract:
        key: postgres-16-pguser-synapse
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: crunchy-pgo-secrets
      rewrite:
        - regexp:
            source: "(.*)"
            target: "pg_$1"
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mas
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: mas-secret
    template:
      engineVersion: v2
      data:
        encryption: "{{ .SECRETS_ENCRYPTION }}"
        synapse-shared-secret: "{{ .SYNAPSE_SECRET }}"
        # Key order verified against the live MAS JWKS: 0=RSA, 1=EC P-256,
        # 2=EC P-384, 3=EC secp256k1. MAS auto-detects the algorithm from the
        # PEM contents, so a slot mismatch would still load correctly.
        rsa.pem: "{{ .SECRETS_KEYS_0_KEY }}"
        ecdsa-prime256v1.pem: "{{ .SECRETS_KEYS_1_KEY }}"
        ecdsa-secp384r1.pem: "{{ .SECRETS_KEYS_2_KEY }}"
        ecdsa-secp256k1.pem: "{{ .SECRETS_KEYS_3_KEY }}"
        POSTGRES_PASSWORD: '{{ .pg_password }}'
  dataFrom:
    - extract:
        key: matrix/mas
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: hashicorp-vault
    - extract:
        key: postgres-16-pguser-mas
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: crunchy-pgo-secrets
      rewrite:
        - regexp:
            source: "(.*)"
            target: "pg_$1"
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mas-additional
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: mas-additional-secret
    template:
      engineVersion: v2
      templateFrom:
        - target: Data
          configMap:
            name: mas-additional-config
            items:
              - key: upstream-oauth2.yaml
                templateAs: Values
  dataFrom:
    - extract:
        key: matrix/mas
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: hashicorp-vault
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hookshot
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: hookshot-secret
    template:
      engineVersion: v2
      data:
        passkey.pem: "{{ .MATRIX_HOOKSHOT_PEM_KEY }}"
      templateFrom:
        - target: Data
          configMap:
            name: hookshot-registration-config
            items:
              - key: registration.yaml
                templateAs: Values
  dataFrom:
    - extract:
        key: matrix/matrix-hookshot
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: hashicorp-vault
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hookshot-github
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: hookshot-github-secret
    template:
      engineVersion: v2
      data:
        github-key.pem: "{{ .GITHUB_PEM_KEY }}"
      templateFrom:
        - target: Data
          configMap:
            name: hookshot-github-config
            items:
              - key: github.yaml
                templateAs: Values
  dataFrom:
    - extract:
        key: matrix/matrix-hookshot
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: hashicorp-vault
