---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: hashicorp-vault
  target:
    name: matrix-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        client-id: "{{ .AUTHENTIK_CLIENT_ID }}"
        client-secret: "{{ .AUTHENTIK_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: matrix/mas
