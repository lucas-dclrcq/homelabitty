---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # Release name "matrix" prefixes every chart resource (matrix-synapse,
  # matrix-mas, ...).
  name: matrix
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: matrix-stack
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    serverName: "hoohoot.org"

    # No ingress controller runs in this cluster: the chart-generated Ingress
    # objects are inert. Real routing is done by the HTTPRoutes in
    # httproute.yaml pointing at the chart Services.
    ingress:
      tlsEnabled: false

    postgres:
      enabled: false

    # init-secrets and deployment-markers are hook Jobs that talk to the kube
    # API to create/update Secrets and ConfigMaps.
    initSecrets:
      labels:
        egress.home.arpa/apiserver: allow

    deploymentMarkers:
      labels:
        egress.home.arpa/apiserver: allow

    # In-namespace cache; synapse/MAS reach it through the matrix-stack-internal
    # policy in ./ciliumnetworkpolicy.yaml, the label only opens the metrics scrape.
    valkey:
      labels:
        ingress.home.arpa/prometheus: allow

    # The matrix-synapse (8008) and matrix-well-known (8010) Services select the
    # chart's HAProxy pods, which then proxy to synapse in-namespace: the
    # gateway ingress labels must sit on HAProxy for client/federation/well-known
    # traffic to arrive.
    haproxy:
      labels:
        ingress.home.arpa/gateway-external: allow
        ingress.home.arpa/gateway-internal: allow
        ingress.home.arpa/prometheus: allow

    synapse:
      enabled: true
      labels:
        ingress.home.arpa/gateway-external: allow
        ingress.home.arpa/gateway-internal: allow
        ingress.home.arpa/prometheus: allow
        egress.home.arpa/postgres: allow
        egress.home.arpa/smtp: allow
        egress.home.arpa/gateway-external: allow
        egress.home.arpa/internet: allow
      # The chart copies extraInitContainers into the pre-install check-config
      # hook Job, which has no `media` volume: the Job is rejected and the
      # install loops forever. Re-enable together with removing media-migrate.
      checkConfigHook:
        enabled: false
      ingress:
        host: "matrix.hoohoot.org"
      postgres:
        host: postgres-16-primary.infrastructure.svc.cluster.local
        port: 5432
        user: synapse
        database: synapse
        sslMode: prefer
        password:
          secret: synapse-secret
          secretKey: POSTGRES_PASSWORD
      media:
        storage:
          existingClaim: synapse
        maxUploadSize: 100M
      signingKey:
        secret: synapse-secret
        secretKey: signing.key
      appservices:
        - secret: mautrix-whatsapp-secret
          secretKey: registration.yaml
        - secret: mautrix-facebook-secret
          secretKey: registration.yaml
        - secret: mautrix-instagram-secret
          secretKey: registration.yaml
        - secret: mautrix-discord-secret
          secretKey: registration.yaml
        - secret: mautrix-discord-secret
          secretKey: double-puppet-registration.yaml
      additional:
        0-homelab:
          config: |
            email:
              smtp_host: smtp-relay.infrastructure.svc.cluster.local
              smtp_port: 2525
              notif_from: "Hoohoot Matrix <noreply@hoohoot.org>"
            presence:
              enabled: true
            enable_3pid_lookup: false
            use_appservice_legacy_authorization: true
            report_stats: true
            url_preview_enabled: true
            url_preview_ip_range_blacklist:
              - "127.0.0.0/8"
              - "10.0.0.0/8"
              - "192.168.0.0/16"
      # One-time migration: the ananace chart stored media at <pvc>/media,
      # ESS expects <pvc>/media_store. Remove after the first successful start.
      extraInitContainers:
        - name: media-migrate
          image: docker.io/library/busybox:1.37
          command:
            - sh
            - -c
            - if [ -d /media/media ] && [ ! -d /media/media_store ]; then mv /media/media /media/media_store; fi
          volumeMounts:
            - name: media
              mountPath: /media
      podSecurityContext:
        fsGroupChangePolicy: OnRootMismatch
      resources:
        requests:
          cpu: 1000m
          memory: 2500Mi
        limits:
          memory: 2500Mi

    matrixAuthenticationService:
      enabled: true
      labels:
        ingress.home.arpa/gateway-external: allow
        ingress.home.arpa/prometheus: allow
        egress.home.arpa/postgres: allow
        # MAS sends account emails through smtp-relay (additional.0-email below)
        egress.home.arpa/smtp: allow
        egress.home.arpa/gateway-external: allow
      # Pinned ahead of the chart: ESS 26.10.0 ships MAS 1.26.0, but the
      # cluster already runs 1.27. The downgrade would be schema-safe (no
      # migrations between 1.24 and 1.27) but is still a needless regression.
      # Remove this override once an ESS release ships 1.27+, so the image
      # tracks the chart again. The annotation is required because ESS splits
      # registry/repository, which renovate's helm-values manager cannot
      # resolve on its own.
      image:
        # renovate: datasource=docker depName=oci.element.io/matrix-authentication-service
        tag: "1.27.1"
      ingress:
        # Must never change: MAS public_base/issuer identity is derived from it.
        host: "mas.hoohoot.org"
      postgres:
        host: postgres-16-primary.infrastructure.svc.cluster.local
        port: 5432
        user: mas
        database: mas
        sslMode: prefer
        password:
          secret: mas-secret
          secretKey: POSTGRES_PASSWORD
      encryptionSecret:
        secret: mas-secret
        secretKey: encryption
      synapseSharedSecret:
        secret: mas-secret
        secretKey: synapse-shared-secret
      privateKeys:
        rsa:
          secret: mas-secret
          secretKey: rsa.pem
        ecdsaPrime256v1:
          secret: mas-secret
          secretKey: ecdsa-prime256v1.pem
        ecdsaSecp256k1:
          secret: mas-secret
          secretKey: ecdsa-secp256k1.pem
        ecdsaSecp384r1:
          secret: mas-secret
          secretKey: ecdsa-secp384r1.pem
      additional:
        0-email:
          config: |
            email:
              from: "matrix@hoohoot.org"
              reply_to: "matrix@hoohoot.org"
              transport: smtp
              mode: plain
              port: 2525
              hostname: smtp-relay.infrastructure.svc.cluster.local
        1-passwords:
          config: |
            passwords:
              enabled: true
              schemes:
                - version: 1
                  algorithm: bcrypt
                - version: 2
                  algorithm: argon2id
              minimum_complexity: 3
        2-upstream-oauth2:
          configSecret: mas-additional-secret
          configSecretKey: upstream-oauth2.yaml

    elementWeb:
      enabled: true
      labels:
        ingress.home.arpa/gateway-external: allow
      ingress:
        host: "element.hoohoot.org"
      additional:
        user-config.json: |
          {
            "disable_custom_urls": false,
            "disable_guests": false,
            "disable_login_language_selector": false,
            "disable_3pid_login": false,
            "brand": "Element",
            "integrations_ui_url": "https://scalar.vector.im/",
            "integrations_rest_url": "https://scalar.vector.im/api",
            "integrations_widgets_urls": [
              "https://scalar.vector.im/_matrix/integrations/v1",
              "https://scalar.vector.im/api",
              "https://scalar-staging.vector.im/_matrix/integrations/v1",
              "https://scalar-staging.vector.im/api",
              "https://scalar-staging.riot.im/scalar/api"
            ],
            "bug_report_endpoint_url": "https://element.io/bugreports/submit",
            "defaultCountryCode": "US",
            "show_labs_settings": false,
            "default_federate": true,
            "default_theme": "dark",
            "room_directory": {
              "servers": ["matrix.org"]
            },
            "enable_presence_by_hs_url": {
              "https://matrix.org": false,
              "https://matrix-client.matrix.org": false
            },
            "setting_defaults": {
              "breadcrumbs": true
            },
            "jitsi": {
              "preferred_domain": "meet.element.io"
            }
          }

    elementAdmin:
      enabled: true
      labels:
        ingress.home.arpa/gateway-internal: allow
      ingress:
        # Internal-only like the old synapse-admin: hoohoot.xyz is what the
        # internal gateway listeners accept.
        host: "admin.hoohoot.xyz"

    matrixRTC:
      enabled: true
      # These land on the lk-jwt authorisation-service pods; it calls back the
      # SFU Twirp API on LIVEKIT_URL (the public mrtc hostname), hence the
      # gateway-external egress.
      labels:
        ingress.home.arpa/gateway-external: allow
        egress.home.arpa/gateway-external: allow
      ingress:
        host: "mrtc.hoohoot.org"
      sfu:
        # SFU pods: WebSocket/Twirp via the external gateway + direct RTC media
        # from LAN/WAN through the LoadBalancer below.
        labels:
          ingress.home.arpa/gateway-external: allow
          ingress.home.arpa/world: allow
          ingress.home.arpa/prometheus: allow
        exposedServices:
          rtcTcp:
            portType: LoadBalancer
            annotations:
              lbipam.cilium.io/ips: "192.168.1.45"
              lbipam.cilium.io/sharing-key: matrix-rtc
          rtcMuxedUdp:
            portType: LoadBalancer
            annotations:
              lbipam.cilium.io/ips: "192.168.1.45"
              lbipam.cilium.io/sharing-key: matrix-rtc
