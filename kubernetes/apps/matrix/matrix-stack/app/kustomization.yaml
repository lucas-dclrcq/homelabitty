---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./authentikapplication.yaml
  - ./oidc-externalsecret.yaml
  - ./externalsecret.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml
  - ./prometheusrule.yaml
  - ./grafanadashboard.yaml
  - ./probes.yaml
configMapGenerator:
  - name: mas-additional-config
    files:
      - upstream-oauth2.yaml=./resources/mas-upstream-oauth2.yaml
generatorOptions:
  disableNameSuffixHash: true
