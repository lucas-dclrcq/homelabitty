---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml
  - ./dnsendpoint.yaml
  - ./prometheusrule.yaml
  - ./grafanadashboard.yaml
  - ./probes.yaml
configMapGenerator:
  - name: mas-additional-config
    files:
      - upstream-oauth2.yaml=./resources/mas-upstream-oauth2.yaml
  - name: hookshot-registration-config
    files:
      - registration.yaml=./resources/hookshot-registration.yaml
  - name: hookshot-github-config
    files:
      - github.yaml=./resources/hookshot-github.yaml
generatorOptions:
  disableNameSuffixHash: true
