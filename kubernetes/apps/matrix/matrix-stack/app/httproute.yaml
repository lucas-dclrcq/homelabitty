---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-synapse
spec:
  hostnames:
    - "matrix.hoohoot.org"
  parentRefs:
    - name: external
      namespace: network
  rules:
    # Auth endpoints are handled by MAS (same delegation the ESS chart wires
    # into its own Ingress).
    - matches:
        - path:
            type: RegularExpression
            value: "^/_matrix/client/.*/(login|logout|refresh)(/.*)?$"
      backendRefs:
        - name: matrix-matrix-authentication-service
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /_matrix
        - path:
            type: PathPrefix
            value: /_synapse
      backendRefs:
        - name: matrix-synapse
          port: 8008
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-well-known
spec:
  hostnames:
    - "hoohoot.org"
  parentRefs:
    - name: external
      namespace: network
  rules:
    # Only /.well-known/ goes to haproxy: homelab-manager owns the rest of the
    # base domain with a PathPrefix / route, and a second / route here would
    # lose the Gateway API tie-break and shadow the well-known files.
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/
      backendRefs:
        - name: matrix-well-known
          port: 8010
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-mas
spec:
  hostnames:
    - "mas.hoohoot.org"
  parentRefs:
    - name: external
      namespace: network
  rules:
    - backendRefs:
        - name: matrix-matrix-authentication-service
          port: 8080
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-element-web
spec:
  hostnames:
    - "element.hoohoot.org"
  parentRefs:
    - name: external
      namespace: network
  rules:
    - backendRefs:
        - name: matrix-element-web
          port: 80
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - name: "X-Frame-Options"
                value: "SAMEORIGIN"
              - name: "X-Content-Type-Options"
                value: "nosniff"
              - name: "X-XSS-Protection"
                value: "1; mode=block"
              - name: "Content-Security-Policy"
                value: "frame-ancestors 'none'"
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-element-admin
spec:
  hostnames:
    - "admin.hoohoot.xyz"
  parentRefs:
    - name: internal
      namespace: network
  rules:
    - backendRefs:
        - name: matrix-element-admin
          port: 8080
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-rtc
spec:
  hostnames:
    - "mrtc.hoohoot.org"
  parentRefs:
    - name: external
      namespace: network
  rules:
    - backendRefs:
        - name: matrix-matrix-rtc-authorisation-service
          port: 8080
