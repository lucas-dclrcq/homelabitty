---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-synapse
  annotations:
    external-dns.alpha.kubernetes.io/target: "${HOME_IP}"
spec:
  hostnames:
    - "matrix.${SECRET_DOMAIN}"
  parentRefs:
    - name: external
      namespace: network
  rules:
    # Auth endpoints are handled by MAS (same delegation the ESS chart wires
    # into its own Ingress).
    - matches:
        - path:
            type: RegularExpression
            value: "^/_matrix/client/.*/(login|logout|refresh)(/.*)?$"
      backendRefs:
        - name: matrix-matrix-authentication-service
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /_matrix
        - path:
            type: PathPrefix
            value: /_synapse
      backendRefs:
        - name: matrix-synapse
          port: 8008
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-well-known
  annotations:
    external-dns.alpha.kubernetes.io/target: "${HOME_IP}"
spec:
  hostnames:
    - "${SECRET_DOMAIN}"
  parentRefs:
    - name: external
      namespace: network
  rules:
    # Only /.well-known/ goes to haproxy: homelab-manager owns the rest of the
    # base domain with a PathPrefix / route, and a second / route here would
    # lose the Gateway API tie-break and shadow the well-known files.
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/
      backendRefs:
        - name: matrix-well-known
          port: 8010
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-mas
  annotations:
    external-dns.alpha.kubernetes.io/target: "${HOME_IP}"
spec:
  hostnames:
    - "mas.${SECRET_DOMAIN}"
  parentRefs:
    - name: external
      namespace: network
  rules:
    - backendRefs:
        - name: matrix-matrix-authentication-service
          port: 8080
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-element-web
  annotations:
    external-dns.alpha.kubernetes.io/target: "${HOME_IP}"
spec:
  hostnames:
    - "element.${SECRET_DOMAIN}"
  parentRefs:
    - name: external
      namespace: network
  rules:
    - backendRefs:
        - name: matrix-element-web
          port: 80
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - name: "X-Frame-Options"
                value: "SAMEORIGIN"
              - name: "X-Content-Type-Options"
                value: "nosniff"
              - name: "X-XSS-Protection"
                value: "1; mode=block"
              - name: "Content-Security-Policy"
                value: "frame-ancestors 'none'"
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-element-admin
  annotations:
    external-dns.alpha.kubernetes.io/target: "${HOME_IP}"
spec:
  hostnames:
    - "admin.${SECRET_DOMAIN}"
  parentRefs:
    - name: external
      namespace: network
  rules:
    - backendRefs:
        - name: matrix-element-admin
          port: 8080
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-rtc
  annotations:
    external-dns.alpha.kubernetes.io/target: "${HOME_IP}"
spec:
  hostnames:
    - "mrtc.${SECRET_DOMAIN}"
  parentRefs:
    - name: external
      namespace: network
  rules:
    - backendRefs:
        - name: matrix-matrix-rtc-authorisation-service
          port: 8080
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-hookshot
  annotations:
    external-dns.alpha.kubernetes.io/target: "${HOME_IP}"
spec:
  hostnames:
    - "matrix-hookshot.${SECRET_DOMAIN}"
  parentRefs:
    - name: external
      namespace: network
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /widgetapi/v1
      backendRefs:
        - name: matrix-hookshot
          port: 7778
    # Webhooks moved from port 9000 (bjw-s deployment) to the chart-owned 7775;
    # the public URL is unchanged.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: matrix-hookshot
          port: 7775
