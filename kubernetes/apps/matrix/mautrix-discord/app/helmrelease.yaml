---
# yaml-language-server: $schema=https://kubernetes-schemas.devbu.io/helm.toolkit.fluxcd.io/helmrelease_v2beta1.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mautrix-discord
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    rawResources:
      netpol:
        manifest:
          apiVersion: cilium.io/v2
          kind: CiliumNetworkPolicy
          spec:
            description: "Appservice bridge: Synapse pushes transactions in on 29334, the bridge calls the client-server API back through matrix-synapse.matrix.svc:8008 (HAProxy)"
            endpointSelector:
              matchLabels:
                app.kubernetes.io/name: mautrix-discord
            ingress:
              - fromEndpoints:
                  - matchLabels:
                      app.kubernetes.io/part-of: matrix-stack
                      app.kubernetes.io/component: matrix-server
                toPorts:
                  - ports:
                      - port: "29334"
                        protocol: TCP
            egress:
              - toEndpoints:
                  - matchLabels:
                      app.kubernetes.io/part-of: matrix-stack
                      app.kubernetes.io/component: matrix-stack-ingress
                toPorts:
                  - ports:
                      - port: "8008"
                        protocol: TCP

    defaultPodOptions:
      annotations:
        fluentbit.io/parser: level_tsword
      labels:
        ingress.home.arpa/gateway-external: allow
        egress.home.arpa/postgres: allow
        egress.home.arpa/gateway-external: allow
        egress.home.arpa/internet-https: allow

    controllers:
      mautrix-discord:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          main:
            image:
              repository: dock.mau.dev/mautrix/discord
              tag: v0.7.7

            env:
              TZ: "Europe/Paris"

            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true

            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi

    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 29334

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.hoohoot.org"
        parentRefs:
          - name: external
            namespace: network

        rules:
          - backendRefs:
              - name: *app
                port: *port

    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /data
      config:
        type: secret
        name: mautrix-discord-secret
        globalMounts:
          - subPath: registration.yaml
            path: /data/registration.yaml
          - subPath: config.yaml
            path: /data/config.yaml
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
