---
bridge:
  # Basic homeserver configuration
  domain: hoohoot.org
  url: https://matrix.hoohoot.org
  mediaUrl: https://matrix.hoohoot.org
  port: 9993
  bindAddress: 0.0.0.0
logging:
  # Logging settings. You can have the severity debug,info,warn,error
  level: debug
  colorize: true
  json: true
  timestampFormat: HH:mm:ss:SSS
passFile:
  # The passkey used to encrypt tokens stored inside the bridge.
  # Run `openssl genpkey -out passkey.pem -outform PEM -algorithm RSA -pkeyopt rsa_keygen_bits:4096` to generate
  /data/passkey.pem
listeners:
  # HTTP Listener configuration.
  # Bind resource endpoints to ports and addresses.
  # 'port' must be specified. Each listener must listen on a unique port.
  # 'bindAddress' will default to '127.0.0.1' if not specified, may not be suited for Docker environments.
  # 'resources' may be any of webhooks, widgets, metrics
  - port: 9000
    bindAddress: 0.0.0.0
    resources:
      - webhooks
  - port: 9001
    bindAddress: 127.0.0.1
    resources:
      - metrics
  - port: 9002
    bindAddress: 0.0.0.0
    resources:
      - widgets

#cache:
#   # (Optional) Cache options for large scale deployments.
#   # To use encryption, a `redis` URI must be configured.
#   redisUri: redis://localhost:6379

#encryption:
#   # (Optional) Configuration for encryption support in the bridge.
#   # If omitted, encryption is not supported.
#   storagePath: ./cryptostore

permissions:
  "@lucasd:hoohoot.org": admin

github:
  # (Optional) Configuration for the GitHub support.
  appId: {{ .GITHUB_APP_ID }}
  privateKeyFile: /data/github-key.pem
  webhook:
    # Webhook settings for the GitHub app.
    secret: {{ .GITHUB_WEBHOOK_SECRET }}
  oauth:
    # (Optional) Settings for allowing users to sign in via OAuth.
    client_id: {{ .GITHUB_OAUTH_CLIENT_ID }}
    client_secret: {{ .GITHUB_OAUTH_CLIENT_SECRET }}
    redirect_uri: https://matrix-hookshot.hoohoot.org/oauth/
  defaultOptions:
    # (Optional) Default options for GitHub connections.
    showIssueRoomLink: false
  hotlinkIssues:
    prefix: "#"
  userIdPrefix:
    # (Optional) Prefix used when creating ghost users for GitHub accounts.
    _github_

