---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/tuppr.home-operations.com/kubernetesupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: KubernetesUpgrade
metadata:
  name: kubernetes
spec:
  kubernetes:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
    version: v1.36.5
  healthChecks:
    # No kopiur backup in flight (Snapshot only: standing populator Restores
    # sit Reconciling=True by design and would block forever).
    # Gate on phase, not conditions: discovered snapshots carry a status with
    # no conditions key at all, so a status.conditions.* expression throws
    # "no such key: conditions" and the gate can never pass.
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Snapshot
      expr: |-
        !has(status.phase) || !(status.phase in ["Pending", "Running"])
      # Longest observed backup is ~10m (synapse), so 10m is too tight
      timeout: 20m
