---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/tuppr.home-operations.com/talosupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/talos
    version: v1.14.5
  policy:
    rebootMode: powercycle
    waitForVolumeDetach: true
  healthChecks:
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Snapshot
      expr: |-
        !has(status.phase) || !(status.phase in ["Pending", "Running"])
      timeout: 20m
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      name: rook-ceph
      namespace: rook-ceph
      expr: |-
        status.ceph.health in ["HEALTH_OK", "HEALTH_WARN"]
      timeout: 10m
  maintenance:
    windows:
      - start: "0 2 * * *" # Every day 02:00
        duration: "4h"
        timezone: "Europe/Paris"
