---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/tuppr.home-operations.com/talosupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/installer
    version: v1.13.2
  policy:
    rebootMode: powercycle
  healthChecks:
    # No kopiur backup in flight (Snapshot only: standing populator Restores
    # sit Reconciling=True by design and would block forever)
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Snapshot
      expr: |-
        status.conditions.filter(c, c.type == "Reconciling").all(c, c.status == "False")
    # volsync gate: kept while bichon (suspended ks) still backs up via volsync
    - apiVersion: volsync.backube/v1alpha1
      kind: ReplicationSource
      expr: |-
        status.conditions.filter(c, c.type == "Synchronizing").all(c, c.status == "False")
