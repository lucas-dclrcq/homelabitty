---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/tuppr.home-operations.com/talosupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/talos
    version: v1.14.4
  policy:
    rebootMode: powercycle
    # Wait for Ceph RBD volumes to detach before the reboot, otherwise a
    # fast reboot orphans the mount and the pod hits Multi-Attach on
    # reschedule
    waitForVolumeDetach: true
  healthChecks:
    # No kopiur backup in flight (Snapshot only: standing populator Restores
    # sit Reconciling=True by design and would block forever).
    # Gate on phase, not conditions: discovered snapshots carry a status with
    # no conditions key at all, so a status.conditions.* expression throws
    # "no such key: conditions" and the gate can never pass.
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Snapshot
      expr: |-
        !has(status.phase) || !(status.phase in ["Pending", "Running"])
      # Longest observed backup is ~10m (synapse), so 10m is too tight
      timeout: 20m
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      name: rook-ceph
      namespace: rook-ceph
      expr: |-
        status.ceph.health in ["HEALTH_OK", "HEALTH_WARN"]
      timeout: 10m
