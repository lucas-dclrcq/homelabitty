---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ocharted
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    replicaCount: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    auth:
      existingSecret: ocharted-secret
      bypassNetworks:
        - 10.69.0.0/16
        - 10.96.0.0/16
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    httpRoute:
      enabled: true
      hostnames:
        - "ocharted.${SECRET_DOMAIN}"
      parentRefs:
        - name: external
          namespace: network
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 512Mi
    monitoring:
      serviceMonitor:
        enabled: true
