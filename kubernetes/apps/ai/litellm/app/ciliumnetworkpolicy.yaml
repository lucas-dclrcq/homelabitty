---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: litellm
spec:
  description: "LiteLLM proxy: MCP servers + headroom guardrail in-namespace, OTEL traces and the two URL-mode MCPs cross-namespace"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: litellm
  ingress:
    # robusta runner/holmes and hermes use LiteLLM as their LLM gateway, the operator
    # applies the proxy config through the LiteLLM API (applyMode: api)
    - fromEndpoints:
        - matchLabels:
            app: robusta-runner
        - matchLabels:
            app: holmes
        - matchLabels:
            app.kubernetes.io/name: litellm-operator
        - matchLabels:
            app.kubernetes.io/name: hermes
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
  egress:
    # in-namespace MCP servers (github 8082, grafana 8000, kubesearch/unifi 3000,
    # kubernetes-mcp/truenas/vault 8080)
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/component: mcp-server
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
            - port: "8000"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "8082"
              protocol: TCP
    # headroom guardrail (headroomguardrail.yaml)
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: headroom
      toPorts:
        - ports:
            - port: "8787"
              protocol: TCP
    # OTEL traces -> victoria-traces
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vtsingle
            io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "10428"
              protocol: TCP
    # URL-mode MCP servers (mcps/homeassistant.yaml, mcps/konflate.yaml)
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: home-assistant
            io.kubernetes.pod.namespace: home
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: konflate
            io.kubernetes.pod.namespace: flux-system
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: litellm-mcp-servers
spec:
  description: "Sidecar-style MCP servers only ever answer the LiteLLM proxy"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: mcp-server
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: litellm
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
            - port: "8000"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "8082"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-mcp
spec:
  description: "grafana-mcp queries the Grafana HTTP API (GRAFANA_URL in mcps/grafana.yaml)"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana-mcp
  egress:
    - toEndpoints:
        - matchLabels:
            app: grafana
            io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
