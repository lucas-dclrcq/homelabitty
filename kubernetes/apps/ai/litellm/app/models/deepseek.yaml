---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: deepseek-flash
spec:
  proxyRef: litellm
  modelName: deepseek-flash
  params:
    model: deepseek/deepseek-v4-flash
    apiKeyRef:
      name: litellm-secret
      key: DEEPSEEK_API_KEY
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: deepseek-v4-pro
spec:
  proxyRef: litellm
  modelName: deepseek-v4-pro
  params:
    model: deepseek/deepseek-v4-pro
    apiKeyRef:
      name: litellm-secret
      key: DEEPSEEK_API_KEY
