---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: hashicorp-vault
  target:
    name: litellm-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        LITELLM_MASTER_KEY: "{{ .LITELLM_MASTER_KEY }}"
        LITELLM_SALT_KEY: "{{ .LITELLM_SALT_KEY }}"
        DEEPSEEK_API_KEY: "{{ .DEEPSEEK_API_KEY }}"
        MISTRAL_API_KEY: "{{ .MISTRAL_API_KEY }}"
        GITHUB_TOKEN: "{{ .GITHUB_TOKEN }}"
        TRUENAS_API_KEY: "{{ .TRUENAS_API_KEY }}"
        HOME_ASSISTANT_TOKEN: "{{ .HOME_ASSISTANT_TOKEN }}"
        GRAFANA_SERVICE_ACCOUNT_TOKEN: "{{ .grafana_token }}"
        VAULT_MCP_TOKEN: "{{ .vault_VAULT_TOKEN }}"
        UNIFI_HOST: "{{ .unifi_UNIFI_HOST }}"
        UNIFI_USERNAME: "{{ .unifi_UNIFI_USERNAME }}"
        UNIFI_PASSWORD: "{{ .unifi_UNIFI_PASSWORD }}"
        # SSO (Authentik)
        GENERIC_CLIENT_ID: "{{ .OIDC_CLIENT_ID }}"
        GENERIC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: ai/litellm
    - extract:
        key: ai/grafana-mcp
      rewrite:
        - regexp:
            source: "(.*)"
            target: "grafana_$1"
    - extract:
        key: ai/vault-mcp-server
      rewrite:
        - regexp:
            source: "(.*)"
            target: "vault_$1"
    - extract:
        key: ai/unifi-network-mcp
      rewrite:
        - regexp:
            source: "(.*)"
            target: "unifi_$1"
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-pg
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: crunchy-pgo-secrets
  target:
    name: litellm-pg
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Direct primary URI: pgbouncer runs in transaction mode, which breaks Prisma
        DATABASE_URL: "{{ .pg_uri }}"
  dataFrom:
    - extract:
        key: postgres-16-pguser-litellm
      rewrite:
        - regexp:
            source: "(.*)"
            target: "pg_$1"
