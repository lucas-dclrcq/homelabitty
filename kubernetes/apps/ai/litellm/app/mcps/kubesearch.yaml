---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: kubesearch-mcp
spec:
  proxyRef: litellm
  proxyNamespace: ai
  alias: kubesearch
  transport: http
  workload:
    image: ghcr.io/perfectra1n/kubesearch-mcp:1.3.0
    port: 3000
    path: /mcp
    automountServiceAccountToken: false
    podLabels:
      egress.home.arpa/internet-https: allow
    # The server caches the kubesearch database as /data/repos-<date>.db (written via a .tmp-N
    # file, then renamed). The rootfs is read-only, so /data needs a writable volume. It is only a
    # cache, re-downloaded when the pod restarts. /tmp for the same reason.
    volumes:
      - name: data
        emptyDir:
          sizeLimit: 2Gi
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: data
        mountPath: /data
      - name: tmp
        mountPath: /tmp
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 1Gi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: { drop: ["ALL"] }
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile: { type: RuntimeDefault }
