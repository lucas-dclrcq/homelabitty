---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: kubesearch-mcp
spec:
  proxyRef: litellm
  proxyNamespace: ai
  alias: kubesearch
  transport: http
  workload:
    image: ghcr.io/perfectra1n/kubesearch-mcp:1.1.0
    port: 3000
    path: /mcp
    automountServiceAccountToken: false
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 1Gi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: {drop: ["ALL"]}
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile: {type: RuntimeDefault}
