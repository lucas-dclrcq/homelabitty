---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubernetes-mcp-config
data:
  config.toml: |-
    log_level = 1
    port = "8080"
    bind_address = "0.0.0.0"
    stateless = true
    read_only = true
    toolsets = ["core"]

    [[denied_resources]]
    group = ""
    version = "v1"
    kind = "Secret"

    [[denied_resources]]
    group = ""
    version = "v1"
    kind = "ServiceAccount"

    [[denied_resources]]
    group = "rbac.authorization.k8s.io"
    version = "v1"
    kind = "Role"

    [[denied_resources]]
    group = "rbac.authorization.k8s.io"
    version = "v1"
    kind = "RoleBinding"

    [[denied_resources]]
    group = "rbac.authorization.k8s.io"
    version = "v1"
    kind = "ClusterRole"

    [[denied_resources]]
    group = "rbac.authorization.k8s.io"
    version = "v1"
    kind = "ClusterRoleBinding"
