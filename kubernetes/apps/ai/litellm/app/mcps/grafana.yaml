---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: grafana-mcp
spec:
  proxyRef: litellm
  proxyNamespace: ai
  alias: grafana
  transport: http
  workload:
    image: grafana/mcp-grafana:2.1.1
    args:
      - --transport=streamable-http
      - --allowed-hosts=localhost:8000,127.0.0.1:8000,grafana-mcp.ai.svc.cluster.local:8000,grafana-mcp.ai:8000,grafana-mcp:8000
    port: 8000
    path: /mcp
    automountServiceAccountToken: false
    podLabels:
      egress.home.arpa/kubedns: allow
      # egress to the Grafana API: ../ciliumnetworkpolicy.yaml
    env:
      - name: GRAFANA_URL
        value: http://grafana-service.observability.svc.cluster.local:3000
      - name: GRAFANA_ORG_ID
        value: "1"
      - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
        valueFrom:
          secretKeyRef:
            name: litellm-secret
            key: GRAFANA_SERVICE_ACCOUNT_TOKEN
    volumes:
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: tmp
        mountPath: /tmp
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: { drop: ["ALL"] }
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile: { type: RuntimeDefault }
