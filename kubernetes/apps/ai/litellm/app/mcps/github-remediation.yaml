---
# Restricted view of the GitHub MCP server for the robusta-holmes remediation agent:
# read the repository and open pull requests only. No merge, issue, comment, gist,
# fork or repository tools, so an alert carrying a prompt injection cannot use GitHub
# to publish cluster data outside a reviewable pull request.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: github-remediation-mcp
spec:
  proxyRef: litellm
  proxyNamespace: ai
  alias: github-remediation
  transport: http
  url: http://github-mcp.ai.svc.cluster.local:8082/mcp
  authType: bearer_token
  authTokenRef:
    name: litellm-secret
    key: GITHUB_TOKEN
  params:
    allowed_tools:
      - get_file_contents
      - search_code
      - list_branches
      - list_commits
      - get_commit
      - list_pull_requests
      - search_pull_requests
      - pull_request_read
      - create_branch
      - create_or_update_file
      - push_files
      - create_pull_request
