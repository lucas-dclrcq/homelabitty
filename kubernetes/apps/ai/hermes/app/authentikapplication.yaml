---
apiVersion: authentik.starry.blue/v1alpha1
kind: AuthentikApplication
metadata:
  name: hermes
spec:
  slug: hermes
  name: Hermes
  launchURL: https://hermes.hoohoot.xyz/
  adopt: IfMatch
  provider:
    flows:
      authorization:
        slug: default-provider-authorization-implicit-consent
      invalidation:
        slug: default-provider-invalidation-flow
    oauth2:
      clientType: Confidential
      redirectURIs:
        - url: "https://hermes.hoohoot.xyz/api/auth/oidc/callback"
          matchingMode: Strict
          type: Authorization
      scopes:
        - scopeName: openid
        - scopeName: email
        - scopeName: profile
      grantTypes:
        - AuthorizationCode
        - RefreshToken
      subjectMode: HashedUserID
      issuerMode: PerProvider
      includeClaimsInIDToken: true
      credentials:
        secretRef:
          name: hermes-oidc
  access:
    rules:
      - group:
          name: Hoohoot Admins
