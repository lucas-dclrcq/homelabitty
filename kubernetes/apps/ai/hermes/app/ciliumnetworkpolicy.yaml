---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes
spec:
  description: "Hermes agent: LiteLLM + SearXNG in-namespace, an allowlist of package/code hosts for its shell"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hermes
  ingress:
    - fromEndpoints:
        - matchLabels:
            gateway.envoyproxy.io/owning-gateway-name: internal
            io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            - port: "8787"
              protocol: TCP
  egress:
    # LiteLLM proxy (models + MCP servers)
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: litellm
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
    # In-cluster web search
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: searxng
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Authentik through the public WAN address (hostAliases in helmrelease.yaml)
    - toCIDR:
        - 82.66.210.4/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Allowlisted hosts for tool installs (mise, pip, uv) and code browsing
    - toFQDNs:
        - matchPattern: "*.github.com"
        - matchPattern: "*.github.io"
        - matchPattern: "*.githubusercontent.com"
        - matchPattern: "*.home-operations.com"
        - matchName: files.pythonhosted.org
        - matchName: ghcr.io
        - matchName: github.com
        - matchName: hermes-agent.nousresearch.com
        - matchName: mise.jdx.dev
        - matchName: mise-versions.jdx.dev
        - matchName: mirror.gcr.io
        - matchName: pypi.org
        - matchName: quay.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
