---
_config_version: 46

providers:
  litellm:
    name: LiteLLM
    api: http://litellm.ai.svc.cluster.local:4000/v1
    key_env: LITELLM_API_KEY
    transport: chat_completions
    discover_models: true

model:
  default: deepseek-v4-pro
  provider: litellm

web:
  search_backend: searxng

secrets:
  command:
    enabled: true
    command: |
      printf 'LITELLM_API_KEY=%s\n' "$LITELLM_API_KEY"
    helper_timeout_seconds: 3
    override_existing: true

security:
  redact_secrets: true

terminal:
  backend: local
  cwd: /opt/data/workspace
  persistent_shell: true
  timeout: 180

timezone: Europe/Paris

privacy:
  redact_pii: true

approvals:
  mode: smart

# MCP servers proxied by the LiteLLM gateway; access is granted through the hermes LiteLLM team
mcp_servers:
  github:
    url: http://litellm.ai.svc.cluster.local:4000/github/mcp
    headers: &litellm
      x-litellm-api-key: "Bearer ${LITELLM_API_KEY}"
  grafana:
    url: http://litellm.ai.svc.cluster.local:4000/grafana/mcp
    headers: *litellm
  homeassistant:
    url: http://litellm.ai.svc.cluster.local:4000/homeassistant/mcp
    headers: *litellm
  kubernetes:
    url: http://litellm.ai.svc.cluster.local:4000/kubernetes/mcp
    headers: *litellm
  kubesearch:
    url: http://litellm.ai.svc.cluster.local:4000/kubesearch/mcp
    headers: *litellm
  trilium:
    url: http://litellm.ai.svc.cluster.local:4000/trilium/mcp
    headers: *litellm
  truenas:
    url: http://litellm.ai.svc.cluster.local:4000/truenas/mcp
    headers: *litellm
  unifi:
    url: http://litellm.ai.svc.cluster.local:4000/unifi/mcp
    headers: *litellm
  vault:
    url: http://litellm.ai.svc.cluster.local:4000/vault/mcp
    headers: *litellm

toolsets:
  - hermes-cli
  - kanban

agent:
  max_turns: 60
  gateway_timeout: 1800
  restart_drain_timeout: 60
  api_max_retries: 2
  reasoning_effort: medium
  disabled_toolsets:
    - a2a
    - browser
    - computer_use
    - desktop_ui
    - feishu_doc
    - feishu_drive
    - homeassistant
    - image_gen
    - spotify
    - video
    - video_gen
    - x_search
    - yuanbao

platform_toolsets:
  cli:
    - clarify
    - code_execution
    - connections
    - context_engine
    - cronjob
    - delegation
    - file
    - kanban
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web

telemetry:
  shared_metrics:
    enabled: false

gateway:
  multiplex_profiles: true

streaming:
  enabled: true
