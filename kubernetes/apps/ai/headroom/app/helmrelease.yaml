# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app headroom
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    global:
      createDefaultServiceAccount: false

    rawResources:
      netpol:
        manifest:
          apiVersion: cilium.io/v2
          kind: CiliumNetworkPolicy
          spec:
            description: "headroom is only called by the LiteLLM proxy (headroomguardrail.yaml)"
            endpointSelector:
              matchLabels:
                app.kubernetes.io/name: headroom
            ingress:
              - fromEndpoints:
                  - matchLabels:
                      app.kubernetes.io/name: litellm
                toPorts:
                  - ports:
                      - port: "8787"
                        protocol: TCP

    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    controllers:
      headroom:
        replicas: 2
        strategy: RollingUpdate
        pod:
          labels:
            egress.home.arpa/kubedns: allow
            egress.home.arpa/internet-https: allow
        containers:
          main:
            image:
              repository: ghcr.io/headroomlabs-ai/headroom
              tag: 0.42.0-slim-nonroot@sha256:bc9f542aebcbfe8dafa695ba8e3cf12ce32208281721bd099f5f52bad0b19a8c
            env:
              HEADROOM_COMPRESS_ALLOW_REMOTE: "1"
              HEADROOM_HOST: 0.0.0.0
              HEADROOM_ALLOW_UNAUTHENTICATED_BIND: "1"
              HEADROOM_MODE: cache
              HEADROOM_PORT: &port 8787
              HEADROOM_TELEMETRY: "off"
              HEADROOM_WORKSPACE_DIR: /data/headroom
              HF_HOME: /data/huggingface
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        controller: headroom
        ports:
          http:
            port: *port

    persistence:
      data:
        type: emptyDir
        globalMounts:
          - path: /data
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
