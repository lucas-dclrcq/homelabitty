---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app robusta
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    clusterName: hoohoot

    globalConfig:
      prometheus_url: http://vmsingle-vmks.observability.svc.cluster.local:8428
      alertmanager_url: http://vmalertmanager-vmks.observability.svc.cluster.local:9093
      check_prometheus_flags: false
      alert_generator_link: false

    sinksConfig:
      - pushover_sink:
          name: pushover
          token: "{{ env.PUSHOVER_TOKEN }}"
          user: "{{ env.PUSHOVER_USER_KEY }}"
          send_files: false
          scope:
            include:
              - identifier: HolmesRemediation

    playbookRepos:
      holmes_remediation:
        url: file:///etc/robusta/custom/holmes_remediation
        pip_install: false

    customPlaybooks:
      - name: holmes-remediation
        triggers:
          - on_prometheus_alert:
              status: firing
        actions:
          - holmes_remediate:
              severities: ["critical", "error"]
              repository: lucas-dclrcq/homelabitty
              base_branch: main
              model: deepseek-flash
              rate_limit_seconds: 21600

    enablePrometheusStack: false
    enablePlatformPlaybooks: false
    enableServiceMonitors: true

    kubewatch:
      labels:
        egress.home.arpa/apiserver: allow
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi

    runner:
      labels:
        ingress.home.arpa/prometheus: allow
        egress.home.arpa/apiserver: allow
        egress.home.arpa/internet-https: allow
      sendAdditionalTelemetry: false
      additional_env_vars:
        - name: PYTHONPATH
          value: /etc/robusta/custom
        - name: ENABLE_TELEMETRY
          value: "false"
      additional_env_froms:
        - secretRef:
            name: robusta-secret
      extraVolumes:
        - name: holmes-remediation
          configMap:
            name: robusta-holmes-remediation
      extraVolumeMounts:
        - name: holmes-remediation
          mountPath: /etc/robusta/custom/holmes_remediation
          readOnly: true
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          memory: 2Gi

    enableHolmesGPT: true
    holmes:
      commonLabels:
        egress.home.arpa/apiserver: allow
      sentryDSN: ""
      enableTelemetry: false
      extraEnvVarsSecrets:
        - robusta-holmes-litellm
      customClusterRoleRules:
        - apiGroups:
            - operator.victoriametrics.com
          resources:
            - vmrules
            - vmalerts
            - vmalertmanagerconfigs
          verbs:
            - get
            - list
            - watch

      modelList:
        deepseek-flash:
          model: openai/deepseek-flash
          api_base: http://litellm.ai.svc.cluster.local:4000
          api_key: envRef:LITELLM_API_KEY

      toolsets:
        kubernetes/core:
          enabled: true
        kubernetes/logs:
          enabled: true
        robusta:
          enabled: false
        internet:
          enabled: false
        prometheus/metrics:
          enabled: true
          subtype: victoriametrics
          config:
            prometheus_url: http://vmsingle-vmks.observability.svc.cluster.local:8428

      mcp_servers:
        github:
          description: GitHub (read the repository, open pull requests), proxied through the LiteLLM MCP gateway
          config:
            url: http://litellm.ai.svc.cluster.local:4000/github-remediation/mcp
            mode: streamable-http
            headers:
              x-litellm-api-key: "Bearer {{ env.LITELLM_API_KEY }}"
          llm_instructions: >-
            Use GitHub to read the GitOps manifests of the cluster (repository lucas-dclrcq/homelabitty)
            and to open remediation pull requests. The repository is PUBLIC: never write secrets,
            credentials, tokens or personal data in a branch, commit or pull request.
            Never merge pull requests or push to the main branch.
        kubesearch:
          description: kubesearch.dev, search how other homelab clusters configure Helm charts
          config:
            url: http://litellm.ai.svc.cluster.local:4000/kubesearch/mcp
            mode: streamable-http
            headers:
              x-litellm-api-key: "Bearer {{ env.LITELLM_API_KEY }}"
          llm_instructions: >-
            Use kubesearch to find how other Flux homelab repositories configure a chart before proposing
            value changes.
        grafana:
          description: Grafana (read-only), VictoriaMetrics, VictoriaLogs and Tempo history, dashboards and alert rules
          config:
            url: http://litellm.ai.svc.cluster.local:4000/grafana-readonly/mcp
            mode: streamable-http
            headers:
              x-litellm-api-key: "Bearer {{ env.LITELLM_API_KEY }}"
          llm_instructions: >-
            Use Grafana to search historical logs in the VictoriaLogs datasource (pods that already restarted
            or were deleted), to read the alert rule and dashboards related to the alert, and to query
            traces. Prefer narrow queries with a namespace or pod selector and a short time range.
        konflate:
          description: konflate, rendered Kubernetes diffs of the open pull requests of the GitOps repository
          config:
            url: http://litellm.ai.svc.cluster.local:4000/konflate/mcp
            mode: streamable-http
            headers:
              x-litellm-api-key: "Bearer {{ env.LITELLM_API_KEY }}"
          llm_instructions: >-
            After opening a pull request, use konflate to check its rendered diff and caution lint and
            mention any warning in your answer. Also use it to check whether an open pull request
            (for example a Renovate update) already touches the failing workload.

      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          memory: 2Gi
