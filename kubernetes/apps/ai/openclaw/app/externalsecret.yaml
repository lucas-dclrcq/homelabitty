---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name openclaw
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: hashicorp-vault
  target:
    name: *name
    template:
      data:
        # DeepSeek is the only model provider configured; the bundled provider
        # plugin reads this variable directly.
        DEEPSEEK_API_KEY: "{{ .DEEPSEEK_API_KEY }}"
        # Gateway/Control-UI auth, also reused as the code-server password.
        OPENCLAW_GATEWAY_TOKEN: "{{ .OPENCLAW_GATEWAY_TOKEN }}"
        # Dedicated bearer token for the /hooks/agent endpoint (alert-adapter).
        # OpenClaw flags reuse of the gateway token as a critical finding, so
        # keep this a separate random value in Vault.
        OPENCLAW_HOOKS_TOKEN: "{{ .OPENCLAW_HOOKS_TOKEN }}"
  dataFrom:
    - extract:
        key: ai/openclaw
