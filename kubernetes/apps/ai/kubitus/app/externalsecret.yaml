---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kubitus
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: hashicorp-vault
  target:
    name: kubitus-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # PostgreSQL: the PGO secret is rewritten with the `pg_` prefix below.
        QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://{{ .pg_host }}:{{ .pg_port }}/{{ .pg_dbname }}"
        QUARKUS_DATASOURCE_USERNAME: "{{ .pg_user }}"
        QUARKUS_DATASOURCE_PASSWORD: "{{ .pg_password }}"
        # Application secrets, see Vault key `ai/kubitus`.
        GITHUB_TOKEN: "{{ .GITHUB_TOKEN }}"
        KUBITUS_ALERTS_TOKEN: "{{ .KUBITUS_ALERTS_TOKEN }}"
  dataFrom:
    - extract:
        key: ai/kubitus
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: hashicorp-vault
    - extract:
        key: postgres-16-pguser-kubitus
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: crunchy-pgo-secrets
      rewrite:
        - regexp:
            source: "(.*)"
            target: "pg_$1"
