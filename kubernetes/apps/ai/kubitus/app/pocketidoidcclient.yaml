---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: kubitus
spec:
  name: Kubitus
  description: Kubitus SRE agent
  clientID: kubitus
  instanceSelector:
    matchLabels:
      app.kubernetes.io/name: pocket-id
  launchUrl: https://kubitus.hoohoot.xyz
  callbackUrls:
    - https://kubitus.hoohoot.xyz/oidc/callback
  logoutCallbackUrls:
    - https://kubitus.hoohoot.xyz/
  pkceEnabled: true
  allowedUserGroups:
    - name: admins
      namespace: security
  secret:
    name: kubitus-oidc
    keys:
      clientID: client-id
      clientSecret: client-secret
