---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app authentik
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    global:
      volumeMounts:
        - name: "hoohoot-org-production-tls"
          mountPath: /certs
          readOnly: true
      volumes:
        - name: "hoohoot-org-production-tls"
          secret:
            secretName: "hoohoot-org-production-tls"
            items:
              - key: tls.crt
                path: "hoohoot-org-production-tls.pem"
              - key: tls.key
                path: "hoohoot-org-production-tls.key"

      podAnnotations:
        reloader.stakater.com/auto: "true"

      podLabels:
        ingress.home.arpa/gateway-external: allow
        egress.home.arpa/postgres: allow
        egress.home.arpa/smtp: allow
        egress.home.arpa/gateway-external: allow
        egress.home.arpa/internet: allow

      envFrom:
        - secretRef:
            name: authentik-secret

    redis:
      enabled: false

    server:
      replicas: 2
      autoscaling:
        enabled: false

      resources:
        requests:
          cpu: 100m
          memory: 768Mi
        limits:
          memory: 1500Mi

      route:
        main:
          enabled: true
          hostnames:
            - "sso.hoohoot.org"
          parentRefs:
            - name: external
              namespace: network

    worker:
      replicas: 2
      autoscaling:
        enabled: false

      resources:
        requests:
          cpu: 200m
          memory: 384Mi
        limits:
          memory: 1Gi
