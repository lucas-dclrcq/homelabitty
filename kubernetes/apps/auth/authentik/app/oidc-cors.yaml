---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik-opencloud-oidc-discovery
spec:
  hostnames:
    - "sso.hoohoot.org"
  parentRefs:
    - name: external
      namespace: network
  rules:
    - matches:
        - path:
            type: Exact
            value: /application/o/opencloud/.well-known/openid-configuration
      backendRefs:
        - name: authentik-server
          port: 80
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: authentik-opencloud-oidc-cors
spec:
  cors:
    allowOrigins:
      - "https://drive.hoohoot.org"
    allowMethods:
      - GET
      - OPTIONS
    allowHeaders:
      - "*"
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: authentik-opencloud-oidc-discovery
