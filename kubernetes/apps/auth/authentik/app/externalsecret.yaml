---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: authentik-secret
    creationPolicy: Owner
    deletionPolicy: "Delete"
    template:
      engineVersion: v2
      data:
        AUTHENTIK_SECRET_KEY: "{{ .authentik_SECRET_KEY }}"
        AUTHENTIK_EMAIL__HOST: "smtp-relay.infrastructure.svc.cluster.local"
        AUTHENTIK_EMAIL__PORT: "2525"
        AUTHENTIK_EMAIL__USE_TLS: "false"
        AUTHENTIK_EMAIL__USE_SSL: "false"
        AUTHENTIK_EMAIL__FROM: "sso@hoohoot.org"
        AUTHENTIK_POSTGRESQL__HOST: '{{ index . "pg_host" }}'
        AUTHENTIK_POSTGRESQL__PORT: '{{ index . "pg_port" }}'
        AUTHENTIK_POSTGRESQL__NAME: '{{ index . "pg_dbname" }}'
        AUTHENTIK_POSTGRESQL__USE_PGBOUNCER: "false"
        AUTHENTIK_POSTGRESQL__PASSWORD: '{{ index . "pg_password" }}'
        AUTHENTIK_POSTGRESQL__USER: '{{ index . "pg_user" }}'
  dataFrom:
    - extract:
        key: auth/authentik
      rewrite:
        - regexp:
            source: "(.*)"
            target: "authentik_$1"
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: hashicorp-vault
    - extract:
        key: postgres-16-pguser-sso
      rewrite:
        - regexp:
            source: "(.*)"
            target: "pg_$1"
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: crunchy-pgo-secrets
