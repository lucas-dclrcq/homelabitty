---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app pocket-id-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    operator:
      labels:
        # apiserver: controller-runtime. internet-https: the operator fills in
        # a logo URL per OIDC client from the dashboard-icons CDN and probes it
        # to report status.logoReachable. prometheus: the ServiceMonitor below.
        # The hop to pocket-id itself is same-namespace, so it needs a rule of
        # its own: ../../pocket-id/app/ciliumnetworkpolicy.yaml.
        ingress.home.arpa/prometheus: allow
        egress.home.arpa/apiserver: allow
        egress.home.arpa/internet-https: allow

    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

    # The instance, its users and its OIDC clients are plain custom resources
    # shipped by ../../pocket-id and apps/default/echo-server, so the chart
    # renders none of them. Left at the chart default this block emits a
    # PocketIDInstance with an empty spec, which the CRD rejects.
    instance:
      enabled: false
