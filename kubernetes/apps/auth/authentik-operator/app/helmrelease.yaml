---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app authentik-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    clusterName: hoohoot
    authentik:
      url: https://sso.hoohoot.org
      token:
        secretName: authentik-operator-token
    manager:
      pod:
        labels:
          # gateway-external: the operator reaches authentik via its public URL
          # (authentik.url above); prometheus: a ServiceMonitor scrapes the
          # manager metrics endpoint (prometheus.enabled below).
          ingress.home.arpa/prometheus: allow
          egress.home.arpa/apiserver: allow
          egress.home.arpa/gateway-external: allow
    prometheus:
      enabled: true
