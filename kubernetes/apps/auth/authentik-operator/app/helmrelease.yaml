---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app authentik-operator
spec:
  interval: 1h
  chart:
    spec:
      # renovate: registryUrl=https://slashnephy.github.io/authentik-operator
      chart: authentik-operator
      version: 2026.8.1
      sourceRef:
        kind: HelmRepository
        name: authentik-operator
      interval: 1h
  values:
    clusterName: hoohoot
    authentik:
      url: https://sso.${SECRET_DOMAIN}
      token:
        secretName: authentik-operator-token
    prometheus:
      enabled: true
