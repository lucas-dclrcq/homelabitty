---
apiVersion: authentik.starry.blue/v1alpha1
kind: AuthentikApplication
metadata:
  name: vault-mcp
spec:
  slug: vault-mcp
  name: Vault MCP
  launchURL: https://vault.mcp.${SECRET_DOMAIN}
  provider:
    flows:
      authorization:
        slug: default-provider-authorization-implicit-consent
      invalidation:
        slug: default-provider-invalidation-flow
    oauth2:
      clientType: Public
      redirectURIs:
        - url: .*
          matchingMode: Regex
          type: Authorization
      scopes:
        - scopeName: openid
        - scopeName: email
        - scopeName: profile
      grantTypes:
        - AuthorizationCode
        - RefreshToken
      includeClaimsInIDToken: true
      credentials:
        clientID: vault-mcp
        secretRef:
          name: vault-mcp-oidc
  access:
    rules:
      - group:
          name: Hoohoot Admins
