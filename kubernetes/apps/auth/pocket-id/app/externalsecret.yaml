---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: hashicorp-vault
  target:
    name: pocket-id-secret
    creationPolicy: Owner
    deletionPolicy: "Delete"
    template:
      engineVersion: v2
      data:
        encryption-key: '{{ index . "pocket-id_encryption_key" }}'
        database-url: '{{ index . "pg_uri" }}'
  dataFrom:
    - extract:
        key: auth/pocket-id
      rewrite:
        - regexp:
            source: "(.*)"
            target: "pocket-id_$1"
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: hashicorp-vault
    - extract:
        key: postgres-16-pguser-pocketid
      rewrite:
        - regexp:
            source: "(.*)"
            target: "pg_$1"
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: crunchy-pgo-secrets
