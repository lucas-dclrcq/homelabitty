---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDInstance
metadata:
  name: pocket-id
spec:
  appUrl: https://id.hoohoot.org

  encryptionKey:
    valueFrom:
      secretKeyRef:
        name: pocket-id-secret
        key: encryption-key

  databaseUrl:
    valueFrom:
      secretKeyRef:
        name: pocket-id-secret
        key: database-url
  fileBackend: database

  annotations:
    reloader.stakater.com/auto: "true"

  labels:
    ingress.home.arpa/gateway-external: allow
    egress.home.arpa/postgres: allow
    egress.home.arpa/internet-https: allow
    egress.home.arpa/smtp: allow

  smtp:
    host: smtp-relay.infrastructure.svc.cluster.local
    port: 2525
    from: id@hoohoot.org
    tls: none

  emailNotifications:
    oneTimeAccessAsAdmin: true
    oneTimeAccessAsUnauthenticated: false

  route:
    enabled: true
    hostnames:
      - id.hoohoot.org
    parentRefs:
      - name: external
        namespace: network

  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 512Mi
