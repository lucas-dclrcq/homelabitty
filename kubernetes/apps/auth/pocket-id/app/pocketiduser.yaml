---
# The profile (username, names, email) comes from Vault through
# ./externalsecret.yaml; nothing identifying is in Git.
#
# A user has no credentials until a passkey is enrolled. The operator mints a
# one-time login link for that, readable with:
#   kubectl -n auth get pocketiduser lucasd -o jsonpath='{.status.oneTimeLoginURL}'
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDUser
metadata:
  name: lucasd
spec:
  admin: true
  instanceSelector:
    matchLabels:
      app.kubernetes.io/name: pocket-id
  userInfoSecretRef:
    name: pocket-id-user-lucasd
