---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sonarr-anime
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    rawResources:
      netpol:
        manifest:
          apiVersion: cilium.io/v2
          kind: CiliumNetworkPolicy
          spec:
            description: "Sonarr (anime): indexers through Prowlarr, grabs to qBittorrent/SABnzbd, driven by Bazarr/Recyclarr/Seerr/homelab-manager"
            endpointSelector:
              matchLabels:
                app.kubernetes.io/name: sonarr-anime
            ingress:
              # indexer sync from Prowlarr, subtitle/quality-profile tooling,
              # the request manager and the homelab-manager dashboard
              - fromEndpoints:
                  - matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values: ["prowlarr", "bazarr", "recyclarr"]
                  - matchLabels:
                      app.kubernetes.io/name: seerr
                      io.kubernetes.pod.namespace: media
                  - matchLabels:
                      app: homelab-manager
                      io.kubernetes.pod.namespace: default
                toPorts:
                  - ports:
                      - port: "80"
                        protocol: TCP
            egress:
              # indexer search through Prowlarr, grabs handed to the download clients
              - toEndpoints:
                  - matchLabels:
                      app.kubernetes.io/name: prowlarr
                  - matchLabels:
                      app.kubernetes.io/name: sabnzbd
                toPorts:
                  - ports:
                      - port: "80"
                        protocol: TCP
              - toEndpoints:
                  - matchLabels:
                      app.kubernetes.io/name: qbittorrent
                toPorts:
                  - ports:
                      - port: "8080"
                        protocol: TCP

    controllers:
      sonarr-anime:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sonarr
              tag: 5.0.0.2742@sha256:491f13c731083c1e3a5eb707750ad61f0052a5a6c12b37f6f524eaa35664915d
            env:
              SONARR__APP__INSTANCENAME: Sonarr Anime
              SONARR__AUTH__METHOD: External
              SONARR__AUTH__REQUIRED: DisabledForLocalAddresses
              SONARR__LOG__DBENABLED: "False"
              SONARR__LOG__LEVEL: info
              SONARR__SERVER__PORT: &port 80
              SONARR__UPDATE__BRANCH: develop
              TZ: "Europe/Paris"
              SONARR__POSTGRES__HOST: "postgres-16-pgbouncer.infrastructure.svc.cluster.local"
              SONARR__POSTGRES__PORT: "5432"
              SONARR__POSTGRES__MAINDB: "sonarranime_main"

            envFrom:
              - secretRef:
                  name: sonarr-anime-secret

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

            resources:
              requests:
                cpu: 100m
              limits:
                memory: 4Gi

    defaultPodOptions:
      labels:
        ingress.home.arpa/gateway-internal: allow
        egress.home.arpa/postgres: allow
        egress.home.arpa/world: allow
      securityContext:
        runAsNonRoot: true
        runAsUser: 1026
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 10000
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        controller: sonarr-anime
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.hoohoot.xyz"
        parentRefs:
          - name: internal
            namespace: network

        rules:
          - backendRefs:
              - name: *app
                port: *port

    persistence:
      config:
        existingClaim: sonarr-anime
      tmp:
        type: emptyDir
      scripts:
        type: configMap
        name: sonarr-anime-configmap
        defaultMode: 0775
        globalMounts:
          - path: /scripts/pushover-notify.sh
            subPath: pushover-notify.sh
            readOnly: true
          - path: /scripts/refresh-series.sh
            subPath: refresh-series.sh
            readOnly: true
      media:
        type: nfs
        server: "truenas.lulice.lan"
        path: /mnt/tank/Media
        globalMounts:
          - path: /media
