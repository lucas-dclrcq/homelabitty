---
# Paired vocabulary for egress.home.arpa/home-assistant, owned by
# home-assistant: the first policy opens the consumer's egress, the second
# opens Home Assistant's ingress from pods carrying that label. Labelling the
# API client is enough, from any namespace (bambuddy in default posts printer
# state, litellm in ai exposes the Home Assistant MCP server).
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-egress-home-assistant
spec:
  description: "Pods labeled egress.home.arpa/home-assistant=allow may reach the Home Assistant REST API on 8123"
  endpointSelector:
    matchLabels:
      egress.home.arpa/home-assistant: allow
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: home-assistant
            io.kubernetes.pod.namespace: home
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-ingress-home-assistant
spec:
  description: "Service side of egress.home.arpa/home-assistant: Home Assistant accepts 8123 from in-cluster clients carrying the label"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
      io.kubernetes.pod.namespace: home
  ingress:
    - fromEndpoints:
        - matchLabels:
            egress.home.arpa/home-assistant: allow
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
