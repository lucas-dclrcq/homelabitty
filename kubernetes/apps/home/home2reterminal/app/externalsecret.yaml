---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home2reterminal
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: hashicorp-vault
  target:
    name: home2reterminal-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # PostgreSQL: the PGO secret is rewritten with the `pg_` prefix below.
        QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://{{ .pg_host }}:{{ .pg_port }}/{{ .pg_dbname }}"
        QUARKUS_DATASOURCE_USERNAME: "{{ .pg_user }}"
        QUARKUS_DATASOURCE_PASSWORD: "{{ .pg_password }}"
        # Application secrets, see Vault key `home/home2reterminal`.
        OWM_API_KEY: "{{ .OWM_API_KEY }}"
        CALDAV_USERNAME: "{{ .CALDAV_USERNAME }}"
        CALDAV_PASSWORD: "{{ .CALDAV_PASSWORD }}"
        # Shared broker credentials, rewritten from the `X_EMQX_` prefix below.
        MQTT_USERNAME: "{{ .MQTT_USERNAME }}"
        MQTT_PASSWORD: "{{ .MQTT_PASSWORD }}"
  dataFrom:
    - extract:
        key: home/home2reterminal
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: hashicorp-vault
    - extract:
        key: infrastructure/emqx/config
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: hashicorp-vault
      rewrite:
        - regexp:
            source: "X_EMQX_MQTT_USERNAME"
            target: "MQTT_USERNAME"
        - regexp:
            source: "X_EMQX_MQTT_PASSWORD"
            target: "MQTT_PASSWORD"
    - extract:
        key: postgres-16-pguser-home2reterminal
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: crunchy-pgo-secrets
      rewrite:
        - regexp:
            source: "(.*)"
            target: "pg_$1"
