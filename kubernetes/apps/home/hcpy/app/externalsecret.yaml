---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hcpy
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: hashicorp-vault
  target:
    name: hcpy-secret
    template:
      engineVersion: v2
      templateFrom:
        - target: Data
          configMap:
            name: hcpy-base-config
            items:
              - key: devices.json
                templateAs: Values
      data:
        HCPY_MQTT_USERNAME: "{{ .X_EMQX_MQTT_USERNAME }}"
        HCPY_MQTT_PASSWORD: "{{ .X_EMQX_MQTT_PASSWORD }}"
  dataFrom:
    - extract:
        key: infrastructure/emqx/config
    - extract:
        key: home/hcpy/config
