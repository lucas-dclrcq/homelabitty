---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rmqtt
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: hashicorp-vault
  target:
    name: rmqtt-secret
    template:
      engineVersion: v2
      data:
        rmqtt-acl.toml: |
          rules = [
            ["allow", { user = "{{ .X_EMQX_MQTT_USERNAME }}", password = "{{ .X_EMQX_MQTT_PASSWORD }}" }, "all", ["#"]],
            ["deny", "all"]
          ]
  dataFrom:
    - extract:
        key: infrastructure/emqx/config
