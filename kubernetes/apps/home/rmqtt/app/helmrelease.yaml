---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app rmqtt
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    controllers:
      rmqtt:
        type: statefulset
        replicas: 3
        annotations:
          reloader.stakater.com/auto: "true"
        statefulset:
          serviceName:
            identifier: headless
        containers:
          app:
            image:
              repository: docker.hoohoot.org/homelab/rmqtt
              tag: fix-dollar-topic-levels
            command:
              - /bin/sh
              - -c
              - |
                ID=$(echo "$POD_NAME" | sed 's/.*-//')
                ID=$((ID + 1))
                exec /app/rmqtt/rmqtt-bin/rmqttd -f /etc/rmqtt/rmqtt.toml --id "$ID"
            env:
              TZ: "${TIMEZONE}"
              POD_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - "ALL"
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - *app
                topologyKey: kubernetes.io/hostname
    service:
      mqtt:
        controller: rmqtt
        primary: true
        forceRename: rmqtt
        type: LoadBalancer
        annotations:
          external-dns.kubernetes.io/hostname: "mqtt.${LIMITED_DOMAIN}"
          io.cilium/lb-ipam-ips: "${LB_IP_EMQX}"
        ports:
          mqtt:
            port: 1883
      headless:
        controller: rmqtt
        forceRename: rmqtt-headless
        type: ClusterIP
        clusterIP: None
        publishNotReadyAddresses: true
        ports:
          grpc:
            port: 5363
          raft:
            port: 6003
      http:
        controller: rmqtt
        forceRename: rmqtt-http
        ports:
          http:
            port: 6060
    serviceMonitor:
      metrics:
        service:
          identifier: http
        endpoints:
          - port: http
            scheme: http
            path: /api/v1/metrics/prometheus
            interval: 1m
            scrapeTimeout: 10s
    configMaps:
      config:
        data:
          rmqtt.toml: |-
            log.to = "console"
            log.level = "info"

            plugins.dir = "/etc/rmqtt/rmqtt-plugins"
            plugins.default_startups = [
              "rmqtt-retainer",
              "rmqtt-cluster-raft",
              "rmqtt-http-api",
            ]

            listener.tcp.external.addr = "0.0.0.0:1883"
            listener.tcp.external.allow_anonymous = false
      cluster:
        data:
          rmqtt-cluster-raft.toml: |-
            node_grpc_addrs = [
              "1@rmqtt-0.rmqtt-headless.home.svc.cluster.local:5363",
              "2@rmqtt-1.rmqtt-headless.home.svc.cluster.local:5363",
              "3@rmqtt-2.rmqtt-headless.home.svc.cluster.local:5363",
            ]
            raft_peer_addrs = [
              "1@rmqtt-0.rmqtt-headless.home.svc.cluster.local:6003",
              "2@rmqtt-1.rmqtt-headless.home.svc.cluster.local:6003",
              "3@rmqtt-2.rmqtt-headless.home.svc.cluster.local:6003",
            ]
            laddr = "0.0.0.0:6003"
    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /etc/rmqtt/rmqtt.toml
            subPath: rmqtt.toml
      cluster:
        type: configMap
        identifier: cluster
        globalMounts:
          - path: /etc/rmqtt/rmqtt-plugins/rmqtt-cluster-raft.toml
            subPath: rmqtt-cluster-raft.toml
      acl:
        type: secret
        name: rmqtt-secret
        globalMounts:
          - path: /etc/rmqtt/rmqtt-plugins/rmqtt-acl.toml
            subPath: rmqtt-acl.toml
      logs:
        type: emptyDir
        globalMounts:
          - path: /var/log/rmqtt
