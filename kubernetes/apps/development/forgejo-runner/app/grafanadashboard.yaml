---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: forgejo-runner
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  json: >-
    {
      "annotations": { "list": [] },
      "description": "Forgejo Actions runner. The runner daemon exposes no Prometheus endpoint, so workflow activity is derived from the Kubernetes Jobs and Pods its k8s plugin creates (kube-state-metrics + cAdvisor).",
      "editable": false,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "title": "Overview",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "options": {
                    "0": { "color": "red", "index": 1, "text": "Not Ready" },
                    "1": { "color": "green", "index": 0, "text": "Ready" }
                  },
                  "type": "value"
                }
              ],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "text", "value": null }] },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 1 },
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "$datasource" },
              "expr": "sum(kube_pod_status_ready{namespace=\"development\", condition=\"true\"} * on (namespace, pod) group_left () kube_pod_labels{namespace=\"development\", label_app_kubernetes_io_name=\"forgejo-runner\"})",
              "instant": true,
              "legendFormat": "Daemon",
              "refId": "A"
            }
          ],
          "title": "Runner Daemon",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 1 }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 1 },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "$datasource" },
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"development\"}[$__range]) * on (namespace, pod) group_left () kube_pod_labels{namespace=\"development\", label_app_kubernetes_io_name=\"forgejo-runner\"}) or vector(0)",
              "instant": true,
              "legendFormat": "Restarts",
              "refId": "A"
            }
          ],
          "title": "Daemon Restarts (Range)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "description": "Jobs the runner is executing right now. The runner is configured with a capacity of 2 concurrent jobs.",
          "fieldConfig": {
            "defaults": {
              "max": 2,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 2 }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 1 },
          "id": 4,
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "$datasource" },
              "expr": "sum(kube_job_status_active{namespace=\"development\", job_name=~\"forgejo-runner-task-.*\"}) or vector(0)",
              "instant": true,
              "legendFormat": "Running",
              "refId": "A"
            }
          ],
          "title": "Running Jobs",
          "type": "gauge"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "text", "value": null }] },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 1 },
          "id": 5,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "$datasource" },
              "expr": "count(max_over_time(kube_job_created{namespace=\"development\", job_name=~\"forgejo-runner-task-.*\"}[$__range])) or vector(0)",
              "instant": true,
              "legendFormat": "Jobs",
              "refId": "A"
            }
          ],
          "title": "Jobs Started (Range)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "description": "Workflow job pods that ended in the Failed phase. Successful pods are deleted by the runner before kube-state-metrics observes them, so there is no matching success count.",
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 1 },
          "id": 6,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "$datasource" },
              "expr": "count(max_over_time(kube_pod_status_phase{namespace=\"development\", phase=\"Failed\"}[$__range]) * on (namespace, pod) group_left () max_over_time(kube_pod_labels{namespace=\"development\", label_app_kubernetes_io_name=\"forgejo-runner-instance\"}[$__range]) > 0) or vector(0)",
              "instant": true,
              "legendFormat": "Failed",
              "refId": "A"
            }
          ],
          "title": "Failed Job Pods (Range)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "description": "Approximated as the last time the Job was observed as active minus its start time. The runner deletes Jobs on completion, so the real duration is up to one scrape interval longer.",
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "text", "value": null }] },
              "unit": "s"
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 1 },
          "id": 7,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "$datasource" },
              "expr": "avg(max by (job_name) (max_over_time(timestamp(kube_job_status_active{namespace=\"development\", job_name=~\"forgejo-runner-task-.*\"})[$__range:1m])) - max by (job_name) (max_over_time(kube_job_status_start_time{namespace=\"development\", job_name=~\"forgejo-runner-task-.*\"}[$__range])))",
              "instant": true,
              "legendFormat": "Avg Duration",
              "refId": "A"
            }
          ],
          "title": "Avg Job Duration (Approx.)",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "id": 8,
          "title": "Workflow Jobs",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineInterpolation": "stepAfter",
                "lineWidth": 2,
                "showPoints": "never",
                "stacking": { "group": "A", "mode": "none" }
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "id": 9,
          "options": {
            "legend": { "calcs": ["max"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "$datasource" },
              "expr": "sum(kube_job_status_active{namespace=\"development\", job_name=~\"forgejo-runner-task-.*\"}) or vector(0)",
              "legendFormat": "Active",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "$datasource" },
              "expr": "sum(kube_job_status_ready{namespace=\"development\", job_name=~\"forgejo-runner-task-.*\"}) or vector(0)",
              "legendFormat": "Ready",
              "refId": "B"
            }
          ],
          "title": "Concurrent Workflow Jobs",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "description": "Pending means the job pod is waiting to be scheduled or is still pulling images.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 30,
                "lineInterpolation": "stepAfter",
                "lineWidth": 1,
                "showPoints": "never",
                "stacking": { "group": "A", "mode": "normal" }
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "id": 10,
          "options": {
            "legend": { "calcs": ["max"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "$datasource" },
              "expr": "sum by (phase) (kube_pod_status_phase{namespace=\"development\"} * on (namespace, pod) group_left () kube_pod_labels{namespace=\"development\", label_app_kubernetes_io_name=\"forgejo-runner-instance\"}) > 0",
              "legendFormat": "{{phase}}",
              "refId": "A"
            }
          ],
          "title": "Workflow Job Pods by Phase",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "description": "Approximated as the last time the Job was observed as active minus its start time.",
          "fieldConfig": {
            "defaults": {
              "custom": { "align": "auto", "cellOptions": { "type": "auto" } },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "text", "value": null }] },
              "unit": "s"
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "job_name" },
                "properties": [{ "id": "displayName", "value": "Job" }]
              },
              {
                "matcher": { "id": "byName", "options": "Value" },
                "properties": [
                  { "id": "displayName", "value": "Duration" },
                  { "id": "custom.cellOptions", "value": { "mode": "basic", "type": "gauge" } }
                ]
              }
            ]
          },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 14 },
          "id": 11,
          "options": {
            "cellHeight": "sm",
            "footer": { "countRows": false, "fields": "", "reducer": ["sum"], "show": false },
            "showHeader": true,
            "sortBy": [{ "desc": true, "displayName": "Duration" }]
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "$datasource" },
              "expr": "topk(20, max by (job_name) (max_over_time(timestamp(kube_job_status_active{namespace=\"development\", job_name=~\"forgejo-runner-task-.*\"})[$__range:1m])) - max by (job_name) (max_over_time(kube_job_status_start_time{namespace=\"development\", job_name=~\"forgejo-runner-task-.*\"}[$__range])))",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Longest Workflow Jobs (Approx.)",
          "transformations": [
            {
              "id": "organize",
              "options": { "excludeByName": { "Time": true }, "indexByName": {}, "renameByName": {} }
            }
          ],
          "type": "table"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "description": "Elapsed time of each Job currently being executed. A line that keeps climbing is a stuck or very long workflow (the runner timeout is 3h).",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "showPoints": "never",
                "stacking": { "group": "A", "mode": "none" }
              },
              "unit": "s"
            }
          },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 14 },
          "id": 12,
          "options": {
            "legend": { "calcs": ["max"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "$datasource" },
              "expr": "time() - max by (job_name) (kube_job_status_start_time{namespace=\"development\", job_name=~\"forgejo-runner-task-.*\"})",
              "legendFormat": "{{job_name}}",
              "refId": "A"
            }
          ],
          "title": "Running Job Age",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 23 },
          "id": 13,
          "title": "Workflow Job Resources",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "showPoints": "never",
                "stacking": { "group": "A", "mode": "none" }
              },
              "unit": "percentunit"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "id": 14,
          "options": {
            "legend": { "calcs": ["max"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "$datasource" },
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"development\", pod=~\"forgejo-runner-task-.*\", container!=\"\"}[$__rate_interval]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "title": "CPU by Workflow Job Pod",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "description": "Workflow job containers are capped at 2Gi (4Gi for the dind sidecar).",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "showPoints": "never",
                "stacking": { "group": "A", "mode": "none" }
              },
              "unit": "bytes"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "id": 15,
          "options": {
            "legend": { "calcs": ["max"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "$datasource" },
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"development\", pod=~\"forgejo-runner-task-.*\", container!=\"\"})",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "title": "Memory by Workflow Job Pod",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "showPoints": "never",
                "stacking": { "group": "A", "mode": "none" }
              },
              "unit": "Bps"
            }
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 32 },
          "id": 16,
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "$datasource" },
              "expr": "sum(rate(container_network_receive_bytes_total{namespace=\"development\", pod=~\"forgejo-runner-task-.*\"}[$__rate_interval]))",
              "legendFormat": "Receive",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "$datasource" },
              "expr": "sum(rate(container_network_transmit_bytes_total{namespace=\"development\", pod=~\"forgejo-runner-task-.*\"}[$__rate_interval]))",
              "legendFormat": "Transmit",
              "refId": "B"
            }
          ],
          "title": "Network I/O (Workflow Job Pods)",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 40 },
          "id": 17,
          "title": "Runner Daemon",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "showPoints": "never",
                "stacking": { "group": "A", "mode": "none" }
              },
              "unit": "percentunit"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 41 },
          "id": 18,
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "$datasource" },
              "expr": "sum by (container) (rate(container_cpu_usage_seconds_total{namespace=\"development\", container=~\"runner|k8s-plugin\"}[$__rate_interval]) * on (namespace, pod) group_left () kube_pod_labels{namespace=\"development\", label_app_kubernetes_io_name=\"forgejo-runner\"})",
              "legendFormat": "{{container}}",
              "refId": "A"
            }
          ],
          "title": "Daemon CPU",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "showPoints": "never",
                "stacking": { "group": "A", "mode": "none" }
              },
              "unit": "bytes"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 41 },
          "id": 19,
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "$datasource" },
              "expr": "sum by (container) (container_memory_working_set_bytes{namespace=\"development\", container=~\"runner|k8s-plugin\"} * on (namespace, pod) group_left () kube_pod_labels{namespace=\"development\", label_app_kubernetes_io_name=\"forgejo-runner\"})",
              "legendFormat": "{{container}}",
              "refId": "A"
            }
          ],
          "title": "Daemon Memory",
          "type": "timeseries"
        }
      ],
      "schemaVersion": 39,
      "tags": ["forgejo", "ci", "actions", "development"],
      "templating": {
        "list": [
          {
            "current": { "selected": false, "text": "Prometheus", "value": "prometheus" },
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource"
          }
        ]
      },
      "time": { "from": "now-24h", "to": "now" },
      "timepicker": {},
      "timezone": "",
      "title": "Forgejo Runner",
      "uid": "forgejo-runner",
      "version": 1
    }
