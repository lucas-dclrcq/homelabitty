---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-runner
spec:
  chartRef:
    kind: OCIRepository
    name: forgejo-runner
  interval: 30m
  values:
    rawResources:
      netpol:
        manifest:
          apiVersion: cilium.io/v2
          kind: CiliumNetworkPolicy
          spec:
            description: "The runner registers and long-polls jobs against forgejo-http.development.svc:3000, and serves its Actions cache proxy to the job pods it spawns"
            endpointSelector:
              matchLabels:
                app.kubernetes.io/name: forgejo-runner
            ingress:
              # Job pods fetch from the cache proxy at ACTIONS_CACHE_URL, which
              # is this pod's IP on cache.proxy_port (pinned in runner.yaml).
              - fromEndpoints:
                  - matchLabels:
                      app.kubernetes.io/name: forgejo-runner-instance
                toPorts:
                  - ports:
                      - port: "45001"
                        protocol: TCP
            egress:
              - toEndpoints:
                  - matchLabels:
                      app.kubernetes.io/name: forgejo
                toPorts:
                  - ports:
                      - port: "3000"
                        protocol: TCP
      # The k8s plugin spawns one Job pod per CI job, labelled from
      # plugins.k8s.options.labels below. The vocabulary labels there cover the
      # internet and the external gateway; these two peers are in-cluster and
      # need naming. Audit sweep 2026-10-22: 1 557 AUDIT flows.
      netpol-task:
        manifest:
          apiVersion: cilium.io/v2
          kind: CiliumNetworkPolicy
          spec:
            description: "CI job pods reach the runner's Actions cache proxy and clone/call the Forgejo API over forgejo-http.development.svc:3000"
            endpointSelector:
              matchLabels:
                app.kubernetes.io/name: forgejo-runner-instance
            egress:
              - toEndpoints:
                  - matchLabels:
                      app.kubernetes.io/name: forgejo-runner
                toPorts:
                  - ports:
                      - port: "45001"
                        protocol: TCP
              - toEndpoints:
                  - matchLabels:
                      app.kubernetes.io/name: forgejo
                toPorts:
                  - ports:
                      - port: "3000"
                        protocol: TCP

    configMaps:
      config:
        suffix: config
        data:
          runner.yaml: |-
            cache:
              enabled: true
              dir: /data/cache
              # Both default to 0 (a fresh random port on every runner restart),
              # which a network policy cannot name. proxy_port is the one job
              # pods dial through ACTIONS_CACHE_URL; see the forgejo-runner-task
              # policy in rawResources above.
              port: 45000
              proxy_port: 45001
            container:
              docker_host: "-"
              workdir_parent: shared/workdir
            host:
              workdir_parent: /data/act
            log:
              level: info
            plugins:
              k8s:
                address: unix:///plugin/forgejo-runner-k8s.sock
                options:
                  namespace: development
                  poll_timeout: 10m
                  labels: "app.kubernetes.io/name=forgejo-runner-instance,app.kubernetes.io/instance=forgejo-runner,egress.home.arpa/internet=allow,egress.home.arpa/gateway-external=allow"
            runner:
              capacity: 2
              file: /persistent/.runner
              labels:
                - ubuntu-latest:k8s:/config/podspec-default.yaml
                - ubuntu-24.04:k8s:/config/podspec-default.yaml
                - default:k8s:/config/podspec-default.yaml
                - docker:k8s:/config/podspec-dind.yaml
              timeout: 3h
          podspec-default.yaml: |-
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  # CI builds saturate node ephemeral disks; keep them away from Postgres instances
                  - labelSelector:
                      matchLabels:
                        postgres-operator.crunchydata.com/cluster: postgres-16
                        postgres-operator.crunchydata.com/data: postgres
                    namespaces:
                      - infrastructure
                    topologyKey: kubernetes.io/hostname
            containers:
              - env:
                  - name: DEBIAN_FRONTEND
                    value: noninteractive
                image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04@sha256:8b7a25c7b3235c27e97df1cbb8411c1d12d2676e739265b5fbb66bb55f72dbf6
                imagePullPolicy: IfNotPresent
                name: main
                resources:
                  limits:
                    memory: 2Gi
                  requests:
                    cpu: 100m
                    memory: 256Mi
            restartPolicy: Never
          podspec-dind.yaml: |-
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  # CI builds saturate node ephemeral disks; keep them away from Postgres instances
                  - labelSelector:
                      matchLabels:
                        postgres-operator.crunchydata.com/cluster: postgres-16
                        postgres-operator.crunchydata.com/data: postgres
                    namespaces:
                      - infrastructure
                    topologyKey: kubernetes.io/hostname
            initContainers:
              - name: dind
                image: docker:29-dind
                securityContext:
                  privileged: true
                restartPolicy: Always
                env:
                  - name: DOCKER_TLS_CERTDIR
                    value: /certs
                resources:
                  # Requests, not just limits: at 256Mi the scheduler treats a CI
                  # job pod as nearly free and packs it onto a node with no
                  # headroom, turning a container OOM into a node-level one.
                  requests:
                    cpu: 500m
                    memory: 1Gi
                  limits:
                    memory: 4Gi
                volumeMounts:
                  - name: docker-storage
                    mountPath: /var/lib/docker
                  - name: docker-certs
                    mountPath: /certs
                readinessProbe:
                  exec:
                    command:
                      - sh
                      - -c
                      - test -f /certs/client/ca.pem && test -f /certs/client/cert.pem && test -f /certs/client/key.pem
                  initialDelaySeconds: 2
                  periodSeconds: 1
            containers:
              - env:
                  - name: DEBIAN_FRONTEND
                    value: noninteractive
                  - name: DOCKER_HOST
                    value: tcp://localhost:2376
                  - name: DOCKER_TLS_VERIFY
                    value: "1"
                  - name: DOCKER_CERT_PATH
                    value: /certs/client
                image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04@sha256:8b7a25c7b3235c27e97df1cbb8411c1d12d2676e739265b5fbb66bb55f72dbf6
                imagePullPolicy: IfNotPresent
                name: main
                # `main` runs the build itself, not the service containers (those
                # live in the dind sidecar). For a Quarkus+Quinoa `mvn verify` that
                # means the Maven JVM, a forked surefire JVM and the whole Node
                # frontend build/test run concurrently here; 2Gi got the job
                # SIGKILLed (exit 137) as the dev services came up.
                resources:
                  limits:
                    memory: 8Gi
                  requests:
                    cpu: "1"
                    memory: 2Gi
                    # Image pulls + buildx layers land on node disk via the
                    # docker-storage emptyDir; make that visible to the scheduler.
                    ephemeral-storage: 20Gi
                volumeMounts:
                  - name: docker-certs
                    mountPath: /certs
                    readOnly: true
            volumes:
              - name: docker-storage
                emptyDir: {}
              - name: docker-certs
                emptyDir: {}
            restartPolicy: Never
    controllers:
      forgejo-runner:
        type: deployment
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          automountServiceAccountToken: true
          # These live here and not under defaultPodOptions: in app-template a
          # controller's pod.labels REPLACES defaultPodOptions.labels outright,
          # so splitting them silently drops every netpol label.
          labels:
            app.kubernetes.io/component: forgejo-runner
            egress.home.arpa/apiserver: allow
            egress.home.arpa/gateway-external: allow
            egress.home.arpa/internet: allow
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
        containers:
          runner:
            image:
              repository: code.forgejo.org/forgejo/runner
              tag: 13.2.1@sha256:568cea8c15ddc01fc8f330124892f572af7db37fa28344a2c1914405793bf61d
            command:
              - sh
              - -ec
              - |
                exec /bin/forgejo-runner daemon \
                  --config /config/runner.yaml \
                  --url "http://forgejo-http.development.svc.cluster.local:3000" \
                  --uuid "$(cat /etc/forgejo-runner-secret/uuid)" \
                  --token-url file:///etc/forgejo-runner-secret/token
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
          k8s-plugin:
            image:
              repository: git.erwanleboucher.dev/eleboucher/runner-k8s-plugin
              tag: 13.2.1@sha256:d62811841a20fd1a311b2c90c6ffcec37d09e52ebb46834b0c04f3ad2a3bcbe7
            args:
              - --listen
              - unix:///plugin/forgejo-runner-k8s.sock
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /config
      plugin:
        type: emptyDir
        globalMounts:
          - path: /plugin
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /data
            subPath: data
          - path: /tmp
            subPath: tmp
      runner-secret:
        type: secret
        name: forgejo-runner-secret
        globalMounts:
          - path: /etc/forgejo-runner-secret
            readOnly: true
    rbac:
      bindings:
        forgejo-runner:
          type: RoleBinding
          roleRef:
            identifier: forgejo-runner
          subjects:
            - identifier: forgejo-runner
      roles:
        forgejo-runner:
          type: Role
          rules:
            - apiGroups:
                - batch
              resources:
                - jobs
              verbs:
                - create
                - get
                - list
                - watch
                - delete
            - apiGroups:
                - ""
              resources:
                - pods
              verbs:
                - get
                - list
                - watch
            - apiGroups:
                - ""
              resources:
                - pods/exec
              verbs:
                - create
                - get
            - apiGroups:
                - ""
              resources:
                - pods/log
              verbs:
                - get
                - list
                - watch
            - apiGroups:
                - ""
              resources:
                - events
              verbs:
                - get
                - list
                - watch
    serviceAccount:
      forgejo-runner: {}
