---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app temporal
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    fullnameOverride: *app

    schema:
      useHelmHooks: false
      podLabels:
        egress.home.arpa/postgres: allow
      resources: &jobResources
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi

    server:
      replicaCount: 1

      podLabels:
        egress.home.arpa/postgres: allow

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      resources:
        requests:
          cpu: 25m
          memory: 256Mi
        limits:
          memory: 1Gi # never set limits.cpu

      config:
        logLevel: "info"

        persistence:
          defaultStore: default
          visibilityStore: visibility
          numHistoryShards: 512
          datastores:
            default:
              sql: &sqlStore
                pluginName: postgres12
                databaseName: temporal
                connectAddr: "postgres-16-primary.infrastructure.svc.cluster.local:5432"
                connectProtocol: tcp
                user: temporal
                existingSecret: temporal-db-secret
                secretKey: password
                createDatabase: false
                maxConns: 10
                maxIdleConns: 10
                maxConnLifetime: 1h
            visibility:
              sql:
                <<: *sqlStore
                databaseName: temporal_visibility

        namespaces:
          create: true
          useHelmHooks: false
          namespace:
            - name: default
              retention: 7d

      frontend:
        containerSecurityContext: &containerSecurityContext
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - "ALL"
      history:
        containerSecurityContext: *containerSecurityContext
      matching:
        containerSecurityContext: *containerSecurityContext
      worker:
        containerSecurityContext: *containerSecurityContext

    admintools:
      enabled: false

    web:
      enabled: true
      replicaCount: 1
      podLabels:
        ingress.home.arpa/gateway-internal: allow
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext: *containerSecurityContext
      resources: *jobResources
      ingress:
        enabled: false
