---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-egress-temporal
spec:
  description: "Pods labeled egress.home.arpa/temporal=allow may reach Temporal on 7233"
  endpointSelector:
    matchLabels:
      egress.home.arpa/temporal: allow
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: temporal
            app.kubernetes.io/component: frontend
            io.kubernetes.pod.namespace: development
      toPorts:
        - ports:
            - port: "7233"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-ingress-temporal
spec:
  description: "Service side of egress.home.arpa/temporal: Temporal accepts 7233 from consumers carrying the label"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: temporal
      app.kubernetes.io/component: frontend
      io.kubernetes.pod.namespace: development
  ingress:
    - fromEndpoints:
        - matchLabels:
            egress.home.arpa/temporal: allow
      toPorts:
        - ports:
            - port: "7233"
              protocol: TCP
