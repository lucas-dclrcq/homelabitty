---
# yaml-language-server: $schema=https://raw.githubusercontent.com/mogenius/renovate-operator/main/charts/renovate-operator/crd/renovate-operator.mogenius.com_renovatejobs.yaml
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: homelabitty
spec:
  discoveryFilters:
    - lucas-dclrcq/homelabitty
    - lucas-dclrcq/nana
  image: ghcr.io/renovatebot/renovate:44.155.1
  parallelism: 1
  provider:
    name: github
  schedule: "0 * * * *"
  secretRef: renovate-secret
  renovateConfig:
    inline: |-
      module.exports = {
        gitAuthor: "DanieloBot <danielobot@ldclrcq.top>",
        secrets: {
          OCHARTED_PASSWORD: process.env.OCHARTED_PASSWORD,
          HARBOR_PASSWORD: process.env.HARBOR_PASSWORD,
          GITHUB_COM_TOKEN: process.env.GITHUB_COM_TOKEN,
        },
        hostRules: [
          {
            matchHost: "ocharted.hoohoot.org",
            allowInternal: true,
          },
          {
            matchHost: "docker.hoohoot.org",
            allowInternal: true,
          },
        ],
      };
