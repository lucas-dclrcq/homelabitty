---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app renovate-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    deployment:
      podLabels:
        ingress.home.arpa/gateway-internal: allow
        ingress.home.arpa/prometheus: allow
        egress.home.arpa/apiserver: allow
        # OIDC code exchange against the public pocket-id hostname (id.hoohoot.org)
        egress.home.arpa/gateway-external: allow
    config:
      # applied by the operator to every Renovate discovery/executor Job pod
      podLabelTemplates:
        egress.home.arpa/internet-https: allow
        egress.home.arpa/gateway-external: allow
        egress.home.arpa/apiserver: allow
    route:
      enabled: true
      hostnames:
        - "renovate.hoohoot.xyz"
      parentRefs:
        - name: internal
          namespace: network
    auth:
      oidc:
        enabled: true
        issuerUrl: "https://id.hoohoot.org"
        clientId: renovate-operator
        existingSecret: renovate-operator-oidc
        secretKey: client-secret
        redirectScheme: https
        additionalScopes:
          - groups
    authorization:
      defaults:
        adminGroups:
          - developers
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
      dashboard:
        enabled: true
        grafanaDashboard:
          allowCrossNamespaceImport: true
          instanceSelector:
            matchLabels:
              grafana.internal/instance: grafana
