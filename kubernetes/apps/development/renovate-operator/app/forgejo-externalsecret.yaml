---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-forgejo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: hashicorp-vault
  target:
    name: renovate-forgejo-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Forgejo PAT for the Renovate bot account (repo:rw, user:r, issue:rw, organization:r)
        RENOVATE_TOKEN: "{{ .forgejo_token }}"
        # github.com token, used for changelogs and the github-* datasources
        GITHUB_COM_TOKEN: '{{ .github_token | default "" }}'
        OCHARTED_PASSWORD: '{{ .ocharted_password | default "" }}'
  dataFrom:
    - extract:
        key: development/renovate
    - extract:
        key: flux-system/ocharted/config
      rewrite:
        - regexp:
            source: "^password$"
            target: "ocharted_password"
