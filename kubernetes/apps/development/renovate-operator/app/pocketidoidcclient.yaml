---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: renovate-operator
spec:
  name: Renovate
  description: Renovate operator dashboard
  clientID: renovate-operator
  instanceSelector:
    matchLabels:
      app.kubernetes.io/name: pocket-id
  launchUrl: https://renovate.hoohoot.xyz
  callbackUrls:
    - https://renovate.hoohoot.xyz/auth/callback
  pkceEnabled: true
  allowedUserGroups:
    - name: developers
      namespace: security
  secret:
    name: renovate-operator-oidc
    keys:
      clientID: client-id
      clientSecret: client-secret
