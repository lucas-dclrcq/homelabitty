---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app harbor
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    fullnameOverride: *app

    expose:
      type: clusterIP
      tls:
        enabled: false
      clusterIP:
        name: harbor

    # nginx is the unified entrypoint the HTTPRoute targets; every component gets
    # the same network-policy label union since the chart only offers per-component
    # podLabels.
    nginx:
      podLabels: &netpolLabels
        ingress.home.arpa/gateway-external: allow
        egress.home.arpa/postgres: allow
        egress.home.arpa/gateway-external: allow
        egress.home.arpa/internet: allow

    externalURL: "https://docker.hoohoot.org"

    existingSecretAdminPassword: harbor-secret
    existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
    existingSecretSecretKey: harbor-secret

    persistence:
      enabled: true
      resourcePolicy: keep
      persistentVolumeClaim:
        registry:
          existingClaim: harbor-registry
          accessMode: ReadWriteMany
        jobservice:
          jobLog:
            size: 2Gi
            accessMode: ReadWriteOnce
        redis:
          size: 1Gi
          accessMode: ReadWriteOnce
        trivy:
          size: 10Gi
          accessMode: ReadWriteOnce
      imageChartStorage:
        type: filesystem
        filesystem:
          rootdirectory: /storage

    database:
      type: external
      external:
        host: postgres-16-primary.infrastructure.svc.cluster.local
        port: "5432"
        username: harbor
        coreDatabase: harbor
        existingSecret: harbor-secret
        sslmode: require

    redis:
      type: internal
      podLabels: *netpolLabels

    trivy:
      enabled: true
      podLabels: *netpolLabels

    notary:
      enabled: false

    metrics:
      enabled: true

    exporter:
      podLabels: *netpolLabels

    portal:
      replicas: 1
      podLabels: *netpolLabels

    core:
      replicas: 1
      podLabels: *netpolLabels
      extraEnvVars:
        - name: CONFIG_OVERWRITE_JSON
          valueFrom:
            secretKeyRef:
              name: harbor-secret
              key: CONFIG_OVERWRITE_JSON

    jobservice:
      replicas: 1
      podLabels: *netpolLabels

    registry:
      replicas: 1
      podLabels: *netpolLabels

    updateStrategy:
      type: Recreate
