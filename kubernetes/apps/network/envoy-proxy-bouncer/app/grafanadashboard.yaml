---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: envoy-proxy-bouncer
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  # The chart ships this dashboard as a ConfigMap behind `grafana.dashboard.enabled`,
  # which only works with the Grafana sidecar; we run the operator, so pull the same
  # JSON directly. It declares no `__inputs` - every panel targets a `datasource`
  # template variable that resolves to the default (prometheus).
  url: https://raw.githubusercontent.com/kdwils/envoy-proxy-bouncer/refs/heads/main/charts/envoy-proxy-bouncer/dashboards/bouncer.json
