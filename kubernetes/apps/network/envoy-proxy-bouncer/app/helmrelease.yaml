---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app envoy-proxy-bouncer
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    fullnameOverride: *app

    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 128Mi

    config:
      server:
        logLevel: info

      # Envoy Gateway sets `X-Envoy-External-Address` to the real client IP
      # (externalTrafficPolicy: Local on the envoy service preserves the source IP).
      trustedIPHeader: X-Envoy-External-Address
      trustedProxies:
        - 10.69.0.0/16

      bouncer:
        enabled: true
        metrics: true
        metricsInterval: 10m
        lapiURL: http://crowdsec-service.network:8080
        tickerInterval: 10s
        apiKeySecretRef:
          name: crowdsec-lapi-secrets
          key: bouncerApiKey

      waf:
        enabled: true
        appSecURL: http://crowdsec-appsec-service.network:7422
        apiKeySecretRef:
          name: crowdsec-lapi-secrets
          key: bouncerApiKey
        failOpen: true
        httpTimeout: 2s

      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
