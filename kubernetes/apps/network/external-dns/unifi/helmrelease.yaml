---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-dns-unifi
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: unifi-dns
  values:
    fullnameOverride: *app
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/home-operations/external-dns-unifi-webhook
          tag: 0.11.0@sha256:663442f116d7b45546782bdf7ace50d05ac15cc630c7236d443d69593845e992
        env:
          - name: UNIFI_HOST
            value: https://192.168.1.1
          - name: UNIFI_API_KEY
            valueFrom:
              secretKeyRef:
                name: &secret external-dns-unifi-secret
                key: EXTERNAL_DNS_UNIFI_API_KEY
        readinessProbe:
          httpGet:
            path: /readyz
            port: http-webhook
          initialDelaySeconds: 30
          timeoutSeconds: 5
    extraArgs:
      - --ignore-ingress-tls-spec
    triggerLoopOnEvent: true
    policy: sync
    sources:
      - "service"
      - "gateway-httproute"
      - "gateway-tcproute"
      - "crd"
    txtOwnerId: main
    txtPrefix: k8s.main.
    domainFilters:
      - "hoohoot.xyz"
      - "hoohoot.org"
    serviceMonitor:
      enabled: true
    podLabels:
      ingress.home.arpa/prometheus: allow
      egress.home.arpa/apiserver: allow
      egress.home.arpa/router: allow
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
