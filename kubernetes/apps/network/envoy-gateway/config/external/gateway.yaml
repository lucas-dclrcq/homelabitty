---
# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
  annotations:
    external-dns.kubernetes.io/target: &hostname gateway-ext.hoohoot.org
spec:
  gatewayClassName: envoy
  infrastructure:
    annotations:
      external-dns.kubernetes.io/hostname: *hostname
      lbipam.cilium.io/ips: "192.168.42.48"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.hoohoot.org"
      allowedRoutes:
        namespaces:
          from: All
    - name: http-root
      protocol: HTTP
      port: 80
      hostname: "hoohoot.org"
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.hoohoot.org"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: "hoohoot-org-production-tls"
    - name: https-root
      protocol: HTTPS
      port: 443
      hostname: "hoohoot.org"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: "hoohoot-org-production-tls"
    - name: http-sqq
      protocol: HTTP
      port: 80
      hostname: "*.superquinquin-sur-deule.org"
      allowedRoutes:
        namespaces:
          from: All
    - name: https-sqq
      protocol: HTTPS
      port: 443
      hostname: "*.superquinquin-sur-deule.org"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: sqq-production-tls
    - name: ssh
      protocol: TCP
      port: 22
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: All
    - name: mqtt-tls
      protocol: TLS
      port: 8883
      hostname: "mqtt.hoohoot.org"
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: "hoohoot-org-production-tls"
    - name: http-mcp
      protocol: HTTP
      port: 80
      hostname: "*.mcp.hoohoot.org"
      allowedRoutes:
        namespaces:
          from: All
    - name: https-mcp
      protocol: HTTPS
      port: 443
      hostname: "*.mcp.hoohoot.org"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: "mcp-hoohoot-org-production-tls"
