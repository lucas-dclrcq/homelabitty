---
# Data-plane egress for the two gateways.
#
# Inside the enrolled namespaces this mirrors the ingress vocabulary exactly: a
# backend that already carries ingress.home.arpa/gateway-<name>=allow (which it
# must, or the route would not work) is reachable, and nothing else is. The
# second rule of each policy covers the handful of backends that live in
# namespaces without a baseline policy, so they carry no label of their own.
# LAN backends reached through FQDN EndpointSlices are covered by
# egress.home.arpa/nas (truenas) and egress.home.arpa/iot (robovac) on the
# EnvoyProxy pod template.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-egress-gateway-external-backends
spec:
  description: "The external gateway proxies to the pods that accept it (ingress.home.arpa/gateway-external) plus the flux-system backends"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: envoy
      gateway.envoyproxy.io/owning-gateway-name: external
      io.kubernetes.pod.namespace: network
  egress:
    - toEndpoints:
        - matchLabels:
            ingress.home.arpa/gateway-external: allow
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: konflate
            io.kubernetes.pod.namespace: flux-system
        - matchLabels:
            app.kubernetes.io/name: ocharted
            io.kubernetes.pod.namespace: flux-system
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # SecurityPolicy ext-auth (components/security-policy/forward-auth): the
    # authentik proxy outpost is created by authentik and carries no label of
    # ours, so it is named here (mirrors the outposts' own ingress rule)
    - toEndpoints:
        - matchLabels:
            app: authentik-outpost
            io.kubernetes.pod.namespace: auth
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
            - port: "9443"
              protocol: TCP
    # flux webhook-receiver
    - toEndpoints:
        - matchLabels:
            app: notification-controller
            io.kubernetes.pod.namespace: flux-system
      toPorts:
        - ports:
            - port: "9292"
              protocol: TCP
    # xDS / rate-limit / wasm from the control plane
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: gateway-helm
            io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            - port: "18000"
              protocol: TCP
            - port: "18001"
              protocol: TCP
            - port: "18002"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-egress-gateway-internal-backends
spec:
  description: "The internal gateway proxies to the pods that accept it (ingress.home.arpa/gateway-internal) plus the kopiur-system/kube-system/rook-ceph backends and the authentik proxy outpost (ext-auth)"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: envoy
      gateway.envoyproxy.io/owning-gateway-name: internal
      io.kubernetes.pod.namespace: network
  egress:
    - toEndpoints:
        - matchLabels:
            ingress.home.arpa/gateway-internal: allow
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kopiur
            io.kubernetes.pod.namespace: kopiur-system
      toPorts:
        - ports:
            - port: "8090"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kopiur-server
            io.kubernetes.pod.namespace: kopiur-system
      toPorts:
        - ports:
            - port: "51515"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s-app: hubble-ui
            io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # the Ceph mgr runs with hostNetwork, so the dashboard is a node address
    # (host/remote-node entity), never a pod identity
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "7000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: rook-ceph-rgw
            io.kubernetes.pod.namespace: rook-ceph
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # SecurityPolicy ext-auth, same as on the external gateway
    - toEndpoints:
        - matchLabels:
            app: authentik-outpost
            io.kubernetes.pod.namespace: auth
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
            - port: "9443"
              protocol: TCP
    # xDS / rate-limit / wasm from the control plane
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: gateway-helm
            io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            - port: "18000"
              protocol: TCP
            - port: "18001"
              protocol: TCP
            - port: "18002"
              protocol: TCP
---
# The egress.home.arpa/gateway-external vocabulary: who may call the external
# gateway, the gateway's matching ingress, and the backends that accept it.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-egress-gateway-external
spec:
  endpointSelector:
    matchLabels:
      egress.home.arpa/gateway-external: allow
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: external
            io.kubernetes.pod.namespace: network
---
# Paired ingress on the envoy pods: the hairpin call lands on the gateway pod,
# which is default-deny like any other pod in `network`. Without this half the
# consumer's egress label is useless once policies are enforced.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-ingress-gateway-external-from-cluster
spec:
  description: "The external envoy pods accept in-cluster callers labeled egress.home.arpa/gateway-external=allow (OIDC hairpin, public hostnames), plus Flux source-controller and the authentik outposts, which no chart value can label"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: envoy
      gateway.envoyproxy.io/owning-gateway-name: external
      io.kubernetes.pod.namespace: network
  ingress:
    - fromEndpoints:
        - matchLabels:
            egress.home.arpa/gateway-external: allow
        - matchLabels:
            app: source-controller
            io.kubernetes.pod.namespace: flux-system
        - matchLabels:
            app: authentik-outpost
            io.kubernetes.pod.namespace: auth
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ingress-allow-external
spec:
  endpointSelector:
    matchLabels:
      ingress.home.arpa/gateway-external: allow
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: external
            io.kubernetes.pod.namespace: network
---
# Same three for the internal gateway.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-egress-gateway-internal
spec:
  description: "Pods labeled egress.home.arpa/gateway-internal=allow may reach the internal envoy gateway (calls to internal hostnames, blackbox probes)"
  endpointSelector:
    matchLabels:
      egress.home.arpa/gateway-internal: allow
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: internal
            io.kubernetes.pod.namespace: network
---
# Paired ingress on the envoy pods, see ./gateway-external.yaml.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-ingress-gateway-internal-from-cluster
spec:
  description: "The internal envoy pods accept in-cluster callers labeled egress.home.arpa/gateway-internal=allow"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: envoy
      gateway.envoyproxy.io/owning-gateway-name: internal
      io.kubernetes.pod.namespace: network
  ingress:
    - fromEndpoints:
        - matchLabels:
            egress.home.arpa/gateway-internal: allow
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ingress-allow-internal
spec:
  endpointSelector:
    matchLabels:
      ingress.home.arpa/gateway-internal: allow
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: internal
            io.kubernetes.pod.namespace: network
