---
# yaml-language-server: $schema=https://raw.githubusercontent.com/envoyproxy/gateway/refs/heads/main/charts/gateway-helm/crds/generated/gateway.envoyproxy.io_envoyproxies.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy
spec:
  logging:
    level:
      default: info
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        pod:
          labels:
            # gateway data-plane: accepts WAN/LAN clients on the LB IPs, is
            # scraped by vmagent (envoy-proxy PodMonitor) and proxies to
            # backends in every namespace; world egress for LAN backends
            # (nas-services FQDN EndpointSlices -> truenas/robovac)
            ingress.home.arpa/world: allow
            ingress.home.arpa/prometheus: allow
            egress.home.arpa/cluster: allow
            egress.home.arpa/world: allow
        container:
          image: mirror.gcr.io/envoyproxy/envoy:v1.40.0
          resources:
            requests:
              cpu: 100m
            limits:
              memory: 1Gi
      envoyService:
        externalTrafficPolicy: Local
  shutdown:
    drainTimeout: 180s
  telemetry:
    metrics:
      prometheus:
        compression:
          type: Gzip
