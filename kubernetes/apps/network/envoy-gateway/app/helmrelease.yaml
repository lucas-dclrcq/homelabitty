---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  values:
    global:
      imageRegistry: mirror.gcr.io
    certgen:
      job:
        pod:
          labels:
            egress.home.arpa/apiserver: allow
    config:
      envoyGateway:
        provider:
          type: Kubernetes
          kubernetes:
            deploy:
              type: GatewayNamespace
    deployment:
      pod:
        labels:
          # kube-apiserver calls the topology-injector mutating webhook served
          # by the controller; the controller itself watches the kube API and
          # is scraped by vmagent via the envoy-gateway ServiceMonitor
          ingress.home.arpa/apiserver: allow
          ingress.home.arpa/prometheus: allow
          egress.home.arpa/apiserver: allow
