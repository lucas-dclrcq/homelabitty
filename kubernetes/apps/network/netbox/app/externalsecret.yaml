---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: hashicorp-vault
  target:
    name: netbox-secret
    template:
      engineVersion: v2
      data:
        # Django / NetBox configuration secrets, read by the chart from
        # /run/secrets/netbox (see charts/netbox/files/configuration.py).
        secret_key: "{{ .NETBOX_SECRET_KEY }}"
        api_token_peppers: "{{ .NETBOX_API_TOKEN_PEPPERS }}"
        db_password: "{{ .pg_password }}"
        # Initial super-user (username, email, password and api_token keys are
        # all mandatory for superuser.existingSecret).
        username: admin
        email: "{{ .NETBOX_SUPERUSER_EMAIL }}"
        password: "{{ .NETBOX_SUPERUSER_PASSWORD }}"
        api_token: "{{ .NETBOX_SUPERUSER_API_TOKEN }}"
        # Pocket ID OIDC client; client-secret is also pushed to Pocket ID by
        # the PocketIDOIDCClient (spec.clientSecretRef).
        client-secret: "{{ .OIDC_CLIENT_SECRET }}"
        oidc.yaml: |
          SOCIAL_AUTH_OIDC_KEY: "netbox"
          SOCIAL_AUTH_OIDC_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: network/netbox
    - extract:
        key: postgres-16-pguser-netbox
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: crunchy-pgo-secrets
      rewrite:
        - regexp:
            source: "(.*)"
            target: "pg_$1"
