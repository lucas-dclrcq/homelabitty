---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app crowdsec
spec:
  interval: 1h
  chart:
    spec:
      chart: crowdsec
      version: 0.24.2
      sourceRef:
        kind: HelmRepository
        name: crowdsec
        namespace: flux-system
      interval: 5m
  values:
    container_runtime: containerd

    podLabels:
      egress.home.arpa/world: allow

    secrets:
      externalSecret:
        name: crowdsec-lapi-secrets

    config:
      parsers:
        s01-parse:
          envoy-logs.yaml: |
            onsuccess: next_stage
            name: crowdsecurity/envoy-logs
            description: "Parse Envoy Gateway JSON access logs"
            filter: "evt.Parsed.program == 'envoy'"
            statics:
              - parsed: envoy_parsed
                expression: UnmarshalJSON(evt.Parsed.message, evt.Unmarshaled, "envoy")
              - meta: log_type
                value: http_access-log
              - meta: service
                value: http
              - meta: source_ip
                expression: evt.Unmarshaled.envoy["x-forwarded-for"]
              - parsed: http_status
                expression: string(evt.Unmarshaled.envoy.response_code)
              - parsed: request
                expression: evt.Unmarshaled.envoy["x-envoy-origin-path"]
              - parsed: verb
                expression: evt.Unmarshaled.envoy.method
              - parsed: http_user_agent
                expression: evt.Unmarshaled.envoy["user-agent"]
              - parsed: target_fqdn
                expression: evt.Unmarshaled.envoy[":authority"]

      config.yaml.local: |
        api:
          server:
            auto_registration:
              enabled: true
              token: "$${REGISTRATION_TOKEN}"
              allowed_ranges:
                - "127.0.0.1/32"
                - "10.69.0.0/16"
        db_config:
          use_wal: true

      profiles.yaml: |
        name: appsec_ip_remediation
        filters:
          - Alert.GetScope() == "Ip" && (Alert.GetScenario() contains "appsec" || Alert.GetScenario() contains "vpatch" || Alert.GetScenario() contains "generic-")
        decisions:
          - type: ban
            duration: 4h
        on_success: break
        ---
        name: default_ip_remediation
        filters:
          - Alert.Remediation == true && Alert.GetScope() == "Ip"
        decisions:
          - type: ban
            duration: 4h
        on_success: break

    lapi:
      replicas: 1
      env:
        - name: ENROLL_KEY
          valueFrom:
            secretKeyRef:
              name: crowdsec-lapi-secrets
              key: enrollmentKey
        - name: ENROLL_INSTANCE_NAME
          value: hoohoot
        - name: ENROLL_TAGS
          value: homelab
        - name: BOUNCER_KEY_ENVOY_PROXY_BOUNCER
          valueFrom:
            secretKeyRef:
              name: crowdsec-lapi-secrets
              key: bouncerApiKey
      resources:
        requests:
          cpu: 50m
          memory: 100Mi
        limits:
          memory: 512Mi
      persistentVolume:
        data:
          enabled: true
          size: 1Gi
          accessModes:
            - ReadWriteOnce
        config:
          enabled: true
          size: 100Mi
          accessModes:
            - ReadWriteOnce

    agent:
      additionalAcquisition:
        - source: file
          # Envoy Gateway creates one data-plane deployment per Gateway
          # (`external` and `internal`), each running an `envoy` container
          # alongside `shutdown-manager`.
          filenames:
            - /var/log/containers/external-*_network_envoy-*.log
            - /var/log/containers/internal-*_network_envoy-*.log
          labels:
            type: containerd
            program: envoy
          poll_without_inotify: true
      env:
        - name: PARSERS
          value: "crowdsecurity/cri-logs"
        - name: COLLECTIONS
          value: "crowdsecurity/base-http-scenarios crowdsecurity/http-cve crowdsecurity/linux"
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi

    appsec:
      enabled: true
      replicas: 2
      env:
        - name: COLLECTIONS
          value: "crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules"
      acquisitions:
        - source: appsec
          listen_addr: "0.0.0.0:7422"
          path: /
          appsec_configs:
            - crowdsecurity/virtual-patching
            - crowdsecurity/generic-rules
          labels:
            type: appsec
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
