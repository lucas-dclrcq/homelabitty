---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: crowdsec-rules
spec:
  groups:
    - name: crowdsec.rules
      rules:
        # `origin="crowdsec"` is the local engine deciding on our own logs, as
        # opposed to `origin="CAPI"` - the community blocklist, which holds ~15k
        # IPs at all times and would make this alert meaningless.
        #
        # Bans last 4h (see the profiles in the HelmRelease) but we only want an
        # hour of alert. `cs_active_decisions` is a gauge, so it cannot express
        # "new ban": a first ban for a scenario creates a series that is flat at
        # 1, which delta() and changes() both read as no change. So gate it on
        # the bouncer's counter, which does increase, and keep the gauge only to
        # carry the `reason` label into the notification. `and on()` matches
        # many-to-one while ignoring labels.
        #
        # Caveat: a bouncer restart replays its local decisions into a fresh
        # counter, which re-fires this for an hour.
        - alert: CrowdSecLocalBan
          annotations:
            summary: CrowdSec banned an IP
            description: >-
              {{ $value }} active ban(s) from scenario {{ $labels.reason }}.
              This clears after an hour; the ban itself lasts 4h. Prometheus
              does not carry the addresses - run
              `cscli decisions list --origin crowdsec` on the LAPI for those.
          expr: |
            sum by (reason) (cs_active_decisions{action="ban", origin="crowdsec"})
              and on()
            (sum(increase(bouncer_lapi_decisions_added_total{origin="crowdsec"}[1h])) > 0)
          labels:
            severity: warning
