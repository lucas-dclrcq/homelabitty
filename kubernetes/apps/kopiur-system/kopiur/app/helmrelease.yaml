# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kopiur
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    # The chart ships its CRDs in crds/, which plain helm upgrade never touches
    crds: CreateReplace
  values:
    features:
      # Copy the ClusterRepository credentials Secret into each mover namespace,
      # replacing volsync's per-app duplicated SOPS secrets
      credentialProjection:
        enabled: true
      # Required for ClusterRepository spec.server (the kopia web UI)
      kopiaUi:
        enabled: true
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            grafana.internal/instance: grafana
    ui:
      enabled: true
      auth:
        # No authenticating proxy in front: every request runs as this fixed
        # identity, bound to kopiur-ui-user in clusterrolebinding.yaml
        anonymous:
          enabled: true
          user: kopiur-ui-anonymous
    # The mutating admission webhook is fail-closed (failurePolicy: Fail) and
    # single-replica by default, so a chart rollout briefly leaves it
    # unreachable and every kopiur CR write (e.g. the zigbee2mqtt Kustomization
    # dry-run) fails. Two replicas with a PDB keep it serving through rollouts
    # and voluntary disruptions.
    webhook:
      replicaCount: 2
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 2Gi
