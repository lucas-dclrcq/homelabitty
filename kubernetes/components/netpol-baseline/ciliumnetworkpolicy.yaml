---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: baseline
spec:
  description: "Default-deny both directions; only kube-dns is open. Every other flow, same-namespace included, must be whitelisted."
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEntities:
        - host
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
