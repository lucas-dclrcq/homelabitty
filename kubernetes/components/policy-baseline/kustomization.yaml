---
# Per-namespace enrolment in the cluster's ValidatingAdmissionPolicies.
# Including this component from a namespace's kustomization.yaml (next to
# ../../components/common) labels that namespace, and every policy binding in
# kubernetes/apps/security/admission-policies selects on that label. The
# system namespaces (kube-system, flux-system, rook-ceph, cert-manager,
# external-secrets, kopiur-system, openebs-system, system-upgrade) deliberately
# do not include it — same list as netpol-baseline. See
# kubernetes/apps/security/admission-policies/README.md.
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  # components/common ships the Namespace under the placeholder name
  # `not-used`; the directory's `namespace:` transformer renames it afterwards,
  # so the patch has to target the placeholder.
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: not-used
        labels:
          policy.home.arpa/admission: enforce
