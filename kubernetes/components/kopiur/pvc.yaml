---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "${APP}"
  annotations:
    # A bound PVC's dataSourceRef is immutable, and PVCs migrated from volsync
    # still reference volsync.backube/ReplicationDestination. Only ever CREATE
    # this claim (fresh app or disaster recovery) - never patch an existing one.
    # Trade-off: capacity changes no longer propagate from Git; resize with
    # kubectl patch, then mirror the value here.
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  accessModes: ["${KOPIUR_ACCESSMODES:=ReadWriteOnce}"]
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: "${APP}"
  resources:
    requests:
      storage: "${KOPIUR_CAPACITY:=5Gi}"
  storageClassName: "${KOPIUR_STORAGECLASS:=ceph-block}"
