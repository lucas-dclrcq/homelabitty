---
# yaml-language-server: $schema=https://schemas.tholinka.dev/dragonflydb.io/dragonfly_v1alpha1.json
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: ${APP}-dragonfly
spec:
  image: ghcr.io/dragonflydb/dragonfly:v2.1.0
  replicas: 2
  env:
    - name: MAX_MEMORY
      valueFrom:
        resourceFieldRef:
          resource: limits.memory
          divisor: 1Mi
  args:
    - --maxmemory=$(MAX_MEMORY)Mi
    - --proactor_threads=${DRAGONFLY_ARGS_THREADS:=2}
    - ${DRAGONFLY_ARG_CLUSTER_MODE:=--cluster_mode=emulated}
    - ${DRAGONFLY_ARG_LOCK_ON_HASHTAGS:=--lock_on_hashtags}
    - --default_lua_flags=${DRAGONFLY_ARGS_DEFAULT_LUA_FLAGS:=}
    - --primary_port_http_enabled=true
  # Dragonfly runs as root in-container and mounts no volumes; the operator
  # already sets fsGroup pod-wide, so only the container context is missing.
  # SETUID/SETGID stay: the entrypoint setpriv's down to dfly (999) at startup.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
      add: ["SETUID", "SETGID"]
  resources:
    requests:
      cpu: ${DRAGONFLY_REQUESTS_CPU:=100m}
      memory: ${DRAGONFLY_REQUESTS_MEMORY:-${DRAGONFLY_LIMITS_MEMORY:=512Mi}}
    limits:
      memory: ${DRAGONFLY_LIMITS_MEMORY:=512Mi}
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: "kubernetes.io/hostname"
      whenUnsatisfiable: "DoNotSchedule"
      labelSelector:
        matchLabels:
          app.kubernetes.io/part-of: dragonfly
